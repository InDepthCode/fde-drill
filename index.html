<style>
/* Layout: one calm column. Today shows a single "next up" card and one checklist; everything else is one tap away. */
:root {
  --bg: #F6F7F9;
  --surface: #FFFFFF;
  --sunk: #EEF0F4;
  --ink: #161A22;
  --muted: #646C7C;
  --line: #E3E6EC;
  --accent: #2B47CF;
  --accent-ink: #FFFFFF;
  --accent-soft: #EBEEFC;
  --good: #1B7A4B;

  --help: #8A5A00;
  --help-soft: #FBF1DC;
  --redo: #B3261E;
  --redo-soft: #FBE8E6;
  --code-bg: #F2F4F8;
  --code-kw: #2B47CF;
  --code-str: #1B7A4B;
  --code-com: #7A8293;
  --code-num: #A6520A;
  --code-type: #7A3BB8;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1217; --surface: #171B22; --sunk: #1D222B; --ink: #E7EAF0; --muted: #9AA2B1; --line: #272D38;
    --accent: #8197FF; --accent-ink: #0F1217; --accent-soft: #1E2643;
    --good: #5CCB8F; --good-soft: #15291F; --help: #E8B85A; --help-soft: #2B2412; --redo: #FF8A80; --redo-soft: #331A19;
    --code-bg: #12161D; --code-kw: #8FA2FF; --code-str: #7BD3A0; --code-com: #6F7889; --code-num: #F0A35E; --code-type: #C79BFF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1217; --surface: #171B22; --sunk: #1D222B; --ink: #E7EAF0; --muted: #9AA2B1; --line: #272D38;
  --accent: #8197FF; --accent-ink: #0F1217; --accent-soft: #1E2643;
  --good: #5CCB8F; --good-soft: #15291F; --help: #E8B85A; --help-soft: #2B2412; --redo: #FF8A80; --redo-soft: #331A19;
  --code-bg: #12161D; --code-kw: #8FA2FF; --code-str: #7BD3A0; --code-com: #6F7889; --code-num: #F0A35E; --code-type: #C79BFF;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
p { margin: 0; }
code { font-family: var(--font-mono); font-size: .92em; }

.wrap { max-width: 720px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.top .wrap { padding-block: 10px 0; }
.brand { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.brand h1 { font-size: 18px; font-weight: 700; }
.brand span { font-size: 13.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tabs { display: flex; gap: 2px; margin-top: 6px; margin-bottom: -1px; }
.tabs a { flex: 1; text-align: center; text-decoration: none; color: var(--muted); padding: 9px 4px 11px; border-bottom: 2px solid transparent; font-weight: 500; font-size: 15px; white-space: nowrap; }
.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }

main .wrap { padding-block: 22px 60px; display: grid; gap: 20px; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.head h2 { font-size: 27px; font-weight: 700; line-height: 1.2; margin-top: 2px; }
.kicker { font-size: 13.5px; color: var(--muted); font-weight: 500; }
.headrow { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.arrows { display: flex; gap: 6px; flex: none; }
.ghost { border: 1px solid var(--line); background: transparent; border-radius: 99px; padding: 5px 12px; cursor: pointer; font-size: 14px; color: var(--ink); text-decoration: none; }
.ghost:hover { border-color: var(--accent); }
.ghost[disabled] { opacity: .35; cursor: default; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-weight: 500; text-align: left; }

.progress { display: flex; align-items: center; gap: 12px; font-size: 14px; color: var(--muted); }
.bar { flex: 1; height: 8px; background: var(--sunk); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--good); border-radius: 99px; transition: width .3s; }

.next { background: var(--accent); color: var(--accent-ink); border-radius: 16px; padding: 18px 20px; display: grid; gap: 6px; }
.next .lbl { font-size: 12.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; opacity: .85; }
.next .what { font-family: var(--font-display); font-size: 22px; font-weight: 600; line-height: 1.25; }
.next .sub { opacity: .85; font-size: 14.5px; }
.next .go { margin-top: 8px; justify-self: start; background: var(--accent-ink); color: var(--accent); border: 0; border-radius: 99px; padding: 10px 20px; font-weight: 600; cursor: pointer; text-decoration: none; font-size: 15px; }
.next.done { background: var(--good-soft); color: var(--ink); }
.next.done .go { background: var(--good); color: var(--surface); }

.list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.list > * + * { border-top: 1px solid var(--line); }
.row { display: flex; align-items: center; gap: 12px; padding: 13px 16px; text-decoration: none; color: inherit; min-height: 52px; }
a.row:hover, label.row:hover { background: var(--sunk); }
label.row { cursor: pointer; }
.row .t { flex: 1; min-width: 0; }
.row .t small { display: block; color: var(--muted); font-size: 13.5px; }
.row .chev { color: var(--muted); font-size: 20px; line-height: 1; flex: none; }
.row input[type=checkbox] { width: 20px; height: 20px; margin: 0; accent-color: var(--good); flex: none; }
.row.done .t { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
.row .open { font-size: 14px; font-weight: 600; text-decoration: none; flex: none; }
.dot { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); flex: none; display: grid; place-items: center; font-size: 11px; color: var(--surface); }
.dot.solved { background: var(--good); border-color: var(--good); }
.dot.help { background: var(--help); border-color: var(--help); }
.dot.redo { border-color: var(--redo); border-style: dashed; }
.lvl { font-size: 13px; font-weight: 600; color: var(--muted); flex: none; }
.lvl.Easy { color: var(--good); } .lvl.Medium { color: var(--help); } .lvl.Hard { color: var(--redo); }
.sectionlabel { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; margin-bottom: -10px; }

.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 14px; cursor: pointer; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; display: grid; gap: 12px; min-width: 0; }
.example { font-family: var(--font-mono); font-size: 13.5px; background: var(--code-bg); border-radius: 8px; padding: 10px 12px; white-space: pre-wrap; word-break: break-word; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 8px 16px; cursor: pointer; font-weight: 500; text-decoration: none; color: var(--ink); display: inline-flex; gap: 6px; align-items: center; font-size: 15px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.timer { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 14px; color: var(--muted); }
.tip { background: var(--help-soft); border-radius: var(--r); padding: 12px 16px; font-size: 14.5px; }
.tip b { color: var(--help); }

.clue { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; display: grid; gap: 10px; min-width: 0; }
.clue h3 { font-size: 16px; font-weight: 600; display: flex; gap: 10px; align-items: center; }
.clue h3 .num { width: 24px; height: 24px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-size: 13px; flex: none; }
.clue ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.signal { background: var(--accent-soft); border-radius: 8px; padding: 10px 12px; font-size: 15px; }
.clue ol.quick { list-style: none; padding: 0; margin: 0; display: grid; gap: 0; }
.quick li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 12px; padding: 9px 0; align-items: start; }
.quick li + li { border-top: 1px dashed var(--line); }
.quick .n { width: 24px; height: 24px; border-radius: 50%; background: var(--sunk); color: var(--muted); display: grid; place-items: center; font-size: 12.5px; font-weight: 600; margin-top: 1px; }
.quick .txt b { font-weight: 500; display: block; }
.quick .txt small { display: block; color: var(--muted); font-size: 13.5px; margin-top: 1px; }
.quick .more { display: block; margin-top: 6px; font-size: 14px; color: var(--ink); }
.quick .more em { display: block; font-style: normal; color: var(--muted); font-size: 13px; margin-top: 3px; font-family: var(--font-mono); }
.cluebar { display: grid; gap: 10px; }
.steps { display: flex; gap: 6px; }
.steps i { flex: 1; height: 5px; border-radius: 99px; background: var(--sunk); }
.steps i.on { background: var(--accent); }

.puzzle { display: grid; gap: 10px; min-width: 0; }
.pzcode { font-family: var(--font-mono); font-size: 12.5px; background: var(--code-bg); border-radius: 8px; padding: 10px 12px; overflow-x: auto; display: grid; gap: 4px; }
.pzr { white-space: pre; line-height: 1.6; min-height: 1.6em; }
.slot { font: inherit; color: inherit; display: inline-block; min-width: 24ch; border-radius: 6px; padding: 0 8px; margin: 0; line-height: 1.6; vertical-align: top; text-align: left; cursor: pointer; white-space: pre; -webkit-appearance: none; appearance: none; }
.slot.empty { border: 1.5px dashed var(--muted); background: transparent; color: var(--muted); font-family: var(--font-body); font-size: 12px; height: 1.9em; }
.slot.empty.active { height: auto; padding: 4px 10px; }
.slot.empty.active { border: 2px solid var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.slot.filled { background: var(--surface); border: 1.5px solid var(--line); }
.slot.ok { border-color: var(--good); background: var(--good-soft); }
.slot.bad { border-color: var(--redo); background: var(--redo-soft); }
.pzpool { display: grid; gap: 6px; padding: 10px; border: 2px solid var(--accent); border-radius: 10px; background: var(--surface); min-width: 0; }
.pzlabel { font-size: 12px; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: .07em; padding: 2px 2px 4px; }
.blk { font: inherit; font-family: var(--font-mono); font-size: 13px; color: var(--ink); text-align: left; background: var(--bg); border: 1.5px solid var(--line); border-radius: 8px; padding: 10px 12px; cursor: pointer; white-space: pre-wrap; word-break: break-word; width: 100%; }
.blk:hover, .blk:focus-visible { border-color: var(--accent); background: var(--accent-soft); }
.pzmsg { margin: 0; color: var(--muted); font-size: 14px; }
.pzmsg.bad { color: var(--redo); font-weight: 500; }
.pzwin { background: var(--good-soft); border-radius: 10px; padding: 12px 14px; display: grid; gap: 10px; font-size: 15px; }
.pzwin b { color: var(--good); }
.codewrap { position: relative; min-width: 0; }
pre.code { margin: 0; font-family: var(--font-mono); font-size: 13px; line-height: 1.6; background: var(--code-bg); border-radius: 8px; padding: 14px; overflow-x: auto; tab-size: 4; }
pre.code.wrapc { white-space: pre-wrap; word-break: break-word; padding: 12px; }
pre.code .k { color: var(--code-kw); font-weight: 500; } pre.code .s { color: var(--code-str); } pre.code .c { color: var(--code-com); font-style: italic; } pre.code .n { color: var(--code-num); } pre.code .y { color: var(--code-type); }
pre.code .o { color: var(--good); font-weight: 500; }
pre.code .blank { display: inline-block; border: 1.5px dashed var(--code-num); color: var(--code-num); border-radius: 5px; padding: 0 10px; font-weight: 500; min-width: 16ch; }
.copy { position: absolute; top: 8px; right: 8px; font-size: 12.5px; padding: 3px 11px; }
.answers { margin: 0; padding-left: 22px; display: grid; gap: 4px; font-family: var(--font-mono); font-size: 13px; }
.answers li { word-break: break-word; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 14px; font-size: 14.5px; }
.kv dt { color: var(--muted); font-weight: 500; }
.kv dd { margin: 0; }

.status { display: grid; gap: 8px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.status button { border: 1.5px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 12px 8px; cursor: pointer; font-weight: 500; font-size: 14.5px; }
.status button[aria-pressed="true"].solved { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.status button[aria-pressed="true"].help { background: var(--help-soft); border-color: var(--help); color: var(--help); }
.status button[aria-pressed="true"].redo { background: var(--redo-soft); border-color: var(--redo); color: var(--redo); }
.pager { display: flex; justify-content: space-between; gap: 10px; }
.pager a { max-width: 48%; }

details.m { padding: 0; }
details.m > summary { list-style: none; cursor: pointer; padding: 13px 16px; display: grid; gap: 2px; }
details.m > summary::-webkit-details-marker { display: none; }
details.m > summary .use { font-family: var(--font-mono); font-size: 14px; font-weight: 500; word-break: break-word; }
details.m > summary .does { color: var(--muted); font-size: 14px; }

details.m .body { padding: 12px 16px 16px; display: grid; gap: 10px; }
.pit { background: var(--redo-soft); border-radius: 8px; padding: 8px 10px; font-size: 14px; }
.pit b { color: var(--redo); }
.used { display: flex; gap: 6px; flex-wrap: wrap; font-size: 13.5px; align-items: center; }
.used a { text-decoration: none; border: 1px solid var(--line); border-radius: 99px; padding: 2px 10px; color: var(--ink); }
.search { width: 100%; font: inherit; font-size: 16px; padding: 13px 16px; border: 1.5px solid var(--line); border-radius: var(--r); background: var(--surface); color: var(--ink); }
.search:focus { outline: none; border-color: var(--accent); }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--sunk); border-radius: 99px; padding: 4px; }
.seg button { border: 0; background: transparent; border-radius: 99px; padding: 8px; cursor: pointer; font-weight: 500; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .08); }

.flash { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 28px 22px; min-height: 240px; display: grid; align-content: center; gap: 14px; cursor: pointer; text-align: left; width: 100%; }
.flash .q { font-family: var(--font-display); font-size: 22px; font-weight: 600; line-height: 1.3; }
.flash .a { font-size: 16px; }
.flash .a.mono { font-family: var(--font-mono); font-size: 14px; line-height: 1.6; word-break: break-word; }
.flash .hint { color: var(--muted); font-size: 13.5px; }
.cardnav { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.cardnav button { border: 1.5px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 12px; cursor: pointer; font-weight: 600; }
.cardnav .yes { border-color: var(--good); color: var(--good); }
.cardnav .no { border-color: var(--redo); color: var(--redo); }
.quizopts { display: grid; gap: 8px; }
.qopt { font-family: var(--font-mono); font-size: 14px; text-align: left; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 11px 14px; cursor: pointer; }
.qopt:hover:not([disabled]) { border-color: var(--accent); }
.qopt.right { border-color: var(--good); background: var(--good-soft); color: var(--good); font-weight: 600; }
.qopt.wrong { border-color: var(--redo); background: var(--redo-soft); color: var(--redo); }
.qopt.dim { opacity: .55; }
.qopt[disabled] { cursor: default; }
.qwhy { border-radius: 10px; padding: 12px 14px; font-size: 15px; }
.qwhy.ok { background: var(--good-soft); } .qwhy.ok b { color: var(--good); }
.qwhy.no { background: var(--redo-soft); } .qwhy.no b { color: var(--redo); }
.flash { cursor: pointer; -webkit-tap-highlight-color: transparent; }
.flash.open { align-content: start; }
.flash .fq { display: grid; gap: 12px; cursor: pointer; }
.flash.open .fq { padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.ans { display: grid; gap: 14px; }
.ans .sec { display: grid; gap: 4px; }
.ans .lbl { font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.ans .sec p { margin: 0; font-size: 15.5px; }
.ans .say p { font-size: 17px; font-weight: 600; color: var(--ink); }
.ans .say .lbl { color: var(--accent); }
.ans .push { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; }
.ans .push .lbl { color: var(--accent); }
.ans pre.code { margin-top: 6px; font-size: 12.5px; }
.sv { display: grid; gap: 8px; border-top: 1px dashed var(--line); padding-top: 10px; }
.sync { color: var(--muted); font-size: 12.5px; text-align: center; }
.empty { background: var(--sunk); border-radius: var(--r); padding: 16px; color: var(--muted); }
select.deck { font: inherit; font-size: 15px; padding: 9px 12px; border: 1.5px solid var(--line); border-radius: var(--r); background: var(--surface); color: var(--ink); width: 100%; }

@media (max-width: 480px) {
  .head h2 { font-size: 24px; }

  .status button { font-size: 13.5px; padding: 11px 4px; }

}
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }

const DATA = {"problems": [{"id": "two-sum", "day": 1, "pattern": "Arrays & hashing", "title": "Two Sum", "slug": "two-sum", "level": "Easy", "premium": false, "statement": "Given an integer array and a target, return the indexes of the two numbers that add up to the target. Exactly one answer exists and you can't use the same element twice.", "example": "nums = [2, 7, 11, 15], target = 9  →  [0, 1]", "signal": "\"Find a pair that sums to X\" in an unsorted array → store what you've seen in a HashMap.", "approach": ["Walk the array once.", "For each value, compute need = target − value.", "If need is already in the map (value → index), return both indexes.", "Otherwise store the current value and its index."], "code": "import java.util.*;\n\nclass Solution {\n    public int[] twoSum(int[] nums, int target) {\n        Map<Integer, Integer> seen = new HashMap<>(); // value -> index\n        for (int i = 0; i < nums.length; i++) {\n            int need = target - nums[i];\n            if (seen.containsKey(need)) return new int[]{seen.get(need), i};\n            seen.put(nums[i], i);\n        }\n        return new int[0];\n    }\n}", "complexity": "Time O(n), space O(n).", "pitfall": "Check the map before inserting the current number, or [3, 3] with target 6 can match an element with itself.", "puz": [[0, "import java.util.*;", false], [0, "", false], [0, "class Solution {", false], [4, "public int[] twoSum(int[] nums, int target) {", false], [8, "Map<Integer, Integer> seen = new HashMap<>(); // value -> index", true], [8, "for (int i = 0; i < nums.length; i++) {", false], [12, "int need = target - nums[i];", true], [12, "if (seen.containsKey(need)) return new int[]{seen.get(need), i};", true], [12, "seen.put(nums[i], i);", true], [8, "}", false], [8, "return new int[0];", false], [4, "}", false], [0, "}", false]], "plain": ["Go through the numbers one by one, from left to right.", "For the current number, work out which partner number would add up to the target. (Target 9 and current 2 means we need 7.)", "Check whether we've already met that partner earlier. If yes, we're done: return where we saw it and where we are now.", "If not, remember the current number and its position, so a later number can find it as its partner."], "short": [["Go through the numbers one by one", ""], ["Work out the partner you need", "partner = target − current"], ["Seen the partner before? Return both positions", ""], ["Otherwise remember this number and its position", "so later numbers can find it"]], "tpl": "hashmap", "tools": ["map-put", "map-get", "map-containskey"]}, {"id": "group-anagrams", "day": 1, "pattern": "Arrays & hashing", "title": "Group Anagrams", "slug": "group-anagrams", "level": "Medium", "premium": false, "statement": "Given a list of words, group together the words that are anagrams of each other (same letters, different order). Return the groups in any order.", "example": "[\"eat\",\"tea\",\"tan\",\"ate\",\"nat\",\"bat\"]  →  [[eat,tea,ate],[tan,nat],[bat]]", "signal": "\"Group items that are equivalent\" → build a canonical key for each item and group by it in a HashMap.", "approach": ["For each word, sort its characters to get a key (\"eat\" → \"aet\").", "Use computeIfAbsent to add the word to the list for that key.", "Return the map's values."], "code": "import java.util.*;\n\nclass Solution {\n    public List<List<String>> groupAnagrams(String[] strs) {\n        Map<String, List<String>> groups = new HashMap<>();\n        for (String s : strs) {\n            char[] c = s.toCharArray();\n            Arrays.sort(c);\n            groups.computeIfAbsent(new String(c), k -> new ArrayList<>()).add(s);\n        }\n        return new ArrayList<>(groups.values());\n    }\n}", "complexity": "Time O(n · k log k) for n words of length k, space O(n · k).", "pitfall": "Use new String(chars) as the key, not chars.toString(), which gives an object reference.", "puz": [[0, "import java.util.*;", false], [0, "", false], [0, "class Solution {", false], [4, "public List<List<String>> groupAnagrams(String[] strs) {", false], [8, "Map<String, List<String>> groups = new HashMap<>();", false], [8, "for (String s : strs) {", false], [12, "char[] c = s.toCharArray();", true], [12, "Arrays.sort(c);", true], [12, "groups.computeIfAbsent(new String(c), k -> new ArrayList<>()).add(s);", true], [8, "}", false], [8, "return new ArrayList<>(groups.values());", true], [4, "}", false], [0, "}", false]], "plain": ["For each word, sort its letters. Anagrams always give the same sorted result (eat, tea and ate all become aet), so that becomes the group's name.", "Put the word into the group with that name, creating the group the first time we see the name.", "At the end, hand back all the groups."], "short": [["Sort each word's letters", "anagrams match: eat → aet"], ["Add the word to the group for that sorted key", ""], ["Return all the groups", ""]], "tpl": "hashmap", "tools": ["map-computeifabsent", "map-keys-values", "list-add", "list-of-lists", "arr-sort", "str-sortchars"], "streams": "import java.util.*;\nimport java.util.stream.*;\n\nclass Solution {\n    public List<List<String>> groupAnagrams(String[] strs) {\n        return new ArrayList<>(Arrays.stream(strs)\n                .collect(Collectors.groupingBy(s -> {\n                    char[] c = s.toCharArray();\n                    Arrays.sort(c);\n                    return new String(c);\n                }))\n                .values());\n    }\n}", "streamsNote": "Same complexity as the loop. groupingBy with the sorted letters as the key is a natural fit, so this is a strong answer on its own."}, {"id": "top-k-frequent", "day": 1, "pattern": "Arrays & hashing", "title": "Top K Frequent Elements", "slug": "top-k-frequent-elements", "level": "Medium", "premium": false, "statement": "Given an integer array and k, return the k values that appear most often. Any order is fine.", "example": "nums = [1,1,1,2,2,3], k = 2  →  [1, 2]", "signal": "\"Top k by count\" → count with a HashMap, then either a heap of size k or bucket sort by frequency.", "approach": ["Count each value with map.merge(n, 1, Integer::sum).", "Create buckets[0..n]; put each value into buckets[its count].", "Walk buckets from the highest count down, collecting values until you have k."], "code": "import java.util.*;\n\nclass Solution {\n    public int[] topKFrequent(int[] nums, int k) {\n        Map<Integer, Integer> count = new HashMap<>();\n        for (int n : nums) count.merge(n, 1, Integer::sum);\n\n        List<List<Integer>> buckets = new ArrayList<>(); // index = frequency\n        for (int i = 0; i <= nums.length; i++) buckets.add(new ArrayList<>());\n        for (var e : count.entrySet()) buckets.get(e.getValue()).add(e.getKey());\n\n        int[] res = new int[k];\n        int i = 0;\n        for (int f = nums.length; f >= 0 && i < k; f--) {\n            for (int n : buckets.get(f)) {\n                if (i == k) break;\n                res[i++] = n;\n            }\n        }\n        return res;\n    }\n}", "complexity": "Time O(n), space O(n). The heap version is O(n log k), also a fine answer.", "pitfall": "Mention both approaches; interviewers often ask for the heap version as a follow-up.", "puz": [[0, "import java.util.*;", false], [0, "", false], [0, "class Solution {", false], [4, "public int[] topKFrequent(int[] nums, int k) {", false], [8, "Map<Integer, Integer> count = new HashMap<>();", true], [8, "for (int n : nums) count.merge(n, 1, Integer::sum);", true], [0, "", false], [8, "List<List<Integer>> buckets = new ArrayList<>(); // index = frequency", true], [8, "for (int i = 0; i <= nums.length; i++) buckets.add(new ArrayList<>());", false], [8, "for (var e : count.entrySet()) buckets.get(e.getValue()).add(e.getKey());", true], [0, "", false], [8, "int[] res = new int[k];", true], [8, "int i = 0;", false], [8, "for (int f = nums.length; f >= 0 && i < k; f--) {", true], [12, "for (int n : buckets.get(f)) {", false], [16, "if (i == k) break;", false], [16, "res[i++] = n;", true], [12, "}", false], [8, "}", false], [8, "return res;", true], [4, "}", false], [0, "}", false]], "plain": ["Count how many times each number appears.", "Make shelves numbered by count: shelf 3 holds every number that appears 3 times. Put each number on its shelf.", "Start from the highest shelf and walk down, picking numbers until we have k. The most frequent numbers sit on the top shelves."], "short": [["Count each number", ""], ["Put numbers on shelves by count", "shelf 3 = appears 3 times"], ["Take from the top shelf down until you have k", ""]], "tpl": "hashmap", "tools": ["map-get", "map-merge", "map-entryset", "list-add", "list-get-set", "list-of-lists"], "streams": "import java.util.*;\nimport java.util.stream.*;\n\nclass Solution {\n    public int[] topKFrequent(int[] nums, int k) {\n        return Arrays.stream(nums).boxed()\n                .collect(Collectors.groupingBy(n -> n, Collectors.counting()))\n                .entrySet().stream()\n                .sorted(Map.Entry.<Integer, Long>comparingByValue().reversed())\n                .limit(k)\n                .mapToInt(Map.Entry::getKey)\n                .toArray();\n    }\n}", "streamsNote": "Shorter, but O(n log n) because of the sort, versus O(n) for buckets. Lead with the bucket version, then offer this as the concise alternative."}, {"id": "valid-palindrome", "day": 2, "pattern": "Two pointers", "title": "Valid Palindrome", "slug": "valid-palindrome", "level": "Easy", "premium": false, "statement": "Return true if a string reads the same forwards and backwards after ignoring case and every character that isn't a letter or digit.", "example": "\"A man, a plan, a canal: Panama\"  →  true", "signal": "Compare a sequence with its mirror → one pointer at each end, moving inward.", "approach": ["Set l = 0 and r = last index.", "Move l right past non-alphanumerics; move r left past them.", "Compare lower-cased characters; mismatch means false.", "Step both inward; if they meet, it's a palindrome."], "code": "class Solution {\n    public boolean isPalindrome(String s) {\n        int l = 0, r = s.length() - 1;\n        while (l < r) {\n            while (l < r && !Character.isLetterOrDigit(s.charAt(l))) l++;\n            while (l < r && !Character.isLetterOrDigit(s.charAt(r))) r--;\n            if (Character.toLowerCase(s.charAt(l)) != Character.toLowerCase(s.charAt(r))) return false;\n            l++;\n            r--;\n        }\n        return true;\n    }\n}", "complexity": "Time O(n), space O(1).", "pitfall": "Keep the l < r check inside the skip loops, or a string of only punctuation runs past the ends.", "puz": [[0, "class Solution {", false], [4, "public boolean isPalindrome(String s) {", false], [8, "int l = 0, r = s.length() - 1;", true], [8, "while (l < r) {", false], [12, "while (l < r && !Character.isLetterOrDigit(s.charAt(l))) l++;", true], [12, "while (l < r && !Character.isLetterOrDigit(s.charAt(r))) r--;", true], [12, "if (Character.toLowerCase(s.charAt(l)) != Character.toLowerCase(s.charAt(r))) return false;", true], [12, "l++;", true], [12, "r--;", false], [8, "}", false], [8, "return true;", true], [4, "}", false], [0, "}", false]], "plain": ["Put one finger on the first character and one on the last.", "If a finger is on a space or punctuation mark, slide it inward until it lands on a letter or digit, because those other characters don't count.", "Compare the two characters, ignoring upper and lower case. If they differ, it's not a palindrome.", "If they match, move both fingers one step inward and repeat. If the fingers meet, every pair matched, so it is a palindrome."], "short": [["One pointer at the start, one at the end", ""], ["Skip anything that isn't a letter or digit", ""], ["Compare the two, ignoring case", "different → not a palindrome"], ["Move both inward; if they meet, it's a palindrome", ""]], "tpl": "two-pointers", "tools": ["str-charat", "ch-checks", "ch-case"], "streams": "import java.util.*;\nimport java.util.stream.*;\n\nclass Solution {\n    public boolean isPalindrome(String s) {\n        int[] c = s.chars()\n                .filter(Character::isLetterOrDigit)\n                .map(Character::toLowerCase)\n                .toArray();\n        return IntStream.range(0, c.length / 2)\n                .allMatch(i -> c[i] == c[c.length - 1 - i]);\n    }\n}", "streamsNote": "Readable, but it builds a cleaned copy (O(n) extra space). The two-pointer loop uses O(1) space, so present that first."}, {"id": "three-sum", "day": 2, "pattern": "Two pointers", "title": "3Sum", "slug": "3sum", "level": "Medium", "premium": false, "statement": "Find every unique triplet in the array whose three values add up to zero. The result must not contain duplicate triplets.", "example": "[-1, 0, 1, 2, -1, -4]  →  [[-1,-1,2], [-1,0,1]]", "signal": "\"Find k numbers with a target sum, no duplicates\" → sort, fix one, then two pointers on the rest.", "approach": ["Sort the array.", "For each i, skip it if nums[i] equals nums[i−1] (duplicate anchor).", "Set l = i+1, r = end; move l up if the sum is too small, r down if too big.", "On a hit, record it, move both pointers, and skip repeated values of l."], "code": "import java.util.*;\n\nclass Solution {\n    public List<List<Integer>> threeSum(int[] nums) {\n        Arrays.sort(nums);\n        List<List<Integer>> res = new ArrayList<>();\n        for (int i = 0; i < nums.length - 2; i++) {\n            if (nums[i] > 0) break;                         // all remaining are positive\n            if (i > 0 && nums[i] == nums[i - 1]) continue;  // skip duplicate anchors\n            int l = i + 1, r = nums.length - 1;\n            while (l < r) {\n                int sum = nums[i] + nums[l] + nums[r];\n                if (sum < 0) l++;\n                else if (sum > 0) r--;\n                else {\n                    res.add(List.of(nums[i], nums[l], nums[r]));\n                    l++;\n                    r--;\n                    while (l < r && nums[l] == nums[l - 1]) l++;\n                }\n            }\n        }\n        return res;\n    }\n}", "complexity": "Time O(n²), space O(1) besides the output (sorting aside).", "pitfall": "Duplicates are the whole difficulty: skip them for the anchor and after each hit.", "puz": [[0, "import java.util.*;", false], [0, "", false], [0, "class Solution {", false], [4, "public List<List<Integer>> threeSum(int[] nums) {", false], [8, "Arrays.sort(nums);", true], [8, "List<List<Integer>> res = new ArrayList<>();", false], [8, "for (int i = 0; i < nums.length - 2; i++) {", false], [12, "if (nums[i] > 0) break;                         // all remaining are positive", false], [12, "if (i > 0 && nums[i] == nums[i - 1]) continue;  // skip duplicate anchors", true], [12, "int l = i + 1, r = nums.length - 1;", false], [12, "while (l < r) {", true], [16, "int sum = nums[i] + nums[l] + nums[r];", true], [16, "if (sum < 0) l++;", true], [16, "else if (sum > 0) r--;", true], [16, "else {", true], [20, "res.add(List.of(nums[i], nums[l], nums[r]));", true], [20, "l++;", false], [20, "r--;", true], [20, "while (l < r && nums[l] == nums[l - 1]) l++;", true], [16, "}", false], [12, "}", false], [8, "}", false], [8, "return res;", true], [4, "}", false], [0, "}", false]], "plain": ["Sort the numbers, so equal values sit next to each other and we can use two pointers.", "Pick each number in turn as the first number of the triplet. If it's the same as the number just before it, skip it: we already found every triplet starting with that value, so using it again would only give duplicates.", "For the other two numbers, put one pointer just after the first number and one at the end. If the three add up to less than zero, move the left pointer right to get a bigger number; if more than zero, move the right pointer left to get a smaller one.", "When the sum is exactly zero, save the triplet and move both pointers inward. Keep moving the left one while it shows the same value as before, so we don't save the same triplet twice."], "short": [["Sort the array", "equal numbers end up side by side"], ["Same as the number before it? Skip it", "avoids repeat triplets"], ["Two pointers on the rest: too small → left++, too big → right--", ""], ["Sum is 0? Save it, move both, skip repeats on the left", ""]], "tpl": "two-pointers", "tools": ["list-add", "list-of", "list-of-lists", "arr-sort"]}, {"id": "container-water", "day": 2, "pattern": "Two pointers", "title": "Container With Most Water", "slug": "container-with-most-water", "level": "Medium", "premium": false, "statement": "Each array value is the height of a vertical line. Pick two lines that, with the x-axis, hold the most water, and return that area.", "example": "[1,8,6,2,5,4,8,3,7]  →  49", "signal": "\"Best pair\" where width shrinks as you move inward → start at both ends and move the weaker side.", "approach": ["Start with l = 0 and r = last.", "Area = min(height[l], height[r]) × (r − l); track the best.", "Move whichever pointer has the shorter line.", "Stop when they meet."], "code": "class Solution {\n    public int maxArea(int[] height) {\n        int l = 0, r = height.length - 1, best = 0;\n        while (l < r) {\n            best = Math.max(best, Math.min(height[l], height[r]) * (r - l));\n            if (height[l] < height[r]) l++;\n            else r--;\n        }\n        return best;\n    }\n}", "complexity": "Time O(n), space O(1).", "pitfall": "Be ready to explain why moving the shorter side is safe: every pair using it with a nearer partner is narrower and no taller.", "puz": [[0, "class Solution {", false], [4, "public int maxArea(int[] height) {", false], [8, "int l = 0, r = height.length - 1, best = 0;", false], [8, "while (l < r) {", true], [12, "best = Math.max(best, Math.min(height[l], height[r]) * (r - l));", true], [12, "if (height[l] < height[r]) l++;", true], [12, "else r--;", false], [8, "}", false], [8, "return best;", true], [4, "}", false], [0, "}", false]], "plain": ["Start with the widest container: the first line and the last line.", "Water can only rise to the shorter of the two lines, so area = shorter height × distance between them. Keep the biggest area seen.", "Move the shorter line inward. Moving the taller one can never help: the water level is stuck at the short line while the width only shrinks.", "Repeat until the two lines meet."], "short": [["Start with the first and last lines", ""], ["Area = shorter height × width; keep the best", ""], ["Move the shorter line inward", "the taller one can't help"], ["Stop when they meet", ""]], "tpl": "two-pointers", "tools": ["math-maxmin"]}, {"id": "buy-sell-stock", "day": 3, "pattern": "Sliding window", "title": "Best Time to Buy and Sell Stock", "slug": "best-time-to-buy-and-sell-stock", "level": "Easy", "premium": false, "statement": "prices[i] is a stock's price on day i. Buy once and sell once on a later day. Return the biggest possible profit, or 0 if no profit is possible.", "example": "[7, 1, 5, 3, 6, 4]  →  5 (buy at 1, sell at 6)", "signal": "\"Best difference where the smaller comes first\" → track the minimum so far as you scan.", "approach": ["Keep minPrice, the lowest price seen so far.", "For each price, profit = price − minPrice; track the best.", "Update minPrice after checking."], "code": "class Solution {\n    public int maxProfit(int[] prices) {\n        int minPrice = Integer.MAX_VALUE, best = 0;\n        for (int p : prices) {\n            minPrice = Math.min(minPrice, p);\n            best = Math.max(best, p - minPrice);\n        }\n        return best;\n    }\n}", "complexity": "Time O(n), space O(1).", "pitfall": "Starting best at 0 handles the always-falling case without special code.", "puz": [[0, "class Solution {", false], [4, "public int maxProfit(int[] prices) {", false], [8, "int minPrice = Integer.MAX_VALUE, best = 0;", false], [8, "for (int p : prices) {", true], [12, "minPrice = Math.min(minPrice, p);", true], [12, "best = Math.max(best, p - minPrice);", true], [8, "}", false], [8, "return best;", true], [4, "}", false], [0, "}", false]], "plain": ["Remember the cheapest price seen so far: the best day to have bought.", "For each day, pretend we sell today: profit = today's price minus the cheapest earlier price. Keep the biggest profit.", "If today is cheaper than anything before, it becomes the new cheapest day to buy."], "short": [["Track the cheapest price so far", ""], ["Profit if sold today = price − cheapest; keep the best", ""], ["Update the cheapest price", ""]], "tpl": "sliding-window", "tools": ["math-maxmin", "math-maxvalue"]}, {"id": "longest-substring", "day": 3, "pattern": "Sliding window", "title": "Longest Substring Without Repeating Characters", "slug": "longest-substring-without-repeating-characters", "level": "Medium", "premium": false, "statement": "Return the length of the longest substring (contiguous) that has no repeated characters.", "example": "\"abcabcbb\"  →  3 (\"abc\");  \"pwwkew\"  →  3 (\"wke\")", "signal": "\"Longest contiguous run that satisfies a rule\" → variable-size sliding window.", "approach": ["Keep a map from character to the last index you saw it.", "For each right index, if the character was seen inside the window, move left to one past that index.", "Record the character's index and update the best length right − left + 1."], "code": "import java.util.*;\n\nclass Solution {\n    public int lengthOfLongestSubstring(String s) {\n        Map<Character, Integer> last = new HashMap<>();\n        int left = 0, best = 0;\n        for (int right = 0; right < s.length(); right++) {\n            char c = s.charAt(right);\n            if (last.containsKey(c) && last.get(c) >= left) left = last.get(c) + 1;\n            last.put(c, right);\n            best = Math.max(best, right - left + 1);\n        }\n        return best;\n    }\n}", "complexity": "Time O(n), space O(alphabet).", "pitfall": "Only jump left if the old index is inside the window (≥ left); o ": "import java.util.*;\nimport java.util.stream.*;\n\nclass Solution {\n    public int findKthLargest(int[] nums, int k) {\n        return Arrays.stream(nums).boxed()\n                .sorted(Comparator.reverseOrder())\n                .skip(k - 1)\n                .findFirst()\n                .orElseThrow();\n    }\n}", "streamsNote": "O(n log n) and it boxes every number, versus O(n log k) with the heap. Good as a quick baseline to mention, not the final answer."}, {"id": "merge-k-lists", "day": 6, "pattern": "Heap", "title": "Merge k Sorted Lists", "slug": "merge-k-sorted-lists", "level": "Hard", "premium": false, "statement": "Merge k sorted linked lists into one sorted list and return its head.", "example": "[1→4→5, 1→3→4, 2→6]  →  1→1→2→3→4→4→5→6", "signal": "\"Repeatedly take the smallest of k candidates\" → min-heap holding one item per source.", "approach": ["Put each non-null head into a min-heap ordered by val.", "Poll the smallest, attach it to the result.", "If it has a next node, offer that next node.", "Repeat until the heap is empty."], "code": "import java.util.*;\n\nclass Solution {\n    public ListNode mergeKLists(ListNode[] lists) {\n        PriorityQueue<ListNode> heap = new PriorityQueue<>((x, y) -> Integer.compare(x.val, y.val));\n        for (ListNode node : lists) if (node != null) heap.offer(node);\n        ListNode dummy = new ListNode(0), tail = dummy;\n        while (!heap.isEmpty()) {\n            ListNode smallest = heap.poll();\n            tail.next = smallest;\n            tail = smallest;\n            if (smallest.next != null) heap.offer(smallest.next);\n        }\n        return dummy.next;\n    }\n}", "complexity": "Time O(N log k) for N total nodes, space O(k).", "pitfall": "Use Integer.compare in the comparator, not a.val − b.val, which can overflow.", "puz": [[0, "import java.util.*;", false], [0, "", false], [0, "class Solution {", false], [4, "public ListNode mergeKLists(ListNode[] lists) {", false], [8, "PriorityQueue<Li  {\n        TreeNode node = root;\n        while (node != null) {\n            if (p.val < node.val && q.val < node.val) node = node.left;\n            else if (p.val > node.val && q.val > node.val) node = node.right;\n            else return node; // the paths split here\n        }\n        return null;\n    }\n}", "complexity": "Time O(h), space O(1).", "pitfall": "Mention how it changes for a plain binary tree (LeetCode 236): recursion that returns the node found in each subtree.", "puz": [[0, "class Solution {", false], [4, "public TreeNode lowestCommonAncestor(TreeNode root, TreeNode p, TreeNode q) {", false], [8, "TreeNode node = root;", false], [8, "while (node != null) {", true], [12, "if (p.val < node.val && q.val < node.val) node = node.left;", true], [12, "else if (p.val > node.val && q.val > node.val) node = node.right;", true], [12, "else return node; // the paths split here", true], [8, "}", false], [8, "return null;", false], [4, "}", false], [0, "}", false]], "plain": ["Start at the root.", "In a BST, smaller values live on the left and bigger ones on the right. If both values are smaller than this node, both are in the left subtree, so go left. If both are bigger, go right.", "Otherwise the two values sit on different sides of this node (or one of them is this node), so this is the lowest node above both: return it."], "short": [["Start at the root", ""], ["Both smaller → go left; both bigger → go right", ""], ["Otherwise they split here → this node is the answer", ""]], "tpl": "tree-dfs", "tools": []}, {"id": "validate-bst", "day": 8, "pattern": "Trees & BST", "title": "Validate Binary Search Tree", "slug": "validate-binary-search-tree", "level": "Medium", "premium": false, "statement": "Return true if a binary tree is a valid BST: every node's left subtree holds only smaller values and its right subtree only larger values.", "example": "2(1, 3) → true;  5(1, 4(3, 6)) → false", "signal": "BST validity → pass a (low, high) range down the tree, or ch , "premium": false, "statement": "Return the kth smallest value (1-indexed) in a binary search tree.", "example": "3(1(_, 2), 4), k = 1  →  1", "signal": "BST + \"in sorted order\" → in-order traversal visits values smallest first.", "approach": ["Iterative in-order with a stack: push left children all the way down.", "Pop a node, count it; if it's the kth, return its value.", "Move to its right child and repeat."], "code": "import java.util.*;\n\nclass Solution {\n    public int kthSmallest(TreeNode root, int k) {\n        Deque<TreeNode> stack = new ArrayDeque<>();\n        TreeNode node = root;\n        while (node != null || !stack.isEmpty()) {\n            while (node != null) {\n                stack.push(node);\n                node = node.left;\n            }\n            node = stack.pop();\n            if (--k == 0) return node.val;\n            node = node.right;\n        }\n        return -1;\n    }\n}", "complexity": "Time O(h + k), space O(h).", "pitfall": "Follow-up: if the tree changes often, store subtree sizes in each node to answer in O(h).", "puz": [[0, "import java.util.*;", false], [0, "", false], [0, "class Solution {", false], [4, "public int kthSmallest(TreeNode root, int k) {", false], [8, "Deque<TreeNode> stack = new ArrayDeque<>();", false], [8, "TreeNode node = root;", true], [8, "while (node != null || !stack.isEmpty()) {", false], [12, "while (node != null) {", true], [16, "stack.push(node);", true], [16, "node = node.left;", false], [12, "}", false], [12, "node = stack.pop();", true], [12, "if (--k == 0) return node.val;", true], [12, "node = node.right;", true], [8, "}", false], [8, "return -1;", true], [4, "}", false], [0, "}", false]], "plain": ["Visiting a BST in order (left, node, right) gives values from smallest to biggest. To start, walk left as far as possible, stacking the nodes we pass.", "Take the top node off the stack: it's the next smallest value. Count it, and if it's the kth one, return it.", "Then move to its right child and again walk left as far as possible, because that's where the next smallest values are."], "short": [["Walk left as far as possible, stacking nodes", "in-order visits = sorted"], ["Pop: that's the next smallest; the kth → return it", ""], ["Go right, then walk left again", ""]], "tpl": "tree-dfs", "tools": ["stack", "deque-empty"]}, {"id": "right-side-view", "day": 8, "pattern": "Trees & BST", "title": "Binary Tree Right Side View", "slug": "binary-tree-right-side-view", "level": "Medium", "premium": false, "statement": "Imagine standing to the right of a binary tree. Return the values you can see, top to bottom.", "example": "1(2(_, 5), 3(_, 4))  →  [1, 3, 4]", "signal": "\"One value per level\" → BFS by level and take the last node of each level.", "approach": ["Run level-order BFS.", "On each level, record the value of the last node polled."], "code": "import java.util.*;\n\nclass Solution {\n    public List<Integer> rightSideView(TreeNode root) {\n        List<Integer> res = new ArrayList<>();\n        if (root == null) return res;\n        Deque<TreeNode> queue = new ArrayDeque<>();\n        queue.offer(root);\n        while (!queue.isEmpty()) {\n            int size = queue.size();\n            for (int i = 0; i < size; i++) {\n                TreeNode node = queue.poll();\n                if (i == size - 1) res.add(node.val); // last node on this level\n                if (node.left != null) queue.offer(node.left);\n                if (node.right != null) queue.offer(node.right);\n            }\n        }\n        return res;\n    }\n}", "complexity": "Time O(n), space O(width).", "pitfall": "A left-subtree node is visible when the right side is shorter; a \"follow right pointers only\" answer fails that case.", "puz": [[0, "import java.util.*;", false], [0, "", false], [0, "class Solution {", false], [4, "public List<Integer> rightSideView(TreeNode root) {", false], [8, "List<Integer> res = new ArrayList<>();", true], [8, "if (root == null) return re n true if you can finish every course.", "example": "n = 2, [[1,0]] → true;  n = 2, [[1,0],[0,1]] → false", "signal": "Dependencies + \"can they all be done\" → cycle detection via topological sort (Kahn's algorithm).", "approach": ["Build an adjacency list b → a and count each course's in-degree.", "Queue every course with in-degree 0.", "Pop a course, count it, decrement each dependent's in-degree; queue those that hit 0.", "All courses counted → no cycle → true."], "code": "import java.util.*;\n\nclass Solution {\n    public boolean canFinish(int numCourses, int[][] prerequisites) {\n        List<List<Integer>> graph = new ArrayList<>();\n        for (int i = 0; i < numCourses; i++) graph.add(new ArrayList<>());\n        int[] indegree = new int[numCourses];\n        for (int[] p : prerequisites) {\n            graph.get(p[1]).add(p[0]);\n            indegree[p[0]]++;\n        }\n        Deque<Integer> queue = new ArrayDeque<>();\n        for (int i = 0; i < numCourses; i++) if (indegree[i] == 0) queue.offer(i);\n        int taken = 0;\n        while (!queue.isEmpty()) {\n            int course = queue.poll();\n            taken++;\n            for (int next : graph.get(course)) if (--indegree[next] == 0) queue.offer(next);\n        }\n        return taken == numCourses; // a cycle leaves some courses stuck above 0\n    }\n}", "complexity": "Time O(V + E), space O(V + E).", "pitfall": "This is the same as build-order or job-scheduling questions; name it as topological sort out loud.", "puz": [[0, "import java.util.*;", false], [0, "", false], [0, "class Solution {", false], [4, "public boolean canFinish(int numCourses, int[][] prerequisites) {", false], [8, "List<List<Integer>> graph = new ArrayList<>();", false], [8, "for (int i = 0; i < numCourses; i++) graph.add(new ArrayList<>());", true], [8, "int[] indegree = new int[numCourses];", true], [8, "for (int[] p : prerequisites) {", true], [12, "graph.get(p[1]).add(p[0]);", true], [12, "indegree[p[0]]++;", true], process the current queue size: rot fresh neighbours and queue them.", "Add a minute per round while fresh oranges remain.", "Return minutes if fresh is 0, else -1."], "code": "import java.util.*;\n\nclass Solution {\n    public int orangesRotting(int[][] grid) {\n        int rows = grid.length, cols = grid[0].length, fresh = 0;\n        Deque<int[]> queue = new ArrayDeque<>();\n        for (int r = 0; r < rows; r++)\n            for (int c = 0; c < cols; c++) {\n                if (grid[r][c] == 2) queue.offer(new int[]{r, c});\n                else if (grid[r][c] == 1) fresh++;\n            }\n        int minutes = 0;\n        int[][] dirs = {{1, 0}, {-1, 0}, {0, 1}, {0, -1}};\n        while (!queue.isEmpty() && fresh > 0) {\n            int size = queue.size();\n            for (int i = 0; i < size; i++) {\n                int[] cell = queue.poll();\n                for (int[] d : dirs) {\n                    int nr = cell[0] + d[0], nc = cell[1] + d[1];\n                    if (nr < 0 || nc < 0 || nr >= rows || nc >= cols || grid[nr][nc] != 1) continue;\n                    grid[nr][nc] = 2;\n                    fresh--;\n                    queue.offer(new int[]{nr, nc});\n                }\n            }\n            minutes++;\n        }\n        return fresh == 0 ? minutes : -1;\n    }\n}", "complexity": "Time O(rows × cols), space O(rows × cols).", "pitfall": "Stop when fresh hits 0, or you'll count an extra minute for the last empty round.", "puz": [[0, "import java.util.*;", false], [0, "", false], [0, "class Solution {", false], [4, "public int orangesRotting(int[][] grid) {", false], [8, "int rows = grid.length, cols = grid[0].length, fresh = 0;", true], [8, "Deque<int[]> queue = new ArrayDeque<>();", false], [8, "for (int r = 0; r < rows; r++)", false], [12, "for (int c = 0; c < cols; c++) {", false], [16, "if (grid[r][c] == 2) queue.offer(new int[]{r, c});", true], [16, "else if (grid[r][c] == 1) fresh++;", true], [12, "}", false], [8, "int minutes =  "list-to-2d", "arr-sort-2d", "arr-2d", "math-maxmin", "math-compare"]}, {"id": "insert-interval", "day": 10, "pattern": "Intervals", "title": "Insert Interval", "slug": "insert-interval", "level": "Medium", "premium": false, "statement": "Given sorted, non-overlapping intervals and a new interval, insert it and merge where needed. Return the result, still sorted.", "example": "[[1,3],[6,9]] + [2,5]  →  [[1,5],[6,9]]", "signal": "Already-sorted intervals → one linear pass in three phases: before, overlapping, after.", "approach": ["Copy intervals that end before newInterval starts.", "Merge every interval that starts on or before the (growing) new end.", "Add the merged interval, then copy the rest."], "code": "import java.util.*;\n\nclass Solution {\n    public int[][] insert(int[][] intervals, int[] newInterval) {\n        List<int[]> res = new ArrayList<>();\n        int i = 0, n = intervals.length;\n        while (i < n && intervals[i][1] < newInterval[0]) res.add(intervals[i++]); // before\n        int start = newInterval[0], end = newInterval[1];\n        while (i < n && intervals[i][0] <= end) {                                   // overlapping\n            start = Math.min(start, intervals[i][0]);\n            end = Math.max(end, intervals[i][1]);\n            i++;\n        }\n        res.add(new int[]{start, end});\n        while (i < n) res.add(intervals[i++]);                                      // after\n        return res.toArray(new int[0][]);\n    }\n}", "complexity": "Time O(n), space O(n).", "pitfall": "Don't re-sort; the input is already sorted and the interviewer wants O(n).", "puz": [[0, "import java.util.*;", false], [0, "", false], [0, "class Solution {", false], [4, "public int[][] insert(int[][] intervals, int[] newInterval) {", false], [8, "List<int[]> res = new ArrayList<>();", false], [8, "int i = 0, n = intervals.length;", true], [8, "while (i < n && intervals[i][1] < newInterval[0]) res.add(intervals[i++]); // before", true], [8, "int start = newInterval[0], end = newInterval[1];", true], [8, "while (i < n && intervals[i][0] <= end) {                                   // overlapping", true], [12, "start = Math.min(start, intervals[i][0]);", true], [12, "end = Math.max(end, intervals[i][1]);", true], [12, "i++;", false], [8, "}", false], [8, "res.add(new int[]{start, end});", false], [8, "while (i < n) res.add(intervals[i++]);                                      // after", true], [8, "return res.toArray(new int[0][]);", true], [4, "}", false], [0, "}", false]], "plain": ["Copy every interval that finishes before the new interval begins; they can't touch it.", "Every interval that starts before the new interval ends overlaps it: combine them, stretching the new interval's start and end to cover all of them.", "Add the combined interval, then copy the remaining intervals, which all start after it."], "short": [["Copy intervals that end before the new one starts", ""], ["Merge every overlapping interval into the new one", ""], ["Add it, then copy the rest", ""]], "tpl": "intervals", "tools": ["list-add", "list-to-2d", "arr-2d", "math-maxmin"]}, {"id": "meeting-rooms-ii", "day": 10, "pattern": "Intervals", "title": "Meeting Rooms II", "slug": "meeting-rooms-ii", "level": "Medium", "premium": true, "statement": "Given meeting time intervals [start, end], return the minimum number of rooms needed so no two overlapping meetings share a room.", "example": "[[0,30],[5,10],[15,20]]  →  2", "signal": "\"How many overlap at once\" → sort by start, keep a min-heap of end times (or sweep start/end events).", "approach": ["Sort meetings by start.", "Keep a min-heap of end times for rooms in use.", "For each meeting, if the earliest end ≤ its start, poll it (room freed).", "Offer the meeting's end. The heap size at the end is the answer."], "code": "import java.util.*;\n\nclass Solution {\n    public int minMeetingRooms(int[][] intervals) {\n        Arrays.sort(intervals, (a, b) -> Integer.compare(a[0], b[0]));\n        PriorityQueue<Integer> endTimes = new PriorityQueue<>(); // end time of each room in use\n        for (int[] m : intervals) {\n            if (!endTimes.isEmpty() && endTimes.peek() <= m[0]) endTimes.poll(); // reuse the room that frees first\n            endTimes.offer(m[1]);\n        }\n        return endTimes.size();\n    }\n}", "complexity": "Time O(n log n), space O(n).", "pitfall": "This one is LeetCode Premium; practise from the statement here. It is a favourite for scheduling-style FDE problems.", "puz": [[0, "import java.util.*;", false], [0, "", false], [0, "class Solution {", false], [4, "public int minMeetingRooms(int[][] intervals) {", false], [8, "Arrays.sort(intervals, (a, b) -> Integer.compare(a[0], b[0]));", true], [8, "PriorityQueue<Integer> endTimes = new PriorityQueue<>(); // end time of each room in use", false], [8, "for (int[] m : intervals) {", false], [12, "if (!endTimes.isEmpty() && endTimes.peek() <= m[0]) endTimes.poll(); // reuse the room that frees first", true], [12, "endTimes.offer(m[1]);", true], [8, "}", false], [8, "return endTimes.size();", true], [4, "}", false], [0, "}", false]], "plain": ["Handle the meetings in order of start time.", "Keep track of when each room in use becomes free, with the earliest-free room easy to grab (a min-heap of end times).", "For each meeting, check the room that frees up earliest. If it's free by the time this meeting starts, reuse it.", "Either way, record that this meeting's room is busy until the meeting ends. The number of rooms tracked at the end is how many we needed."], "short": [["Sort meetings by start", ""], ["Keep a min-heap of room end times", ""], ["Earliest room free in time? Reuse it", ""], ["Add this meeting's end", "heap size = rooms needed"]], "tpl": "heap-topk", "tools": ["arr-sort-2d", "arr-2d", "pq-min", "math-compare"]}, {"id": "climbing-stairs", "day": 11, "pattern": "1-D DP", "title": "Climbing Stairs", "slug": "climbing-stairs", "level": "Easy", "premium": false, "statement": "You climb n steps, taking 1 or 2 steps at a time. How many distinct ways can you reach the top?", "example": "n = 3  →  3 (1+1+1, 1+2, 2+1)", "signal": "\"Count the ways\" where each step depends on the previous one or two → DP that keeps two variables.", "approach": ["ways(n) = ways(n−1) + ways(n−2), with ways(0) = ways(1) = 1.", "Keep only the last two values and roll them forward."], "code": "class Solution {\n    public int climbStairs(int n) {\n        int prev = 1, curr = 1; // ways to reach step i-1 and step i\n        for (int i = 2; i <= n; i++) {\n            int next = prev + curr;\n            prev = curr;\n            curr = next;\n        }\n        return curr;\n    }\n}", "complexity": "Time O(n), space O(1).", "pitfall": "Explain the progression out loud: recursion (exponential) → memo → bottom-up → two variables. Interviewers grade the story.", "puz": [[0, "class Solution {", false], [4, "public int climbStairs(int n) {", false], [8, "int prev = 1, curr = 1; // ways to reach step i-1 and step i", true], [8, "for (int i = 2; i <= n; i++) {", false], [12, "int next = prev + curr;", true], [12, "prev = curr;", true], [12, "curr = next;", true], [8, "}", false], [8, "return curr;", false], [4, "}", false], [0, "}", false]], "plain": ["To reach step n, the last move came from step n−1 (a 1-step) or step n−2 (a 2-step). So ways to reach n = ways to reach n−1 + ways to reach n−2.", "We only ever need the last two answers, so keep two variables and roll them forward one step at a time."], "short": [["ways(n) = ways(n−1) + ways(n−2)", "the last step was 1 or 2"], ["Keep just the last two values", ""]], "tpl": "dp", "tools": []}, {"id": "house-robber", "day": 11, "pattern": "1-D DP", "title": "House Robber", "slug": "house-robber", "level": "Medium", "premium": false, "statement": "Houses in a row hold money. You can't take from two adjacent houses. Return the most money you can take.", "example": "[2, 7, 9, 3, 1]  →  12 (2 + 9 + 1)", "signal": "\"Pick items with a no-adjacent rule to maximise a sum\" → DP with take/skip states.", "approach": ["Keep skip = best if the previous house was not taken, take = best if it was.", "For each house: newTake = skip + money; skip = max(skip, take); take = newTake.", "Answer = max(skip, take)."], "code": "class Solution {\n    public int rob(int[] nums) {\n        int skip = 0, take = 0; // best total if the previous house was skipped / taken\n        for (int n : nums) {\n            int newTake = skip + n;\n            skip = Math.max(skip, take);\n            take = newTake;\n        }\n        return Math.max(skip, take);\n    }\n}", "complexity": "Time O(n), space O(1).", "pitfall": "Follow-up: houses in a circle (House Robber II) — run it twice, excluding the first or the last house.", "puz": [[0, "class Solution {", false], [4, "public int rob(int[] nums) {", false], [8, "int skip = 0, take = 0; // best total if the previous house was skipped / taken", false], [8, "for (int n : nums) {", false], [12, "int newTake = skip + n;", true], [12, "skip = Math.max(skip, take);", true], [12, "take = newTake;", true], [8, "}", false], [8, "return Math.max(skip, take);", true], [4, "}", false], [0, "}", false]], "plain": ["Track two totals as we walk down the street: the best total if we skipped the last house, and the best if we robbed it.", "At each house: robbing it is only allowed if we skipped the previous one, so the new 'robbed' total = the previous 'skipped' total + this house's money. Skipping it means keeping the better of the two previous totals.", "At the end, the answer is the better of the two totals."], "short": [["Track two totals: skipped the last house / robbed it", ""], ["Rob this one = skip total + money; skip = best of both", ""], ["Answer = the bigger total", ""]], "tpl": "dp", "tools": ["math-maxmin"]}, {"id": "coin-change", "day": 11, "pattern": "1-D DP", "title": "Coin Change", "slug": "coin-change", "level": "Medium", "premium": false, "statement": "Given coin values and an amount, return the fewest coins that add up to the amount (unlimited coins of each value), or -1 if impossible.", "example": "coins = [1, 2, 5], amount = 11  →  3 (5 + 5 + 1)", "signal": "\"Fewest items to reach exactly X\" → DP over amounts 0..X.", "approach": ["dp[a] = fewest coins for amount a; dp[0] = 0; fill the rest with amount + 1 as infinity.", "For a = 1..amount and each coin ≤ a: dp[a] = min(dp[a], dp[a − coin] + 1).", "If dp[amount] is still infinity, return -1."], "code": "import java.util.*;\n\nclass Solution {\n    public int coinChange(int[] coins, int amount) {\n        int[] dp = new int[amount + 1]; // dp[a] = fewest coins to make a\n        Arrays.fill(dp, amount + 1);    // acts as infinity\n        dp[0] = 0;\n        for (int a = 1; a <= amount; a++)\n            for (int c : coins)\n                if (c <= a) dp[a] = Math.min(dp[a], dp[a - c] + 1);\n        return dp[amount] > amount ? -1 : dp[amount];\n    }\n}", "complexity": "Time O(amount × coins), space O(amount).", "pitfall": "Greedy (largest coin first) fails for coins like [1, 3, 4] and amount 6; say this to show why DP is needed.", "puz": [[0, "import java.util.*;", false], [0, "", false], [0, "class Solution {", false], [4, "public int coinChange(int[] coins, int amount) {", false], [8, "int[] dp = new int[amount + 1]; // dp[a] = fewest coins to make a", false], [8, "Arrays.fill(dp, amount + 1);    // acts as infinity", true], [8, "dp[0] = 0;", true], [8, "for (int a = 1; a <= amount; a++)", false], [12, "for (int c : coins)", true], [16, "if (c <= a) dp[a] = Math.min(dp[a], dp[a - c] + 1);", true], [8, "return dp[amount] > amount ? -1 : dp[amount];", true], [4, "}", false], [0, "}", false]], "plain": ["Build a table: for every amount from 0 up to the target, the fewest coins needed. Amount 0 needs 0 coins; start the others at 'impossible' (a number bigger than any real answer).", "For each amount, try every coin as the last coin used: that's 1 coin plus the her refunds (negative amounts) exist.", "puz": [[0, "import java.util.*;", false], [0, "import java.util.stream.*;", false], [0, "", false], [0, "record Txn(String userId, long amountPaise, long timestamp) {}", false], [0, "", false], [0, "class SpendReport {", false], [4, "static Map<String, Long> totalPerUser(List<Txn> txns) {", false], [8, "return txns.stream()", false], [16, ".collect(Collectors.groupingBy(Txn::userId, Collectors.summingLong(Txn::amountPaise)));", true], [4, "}", false], [0, "", false], [4, "static List<String> topSpenders(Map<String, Long> totals, int k) {", false], [8, "return totals.entrySet().stream()", true], [16, ".sorted(Map.Entry.<String, Long>comparingByValue().reversed()", true], [24, ".thenComparing(Map.Entry.comparingByKey()))", false], [16, ".limit(k)", true], [16, ".map(Map.Entry::getKey)", true], [16, ".toList();", true], [4, "}", false], [0, "}", false]], "plain": ["Describe one transaction as a small record type (user, amount, time), so the code reads clearly.", "Group the transactions by user and add up each user's amounts.", "Sort users by their total, biggest first (ties broken alphabetically), and take the first k names.", "Keep money in whole paise (long) or BigDecimal: double gives rounding errors with money."], "short": [["A record for each transaction", ""], ["Group by user and sum the amounts", ""], ["Sort totals high to low; take k", ""], ["Money in paise (long), never double", ""]], "tpl": "group-count", "tools": ["map-entryset", "st-filter-map", "st-groupingby-list", "st-averaging", "st-sorted", "st-distinct-skip-limit"]}, {"id": "log-errors", "day": 12, "pattern": "Practical coding", "title": "Top error paths per hour from logs", "slug": null, "level": "Practical", "premium": false, "statement": "Each log line looks like \"2026-11-02T10:15:30 GET /api/orders 500 123ms\". For every hour, return the k most frequent paths that returned a 5xx status. Skip malformed lines.", "example": "3 lines with /api/orders 500 and 1 with /api/pay 503 in hour 10  →  {\"2026-11-02T10\": [/api/orders, /api/pay]}", "signal": "Parse, filter, then count by two keys → nested map (hour → path → count), then top-k per group.", "approach": ["Split each line on whitespace; skip lines with fewer than 4 parts or a non-numeric status.", "Keep only status ≥ 500.", "counts[hour][path]++ using computeIfAbsent and merge.", "For each hour, sort paths by count descending (tie: path name) and take k. Use a TreeMap so hours come out in order."], "code": "import java.util.*;\n\nclass ErrorReport {\n    // Line format: 2026-11-02T10:15:30 GET /api/orders 500 123ms\n    static Map<String, List<String>> topErrorPathsPerHour(List<String> lines, int k) {\n        Map<String, Map<String, Integer>> counts = new TreeMap<>(); // hour -> path -> count\n        for (String line : lines) {\n            String[] parts = line.trim().split(\"\\\\s+\");\n            if (parts.length < 4 || parts[0].length() < 13) continue; // malformed\n            int status;\n            try {\n                status = Integer.parseInt(parts[3]);\n            } catch (NumberFormatException e) {\n                continue;\n            }\n            if (status < 500) continue;\n            String hour = parts[0].substring(0, 13); // \"2026-11-02T10\"\n            counts.computeIfAbsent(hour, h -> new HashMap<>()).merge(parts[2], 1, Integer::sum);\n        }\n        Map<String, List<String>> result = new TreeMap<>();\n        counts.forEach((hour, byPath) -> result.put(hour, byPath.entrySet().stream()\n                .sorted(Map.Entry.<String, Integer>comparingByValue().reversed()\n                        .thenComparing(Map.Entry.comparingByKey()))\n                .limit(k)\n                .map(Map.Entry::getKey)\n                .toList()));\n        return result;\n    }\n}", "complexity": "Time O(n + p log p) per hour, space O(distinct hour × path pairs).", "pitfall": "Real logs are messy. Saying \"I'll skip and count malformed lines rather than crash\" is exactly the judgment FDE rounds look for.", "puz": [[0, "import java.util.*;", false], [0, "", false], [0, "class ErrorReport {", false], [4, "// Line format: 2026-11-02T10:15:30 GET /api/orders 500 123ms", false], [4, "static Map<String, List<String>> topErrorPathsPerHour(List<String> lines, int k) {", false], [8, "Map<String, Map<String, Integer>> counts = new TreeMap<>(); // hour -> path -> count", true], [8, "for (String line : lines) {", true], [12, "String[] parts = line.trim().split(\"\\\\s+\");", true], [12, "if (parts.length < 4 || parts[0].length() < 13) continue; // malformed", true], [12, "int status;", true], [12, "try {", false], [16, "status = Integer.parseInt(parts[3]);", false], [12, "} catch (NumberFormatException e) {", false], [16, "continue;", false], [12, "}", false], [12, "if (status < 500) continue;", true], [12, "String hour = parts[0].substring(0, 13); // \"2026-11-02T10\"", true], [12, "counts.computeIfAbsent(hour, h -> new HashMap<>()).merge(parts[2], 1, Integer::sum);", true], [8, "}", false], [8, "Map<String, List<String>> result = new TreeMap<>();", true], [8, "counts.forEach((hour, byPath) -> result.put(hour, byPath.entrySet().stream()", false], [16, ".sorted(Map.Entry.<String, Integer>comparingByValue().reversed()", true], [24, ".thenComparing(Map.Entry.comparingByKey()))", true], [16, ".limit(k)", false], [16, ".map(Map.Entry::getKey)", true], [16, ".toList()));", true], [8, "return result;", true], [4, "}", false], [0, "}", false]], "plain": ["Split each log line into its pieces (time, method, path, status). Skip any broken line instead of crashing.", "We only care about server errors, so ignore lines whose status is below 500.", "Take the hour from the timestamp, and add one to the count for that hour and path.", "For each hour, sort its paths by count, biggest first, and keep the top k. Keep the hours in time order."], "short": [["Split each line; skip broken ones", ""], ["Keep only status 500 and above", ""], ["Count per hour and path", ""], ["Per hour, sort by count; keep the top k", ""]], "tpl": "group-count", "tools": ["map-put", "map-merge", "map-computeifabsent", "map-entryset", "str-substring", "str-split", "str-trim-case", "str-numbers", "treemap", "st-filter-map", "st-sorted", "st-distinct-skip-limit"]}, {"id": "dedupe-customers", "day": 12, "pattern": "Practical coding", "title": "Deduplicate customer records", "slug": null, "level": "Practical", "premium": false, "statement": "Customer rows have name, email and updatedAt. Treat two rows as the same customer when name and email match, ignoring case and surrounding spaces. Keep only the most recently updated row for each customer.", "example": "(Asha, ASHA@x.com, 1), (asha , asha@x.com, 5), (Ravi, r@x.com, 2)  →  2 rows; Asha's is the one with updatedAt 5", "signal": "\"Same entity, keep the best version\" → normalised key + Map.merge with a picking function.", "approach": ["Normalise: trim, then toLowerCase(Locale.ROOT).", "key = name + \"|\" + email.", "latest.merge(key, row, keep the one with the larger updatedAt).", "Use LinkedHashMap to keep first-seen order."], "code": "import java.util.*;\n\nrecord Customer(String name, String email, long updatedAt) {}\n\nclass Dedupe {\n    static List<Customer> dedupe(List<Customer> rows) {\n        Map<String, Customer> latest = new LinkedHashMap<>();\n        for (Customer c : rows) {\n            String key = norm(c.name()) + \"|\" + norm(c.email());\n            latest.merge(key, c, (a, b) -> a.updatedAt() >= b.updatedAt() ? a : b);\n        }\n        return new ArrayList<>(latest.values());\n    }\n\n    private static String norm(String s) {\n        return s == null ? \"\" : s.trim().toLowerCase(Locale.ROOT);\n    }\n}", "complexity": "Time O(n), space O(n).", "pitfall": "Mention Locale.ROOT: lower-casing with a Turkish default locale changes 'I'. Then ask the customer what \"same person\" really means.", "puz": [[0, "import java.util.*;", false], [0, "", false], [0   return s == null ? \"\" : s.trim().toLowerCase(Locale.ROOT);\n    }\n}", "streamsNote": "toMap with a merge function and LinkedHashMap::new does the whole job in one expression. In practical rounds this is often the preferred style."}, {"id": "token-bucket", "day": 12, "pattern": "Practical coding", "title": "Token-bucket rate limiter", "slug": null, "level": "Practical", "premium": false, "statement": "Write a rate limiter class with tryAcquire(): it holds up to capacity tokens, refills at a steady rate per second, and allows a request only if a token is available.", "example": "capacity 2, 1 token/s: tryAcquire() → true, true, false; one second later → true", "signal": "\"Allow N per time window, with bursts\" → token bucket; refill lazily from elapsed time instead of a background thread.", "approach": ["Store capacity, refill rate, current tokens (double) and last refill time.", "On tryAcquire: tokens = min(capacity, tokens + elapsed × rate); update last refill.", "If tokens ≥ 1, take one and return true; else false.", "Inject the clock (LongSupplier) so tests don't sleep; make the method synchronized."], "code": "import java.util.function.LongSupplier;\n\nclass TokenBucket {\n    private final long capacity;\n    private final double tokensPerNano;\n    private final LongSupplier clock; // nanoseconds; System::nanoTime in production\n    private double tokens;\n    private long lastRefill;\n\n    TokenBucket(long capacity, double tokensPerSecond, LongSupplier clock) {\n        this.capacity = capacity;\n        this.tokensPerNano = tokensPerSecond / 1_000_000_000.0;\n        this.clock = clock;\n        this.tokens = capacity;\n        this.lastRefill = clock.getAsLong();\n    }\n\n    public synchronized boolean tryAcquire() {\n        long now = clock.getAsLong();\n        tokens = Math.min(capacity, tokens + (now - lastRefill) * tokensPerNano);\n        lastRefill = now;\n        if (tokens >= 1) {\n            tokens -= 1;\n            return true;\n        }\n        return false;\n    }\n}", "complexity": "O(1) per call, O(1) space.", "pitfall": "Discuss the distributed version: one bucket per client key in Redis, updated atomically with a Lua script.", "puz": [[0, "import java.util.function.LongSupplier;", false], [0, "", false], [0, "class TokenBucket {", false], [4, "private final long capacity;", false], [4, "private final double tokensPerNano;", false], [4, "private final LongSupplier clock; // nanoseconds; System::nanoTime in production", false], [4, "private double tokens;", false], [4, "private long lastRefill;", false], [0, "", false], [4, "TokenBucket(long capacity, double tokensPerSecond, LongSupplier clock) {", false], [8, "this.capacity = capacity;", false], [8, "this.tokensPerNano = tokensPerSecond / 1_000_000_000.0;", false], [8, "this.clock = clock;", true], [8, "this.tokens = capacity;", true], [8, "this.lastRefill = clock.getAsLong();", false], [4, "}", false], [0, "", false], [4, "public synchronized boolean tryAcquire() {", false], [8, "long now = clock.getAsLong();", false], [8, "tokens = Math.min(capacity, tokens + (now - lastRefill) * tokensPerNano);", true], [8, "lastRefill = now;", true], [8, "if (tokens >= 1) {", true], [12, "tokens -= 1;", true], [12, "return true;", true], [8, "}", false], [8, "return false;", true], [4, "}", false], [0, "}", false]], "plain": ["Picture a bucket that holds at most 'capacity' tokens and refills at a steady rate. Store its size, refill rate, current tokens and when we last topped it up.", "On each request, first top up the bucket for the time that has passed since last time, without going over capacity.", "If there's at least one token, take it and allow the request; otherwise reject it.", "Pass the clock in from outside so tests can fake time instead of sleeping, and make the method synchronized so two threads can't take the same token."], "short": [["Store capacity, rate, tokens and last refill time", ""], ["Refill for the time passed, capped at capacity ss CsvDiff {\n    record Result(List<String> onlyInA, List<String> onlyInB, Map<String, String> merged) {}\n\n    static Result compare(List<String> fileA, List<String> fileB, String keyColumn) {\n        Map<String, String> a = index(fileA, keyColumn);\n        Map<String, String> b = index(fileB, keyColumn);\n        List<String> onlyInA = new ArrayList<>(), onlyInB = new ArrayList<>();\n        Map<String, String> merged = new LinkedHashMap<>();\n        for (var e : a.entrySet()) {\n            if (b.containsKey(e.getKey())) merged.put(e.getKey(), e.getValue() + \",\" + b.get(e.getKey()));\n            else onlyInA.add(e.getKey());\n        }\n        for (String key : b.keySet()) if (!a.containsKey(key)) onlyInB.add(key);\n        return new Result(onlyInA, onlyInB, merged);\n    }\n\n    // key -> whole row. Naive split: real CSV with quoted commas needs a parser library.\n    private static Map<String, String> index(List<String> lines, String keyColumn) {\n        List<String> header = Arrays.asList(lines.get(0).split(\",\", -1));\n        int keyIdx = header.indexOf(keyColumn);\n        if (keyIdx < 0) throw new IllegalArgumentException(\"Missing column: \" + keyColumn);\n        Map<String, String> rows = new LinkedHashMap<>();\n        for (String line : lines.subList(1, lines.size())) {\n            if (line.isBlank()) continue;\n            String[] cols = line.split(\",\", -1);\n            rows.put(cols[keyIdx].trim(), line);\n        }\n        return rows;\n    }\n}", "complexity": "Time O(a + b), space O(a + b).", "pitfall": "Say that split(\",\") breaks on quoted commas, and that you'd use a CSV library in production. Also ask about duplicate keys within one file.", "puz": [[0, "import java.util.*;", false], [0, "", false], [0, "class CsvDiff {", false], [4, "record Result(List<String> onlyInA, List<String> onlyInB, Map<String, String> merged) {}", false], [0, "", false], [4, "static Result compare(List<String> fileA, List<String> fileB, String key
