racters together", "groupingBy with Function.identity()"], ["Count each group, keeping insertion order", "LinkedHashMap::new + counting()"]], "tpl": "group-count", "puz": [[0, "import java.util.*;", false], [0, "import java.util.function.Function;", false], [0, "import java.util.stream.*;", false], [0, "", false], [0, "class Solution {", false], [4, "static Map<Character, Long> charFrequency(String s) {", false], [8, "return s.chars()", true], [16, ".mapToObj(c -> (char) c)", false], [16, ".collect(Collectors.groupingBy(", true], [24, "Function.identity(),", true], [24, "LinkedHashMap::new,", false], [24, "Collectors.counting()));", true], [4, "}", false], [0, "}", false]], "tools": ["ch-math", "st-groupingby-count", "st-groupingby-list", "st-intstream"]}, {"id": "s-first-unique", "day": 0, "pattern": "Java Streams", "title": "First non-repeated character", "slug": null, "level": "Streams", "premium": false, "statement": "Return the first character in a string that appears exactly once, or an empty Optional if there is none.", "example": "\"swiss\"  →  w", "signal": "\"First item that appears once\" → count with an order-keeping map, then stream the entries and findFirst.", "approach": ["groupingBy(identity, LinkedHashMap::new, counting())", "entrySet().stream()", "filter(count == 1).map(getKey).findFirst()"], "code": "import java.util.*;\nimport java.util.function.Function;\nimport java.util.stream.*;\n\nclass Solution {\n    static Optional<Character> firstUnique(String s) {\n        return s.chars()\n                .mapToObj(c -> (char) c)\n                .collect(Collectors.groupingBy(Function.identity(), LinkedHashMap::new, Collectors.counting()))\n                .entrySet().stream()\n                .filter(e -> e.getValue() == 1)\n                .map(Map.Entry::getKey)\n                .findFirst();\n    }\n}", "complexity": "Time O(n), space O(distinct characters).", "pitfall": "Using a plain HashMap here gives a random \"first\" answer: order is the who ion {\n    static Set<Integer> duplicates(List<Integer> nums) {\n        Set<Integer> seen = new HashSet<>();\n        return nums.stream()\n                .filter(n -> !seen.add(n))\n                .collect(Collectors.toCollection(LinkedHashSet::new));\n    }\n}", "complexity": "Time O(n), space O(n).", "pitfall": "The lambda changes outside state, so it only works on sequential streams. Mention the pure version: groupingBy(counting()) then filter count > 1.", "plain": ["Create an empty HashSet outside the stream to remember what we've seen.", "seen.add(n) returns false when n was already there, so filter(n -> !seen.add(n)) keeps exactly the repeated values.", "Collect into a LinkedHashSet so each duplicate is listed once, in the order it was found."], "short": [["Keep a set of numbers already seen", "Set.add returns false on a repeat"], ["Keep only numbers whose add fails", "filter(n -> !seen.add(n))"], ["Collect into an order-keeping set", "each duplicate appears once"]], "tpl": "group-count", "puz": [[0, "import java.util.*;", false], [0, "import java.util.stream.*;", false], [0, "", false], [0, "class Solution {", false], [4, "static Set<Integer> duplicates(List<Integer> nums) {", false], [8, "Set<Integer> seen = new HashSet<>();", true], [8, "return nums.stream()", false], [16, ".filter(n -> !seen.add(n))", true], [16, ".collect(Collectors.toCollection(LinkedHashSet::new));", true], [4, "}", false], [0, "}", false]], "tools": ["set-add", "list-add", "st-filter-map"]}, {"id": "s-second-highest", "day": 0, "pattern": "Java Streams", "title": "Second highest salary", "slug": null, "level": "Streams", "premium": false, "statement": "Given employees, return the second highest distinct salary.", "example": "salaries 120, 150, 90, 110, 70, 150  →  120.0", "signal": "\"Nth highest\" → map to the value, distinct, sort descending, skip(n-1), findFirst.", "approach": ["map(Employee::salary)", "distinct()", "sorted(reverseOrder()).skip(1).findFirst()"], "code": "import y)).", "approach": ["Arrays.stream(sentence.split(\" \"))", "filter(w -> !w.isEmpty())", "max(Comparator.comparingInt(String::length)).orElse(\"\")"], "code": "import java.util.*;\nimport java.util.stream.*;\n\nclass Solution {\n    static String longestWord(String sentence) {\n        return Arrays.stream(sentence.split(\" \"))\n                .filter(w -> !w.isEmpty())\n                .max(Comparator.comparingInt(String::length))\n                .orElse(\"\");\n    }\n}", "complexity": "Time O(n), space O(n).", "pitfall": "max keeps the first of equal elements here; if the rule were \"last on a tie\", you'd use reduce((a, b) -> b.length() >= a.length() ? b : a).", "plain": ["Split on spaces and stream the pieces.", "Two spaces in a row produce empty strings, so filter them out.", "max with a comparator on length returns an Optional of the longest word; orElse(\"\") handles an empty sentence."], "short": [["Split the sentence into words", "Arrays.stream(sentence.split(\" \"))"], ["Ignore empty pieces", "double spaces create empty strings"], ["Take the max by length, or \"\" if none", "max(comparingInt(String::length)).orElse(\"\")"]], "tpl": "group-count", "puz": [[0, "import java.util.*;", false], [0, "import java.util.stream.*;", false], [0, "", false], [0, "class Solution {", false], [4, "static String longestWord(String sentence) {", false], [8, "return Arrays.stream(sentence.split(\" \"))", true], [16, ".filter(w -> !w.isEmpty())", true], [16, ".max(Comparator.comparingInt(String::length))", false], [16, ".orElse(\"\");", true], [4, "}", false], [0, "}", false]], "tools": ["str-split", "arr-stream-sum", "st-filter-map", "st-find-max"]}, {"id": "s-reverse-words", "day": 0, "pattern": "Java Streams", "title": "Reverse each word in a sentence", "slug": null, "level": "Streams", "premium": false, "statement": "Reverse the letters of each word while keeping the words in their original order.", "example": "\"java streams rock\"  →  \"avaj smaerts kcor\"", "signal": "\"Transform each word, rebuild the sentence\" → split → map → joining(\" \").", "approach": ["Arrays.stream(sentence.split(\" \"))", "map(w -> new StringBuilder(w).reverse().toString())", "collect(joining(\" \"))"], "code": "import java.util.*;\nimport java.util.stream.*;\n\nclass Solution {\n    static String reverseWords(String sentence) {\n        return Arrays.stream(sentence.split(\" \"))\n                .map(w -> new StringBuilder(w).reverse().toString())\n                .collect(Collectors.joining(\" \"));\n    }\n}", "complexity": "Time O(n), space O(n).", "pitfall": "If the question is \"reverse the word order\" instead, collect to a list, Collections.reverse it, then join.", "plain": ["Split the sentence on spaces and stream the words.", "map each word to its reverse using StringBuilder.reverse(), then back to a String.", "Collectors.joining(\" \") puts the words back together with single spaces."], "short": [["Split into words", "Arrays.stream(sentence.split(\" \"))"], ["Reverse each word", "new StringBuilder(w).reverse()"], ["Join back with spaces", "joining(\" \")"]], "tpl": "group-count", "puz": [[0, "import java.util.*;", false], [0, "import java.util.stream.*;", false], [0, "", false], [0, "class Solution {", false], [4, "static String reverseWords(String sentence) {", false], [8, "return Arrays.stream(sentence.split(\" \"))", true], [16, ".map(w -> new StringBuilder(w).reverse().toString())", true], [16, ".collect(Collectors.joining(\" \"));", false], [4, "}", false], [0, "}", false]], "tools": ["str-split", "sb-reverse", "arr-stream-sum", "st-filter-map", "st-joining"]}, {"id": "s-palindrome", "day": 0, "pattern": "Java Streams", "title": "Palindrome check with IntStream", "slug": null, "level": "Streams", "premium": false, "statement": "Return true if a string is a palindrome after removing non-alphanumeric characters and ignoring case, using IntStream.", "example": "\"Madam, I'm Adam\"  →  true", "signal": "\"Check every index pair\" → IntStream.range(0, n / 2).allMatch(i -> ...).", "approach": ["String clean = s.toLowerCase().replaceAll(\"[^a-z0-9]\", \"\")", "IntStream.range(0, clean.length() / 2)", "allMatch(i -> clean.charAt(i) == clean.charAt(clean.length() - 1 - i))"], "code": "import java.util.*;\nimport java.util.stream.*;\n\nclass Solution {\n    static boolean isPalindrome(String s) {\n        String clean = s.toLowerCase().replaceAll(\"[^a-z0-9]\", \"\");\n        return IntStream.range(0, clean.length() / 2)\n                .allMatch(i -> clean.charAt(i) == clean.charAt(clean.length() - 1 - i));\n    }\n}", "complexity": "Time O(n), space O(n) for the cleaned copy.", "pitfall": "The two-pointer loop uses O(1) extra space; mention it as the more efficient version.", "plain": ["Lower-case the string and remove everything that isn't a letter or digit, so punctuation and spaces don't count.", "IntStream.range(0, length / 2) gives the indexes of the first half; each index i is compared with its mirror length - 1 - i.", "allMatch returns true only if every pair matches, and it stops early on the first mismatch."], "short": [["Clean the string first", "lower-case, keep only letters and digits"], ["Check the first half against the mirror", "IntStream.range(0, n / 2)"], ["All pairs must match", "allMatch stops at the first mismatch"]], "tpl": "group-count", "puz": [[0, "import java.util.*;", false], [0, "import java.util.stream.*;", false], [0, "", false], [0, "class Solution {", false], [4, "static boolean isPalindrome(String s) {", false], [8, "String clean = s.toLowerCase().replaceAll(\"[^a-z0-9]\", \"\");", true], [8, "return IntStream.range(0, clean.length() / 2)", false], [16, ".allMatch(i -> clean.charAt(i) == clean.charAt(clean.length() - 1 - i));", true], [4, "}", false], [0, "}", false]], "tools": ["str-charat", "str-trim-case", "st-match", "st-intstream"]}, {"id": "s-count-vowels", "day": 0, "pattern": "Java Streams", "title": "Count vowels in a string", "slug": null, "level": "Streams", "premium": false, "statement": "Count the vowels (a, e, i, o, u) in a string, ignoring case.", "example": "\"Interview\"  →  4", "signal": "\"Count characters that match a rule\" → chars() → filter → count().", "approach": ["s.toLowerCase().chars()", "filter(c -> \"aeiou\".indexOf(c) >= 0)", "count()"], "code": "import java.util.*;\nimport java.util.stream.*;\n\nclass Solution {\n    static long countVowels(String s) {\n        return s.toLowerCase().chars()\n                .filter(c -> \"aeiou\".indexOf(c) >= 0)\n                .count();\n    }\n}", "complexity": "Time O(n), space O(1) beyond the lower-cased copy.", "pitfall": "count() returns long, not int; return a long or use Math.toIntExact.", "plain": ["Lower-case first so 'I' and 'i' both count, then chars() gives an IntStream of character codes.", "\"aeiou\".indexOf(c) is -1 for anything that isn't a vowel, so filtering on >= 0 keeps only vowels.", "count() returns how many are left, as a long."], "short": [["Lower-case and stream the characters", "toLowerCase().chars()"], ["Keep only vowels", "\"aeiou\".indexOf(c) >= 0"], ["Count them", "count()"]], "tpl": "group-count", "puz": [[0, "import java.util.*;", false], [0, "import java.util.stream.*;", false], [0, "", false], [0, "class Solution {", false], [4, "static long countVowels(String s) {", false], [8, "return s.toLowerCase().chars()", true], [16, ".filter(c -> \"aeiou\".indexOf(c) >= 0)", false], [16, ".count();", true], [4, "}", false], [0, "}", false]], "tools": ["str-indexof", "str-trim-case", "st-filter-map", "st-intstream"]}], "days": [{"day": 1, "date": "2026-11-02", "focus": "Arrays & hashing", "theme": "Resume, applications, LLM basics", "tasks": ["Rewrite your resume summary and top 3 bullets for FDE roles (formula is in the prep doc)", "Send 15 applications (titles list is in the prep doc)", "Flashcards: AI & LLM, cards 1–6 (fundamentals)"], "min": ["Send 5 applications", "Solve Two Sum"]}, {"day": 2, "date": "2026-11-03", "focus": "Two po ad queue.size() before each level."], ["Binary search tree", "In-order walk is sorted; validate with (low, high) bounds as long values."], ["Grid of connected regions", "Flood fill each unvisited cell with DFS/BFS and mark it visited."], ["Something spreads one step per tick from many sources", "Multi-source BFS: queue all sources first; each BFS level is one tick."], ["Prerequisites, build order, can-it-finish", "Topological sort (Kahn): in-degrees, queue the zeros, count processed nodes."], ["Intervals", "Sort by start, then sweep. Max overlap at once → min-heap of end times."], ["Count the ways / best total where each choice depends on the last one or two", "1-D DP; keep only the last two values when you can."]], "syntax": [["Count how often each value appears", "map.merge(x, 1, Integer::sum);"], ["Add to a list in a map, creating the list if missing", "map.computeIfAbsent(key, k -> new ArrayList<>()).add(value);"], ["Read a map value with a default", "map.getOrDefault(key, 0)"], ["Loop over a map's keys and values", "for (var e : map.entrySet()) { e.getKey(); e.getValue(); }"], ["A stack in Java", "Deque<Integer> st = new ArrayDeque<>();  st.push(x);  st.pop();  st.peek();  (not the old Stack class)"], ["A queue in Java", "Deque<Integer> q = new ArrayDeque<>();  q.offer(x);  q.poll();  q.peek();"], ["Min-heap and max-heap", "new PriorityQueue<>()   and   new PriorityQueue<>(Comparator.reverseOrder())"], ["Heap of int[] ordered by the second value", "new PriorityQueue<int[]>((a, b) -> Integer.compare(a[1], b[1]))"], ["Sort a 2-D array by the first element", "Arrays.sort(arr, (a, b) -> Integer.compare(a[0], b[0]));"], ["Sort strings by length, then alphabetically", "list.sort(Comparator.comparing(String::length).thenComparing(Comparator.naturalOrder()));"], ["Count letters a–z in a string", "int[] cnt = new int[26];  for (char c : s.toCharArray()) cnt[c - 'a']++;"], ["String to char array and back", "char[] a = s.toCharArray();   new String(a)"], ["Build a string in a loop", "StringBuilder sb = new StringBuilder();  sb.append(x);  sb.reverse();  sb.toString();"], ["Fill an array with one value", "Arrays.fill(dp, Integer.MAX_VALUE);"], ["List<int[]> to int[][]", "res.toArray(new int[0][])"], ["List<Integer> to int[]", "list.stream().mapToInt(Integer::intValue).toArray()"], ["The four grid directions", "int[][] dirs = {{1, 0}, {-1, 0}, {0, 1}, {0, -1}};"], ["Overflow-safe middle and multiplication", "int mid = lo + (hi - lo) / 2;    long x = (long) a * b;"], ["Compare two Integer objects from a map", "a.equals(b)  — never ==, which only works for small cached values (-128 to 127)"], ["Group with streams and count", "list.stream().collect(Collectors.groupingBy(Item::key, Collectors.counting()))"]], "core": [{"q": "Why must you override hashCode when you override equals?", "say": "Equal objects must have equal hash codes, otherwise hash-based collections break.", "explain": "HashMap and HashSet first use hashCode to pick a bucket, then equals inside that bucket. If two equal objects return different hash codes, they land in different buckets, so lookups miss and a Set can hold \"duplicates\".", "example": "Two User objects with the same id are equal, but without hashCode a HashSet keeps both. I use Objects.hash on the same fields as equals, or simply a record, which generates both correctly.", "push": "The reverse isn't required: unequal objects may share a hash code. That's a collision, handled inside the bucket.", "code": "record User(int id, String name) {}   // equals + hashCode generated together"}, {"q": "How does HashMap work internally?", "say": "HashMap is an array of buckets: the key's hash picks the bucket, and equals finds the entry inside it.", "explain": "Collisions chain in a linked list that becomes a red-black tree after 8 entries (once the table has at least 64 buckets). When size passes capacity × 0.75, the table doubles and entries are redistributed.", "example": "Average get and put are O(1). A bad hashCode that returns a constant pushes everything into one bucket, which degrades to O(log n) thanks to treeification instead of O(n).", "push": "It isn't thread-safe; for concurrent access use ConcurrentHashMap. HashMap allows one null key, ConcurrentHashMap allows none."}, {"q": "Why is String immutable?", "say": "So it can be shared safely: by the string pool, across threads, and as a map key.", "explain": "Because a String never changes, the JVM can reuse one literal everywhere, threads can share it without locks, and its hashCode is computed once and cached.", "example": "Using a String as a HashMap key is safe; a mutable key could change after insertion and get lost. It also stops a file path from changing after a security check.", "push": "The cost is that every change creates a new object, which is why I build strings in loops with StringBuilder."}, {"q": "\"java\" vs new String(\"java\")?", "say": "A literal comes from the string pool and is reused; new String always creates a new object on the heap.", "explain": "Two identical literals point to the same pooled object, so == is true. new String gives a different object with the same text. intern() returns the pooled copy.", "example": "That's exactly why I always compare strings with equals, never ==.", "push": "Since Java 7 the pool lives on the regular heap, so interning many strings no longer risks PermGen errors.", "code": "String a = \"java\", b = \"java\", c = new String(\"java\");\na == b        // true  (same pooled object)\na == c        // false (different object)\na.equals(c)   // true  (same text)"}, {"q": "String vs StringBuilder vs StringBuffer?", "say": "String is immutable, StringBuilder is a fast mutable builder, and StringBuffer is its old synchronized twin.", "explain": "Using + inside a loop creates a new String each time, which is O(n²) copying. StringBuilder appends into one buffer. StringBuffer adds locks you almost never need, since builders are usually local to a method.", "example": "To join a collection I don't even need a builder: Collectors.joining does it in one line.", "push": "A single expression like a + b + c is already optimised by the compiler (invokedynamic since Java 9); the real problem is concatenating in loops.", "code": "String csv = names.stream().collect(Collectors.joining(\",\"));"}, {"q": "Checked vs unchecked exceptions?", "say": "Checked exceptions must be caught or declared; unchecked ones (RuntimeException) don't have to be.", "explain": "Checked exceptions model recoverable external failures like IOException. Unchecked ones signal programming errors like NullPointerException or IllegalArgumentException.", "example": "In a Spring service I wrap a checked IOException from a parser in a custom unchecked exception and map it to an HTTP status in @RestControllerAdvice.", "push": "Spring prefers unchecked exceptions, and @Transactional rolls back only on unchecked ones by default unless you set rollbackFor."}, {"q": "If try has a return, does finally still run?", "say": "Yes. finally always runs before the method returns, unless the JVM exits or the thread dies.", "explain": "The return value is computed first, then finally runs, then the method returns. If finally has its own return, it replaces the original value and even swallows exceptions.", "example": "This method returns 2, not 1, which is why I never return from finally.", "push": "I use finally only for cleanup, and prefer try-with-resources for closing things.", "code": "int f() {\n    try { return 1; }\n    finally { return 2; }   // overrides: returns 2\n}"}, {"q": "How does try-with-resources work?", "say": "It closes any AutoCloseable resources automatically when the block ends, even if an exception is thrown.", "explain": "Resources close in reverse order of declaration. If the body and close() both throw, the body's exception wins and the close exception is attached as suppressed.", "example": "Typical JDBC code: the statement closes first, then the connection, with no finally blocks.", "push": "Before Java 7 nested finally blocks often lost the original exception; getSuppressed() solved that.", "code": "try (var conn = ds.getConnection();\n     var ps = conn.prepareStatement(sql)) {\n    ...\n}   // ps closed, then conn"}, {"q": "Abstract class vs interface (Java 8+)?", "say": "Interfaces define capabilities a class can have many of; abstract classes share state and code in a single-inheritance hierarchy.", "explain": "Since Java 8 interfaces can have default and static methods (and private ones since 9), but no instance fields or constructors. Abstract classes can have fields, constructors and protected members.", "example": "Comparable and Runnable are interfaces any class can add. An AbstractPaymentProcessor with shared retry logic and a template method fits an abstract class.", "push": "Default methods exist mainly to evolve interfaces without breaking implementers, like List.sort added in Java 8."}, {"q": "What is a functional interface?", "say": "An interface with exactly one abstract method, so it can be implemented with a lambda or method reference.", "explain": "Examples are Runnable, Supplier, Function, Predicate and Comparator. @FunctionalInterface makes the compiler check there's only one abstract method; default methods don't count.", "example": "Predicates and functions plug straight into streams.", "push": "The java.util.function package covers most needs; I define my own only when a name adds meaning, like Validator<T>.", "code": "Predicate<String> isEmail = s -> s.contains(\"@\");\nList<String> valid = inputs.stream().filter(isEmail).toList();"}, {"q": "== vs equals?", "say": "== compares references for objects; equals compares content when the class overrides it.", "explain": "For primitives == compares values. For objects it asks \"same instance?\". String, Integer and records override equals to compare values.", "example": "The Integer cache makes == look correct for small numbers and fail for bigger ones.", "push": "That cache (-128 to 127) is why == bugs pass small unit tests and fail in production.", "code": "Integer a = 127, b = 127;   a == b       // true (cached)\nInteger c = 128, d = 128;   c == d       // false\n                            c.equals(d)  // true"}, {"q": "Is Java pass-by-value or pass-by-reference?", "say": "Java is always pass-by-value; for objects, the value passed is a copy of the reference.", "explain": "So a method can change the object the reference points to, but reassigning the parameter only changes its local copy.", "example": "rename() changes what the caller sees; replace() doesn't.", "push": "That's also why you can't write a swap(a, b) method for objects in Java.", "code": "void rename(User u)  { u.setName(\"Ravi\"); }   // caller sees it\nvoid replace(User u) { u = new User(); }      // caller doesn't"}, {"q": "final vs finally vs finalize?", "say": "final is a modifier, finally is a block that always runs, and finalize is a deprecated GC hook.", "explain": "A final variable can't be reassigned, a final method can't be overridden, a final class can't be extended. finally runs after try/catch for cleanup. finalize() is deprecated for removal because it's unpredictable and slow.", "example": "For cleanup I use try-with-resources, and java.lang.ref.Cleaner in the rare case I need GC-triggered cleanup.", "push": "final fields also get a safe-publication guarantee under the Java Memory Model once the constructor finishes."}, {"q": "When do static and instance blocks run?", "say": "A static block runs once when the class is initialised; instance blocks run every time an object is created.", "explain": "Order: parent static, child static (once). Then for each object: parent instance blocks and constructor, then child instance blocks and constructor.", "example": "With prints 1–6 in parent-static, parent-instance, parent-constructor, child-static, child-instance, child-constructor, new Child() prints 142356, a classic output question.", "push": "Class initialisation is lazy and thread-safe, which is exactly what makes the holder-class singleton work."}, {"q": "What is type erasure?", "say": "Generic type information exists only at compile time; at runtime it's erased.", "explain": "List<String> and List<Integer> are both just List at runtime; the compiler inserts the casts and checks for you.", "example": "So you can't write new T(), create a T[] array, check instanceof List<String>, or overload save(List<User>) and save(List<Order>): they erase to the same signature.", "push": "To keep the type at runtime, frameworks pass a Class<T> or a type token, like Jackson's TypeReference<List<User>>."}, {"q": "What does PECS mean?", "say": "Producer extends, consumer super: use ? extends when you read from a collection and ? super when you write into it.", "explain": "List<? extends Number> gives you Numbers but you can't add to it. List<? super Integer> accepts Integers but only gives back Object.", "example": "This is the shape of Collections.copy:", "push": "It's also why sort methods take a Comparator<? super T>: a comparator for Number can sort Integers.", "code": "static <T> void copy(List<? super T> dest, List<? extends T> src) {\n    dest.addAll(src);\n}"}, {"q": "ArrayList vs LinkedList?", "say": "ArrayList is the default; LinkedList is rarely better in practice.", "explain": "ArrayList gives O(1) random access, fast appends and great cache locality. LinkedList has O(1) insert/remove only when you already hold the node, O(n) get(i), and much more memory per element.", "example": "For a queue or stack I use ArrayDeque, not LinkedList.", "push": "Even middle inserts are often faster on ArrayList for moderate sizes, because copying an array is cheaper than chasing pointers."}, {"q": "HashMap vs LinkedHashMap vs TreeMap?", "say": "HashMap for fast lookup with no order, LinkedHashMap to keep insertion or access order, TreeMap for sorted keys.", "explain": "HashMap and LinkedHashMap are O(1) on average. TreeMap is a red-black tree: O(log n), with navigation methods like floorKey, ceilingKey and subMap.", "example": "Passing TreeMap::new to groupingBy gives sorted output for free:", "push": "LinkedHashMap with accessOrder=true plus removeEldestEntry is a five-line LRU cache.", "code": "Map<String, Long> counts = words.stream()\n    .collect(Collectors.groupingBy(w -> w, TreeMap::new, Collectors.counting()));"}, {"q": "Fail-fast vs fail-safe iterators?", "say": "Fail-fast iterators throw ConcurrentModificationException if the collection changes during iteration; concurrent collections don't.", "explain": "ArrayList and HashMap track a modCount that the iterator checks on next(). CopyOnWriteArrayList iterates a snapshot; ConcurrentHashMap's iterators are weakly consistent.", "example": "Removing inside a for-each over an ArrayList usually throws; I use removeIf or build a new list.", "push": "Fail-fast is a best-effort bug detector, not a thread-safety guarantee."}, {"q": "How do you remove items while looping over a list?", "say": "With removeIf or iterator.remove(), never list.remove() inside a for-each.", "explain": "The for-each uses an iterator, and changing the list behind its back trips the modCount check.", "example": "Either mutate safely, or produce a new filtered list with a stream:", "push": "With streams I prefer creating a new list over mutating the old one; it's easier to reason about.", "code": "orders.removeIf(o -> o.status() == CANCELLED);\n// or\nList<Order> active = orders.stream()\n    .filter(o -> o.status() != CANCELLED)\n    .toList();"}, {"q": "Comparable vs Comparator?", "say": "Comparable is the natural order inside the class; Comparator is an external ordering you can compose.", "explain": "A class implements compareTo once. Comparators can be built on the fly and chained with thenComparing and reversed().", "example": "Sorting employees by salary (highest first), then by name:", "push": "Use Integer.compare or comparingInt instead of a - b, which can overflow.", "code": "employees.stream()\n    .sorted(Comparator.comparingDouble(Employee::salary).reversed()\n                      .thenComparing(Employee::name))\n    .toList();"}, {"q": "How do you make a class immutable?", "say": "Final class, private final fields, no setters, and defensive copies of anything mutable.", "explain": "Copy mutable inputs in the constructor and return copies or unmodifiable views from getters, otherwise callers can still change your state through a shared list.", "example": "A record with a compact constructor that copies the list:", "push": "Immutable objects are automatically thread-safe and safe to use as map keys.", "code": "record Order(String id, List<String> items) {\n    Order { items = List.copyOf(items); }   // defensive copy\n}"}, {"q": "How should Optional be used?", "say": "Optional is a return type for \"there may be no value\"; it's not meant for fields or parameters.", "explain": "It forces callers to handle absence. Chain map, filter, orElseGet and orElseThrow, and avoid get() without a check.", "example": "Navigating a chain of possibly-missing values without null checks:", "push": "orElse(x) always evaluates x, even when a value is present; for expensive defaults use orElseGet(() -> load()).", "code": "String city = userRepo.findById(id)\n    .map(User::address)\n    .map(Address::city)\n    .orElse(\"Unknown\");"}, {"q": "Stream intermediate vs terminal operations?", "say": "Intermediate operations build a lazy pipeline; nothing runs until a terminal operation.", "explain": "filter, map, sorted and distinct return new streams. collect, forEach, count and findFirst trigger execution, element by element where possible. A stream can't be reused.", "example": "Thanks to laziness and short-circuiting, this stops at the first match instead of processing the whole list:", "push": "That's why a stream with no terminal operation does nothing at all, a favourite trick question.", "code": "Optional<String> first = names.stream()\n    .filter(n -> n.startsWith(\"A\"))\n    .map(String::toUpperCase)\n    .findFirst();"}, {"q": "map vs flatMap?", "say": "map turns each element into one new element; flatMap turns each element into a stream and flattens them.", "explain": "Use flatMap when every item contains a collection and you want one combined stream.", "example": "All distinct skills across all employees:", "push": "Optional has the same pair: use flatMap when the mapping function itself returns an Optional.", "code": "List<String> skills = employees.stream()\n    .flatMap(e -> e.skills().stream())\n    .distinct()\n    .toList();"}, {"q": "What are common Streams pitfalls?", "say": "Side effects in lambdas, misusing parallel streams, and toMap blowing up on duplicate keys.", "explain": "Lambdas should be stateless. Parallel streams use the shared common pool and hurt on small or blocking work. toMap throws IllegalStateException on duplicates unless you give a merge function.", "example": "toMap with a merge function that keeps the first value:", "push": "Also: a stream can be consumed only once, and peek is for debugging, not business logic.", "code": "Map<String, User> byEmail = users.stream()\n    .collect(Collectors.toMap(User::email, u -> u, (first, second) -> first));"}, {"q": "What are the JVM memory areas?", "say": "The heap for objects, one stack per thread for method calls, and metaspace for class metadata.", "explain": "The heap is shared and garbage-collected. Each thread's stack holds frames with local variables. Metaspace (native memory since Java 8) holds class definitions, and the code cache holds JIT output.", "example": "Infinite recursion gives StackOverflowError; a leaking cache gives OutOfMemoryError: Java heap space; generating too many classes can exhaust metaspace.", "push": "In containers I set -Xmx (or MaxRAMPercentage) with the memory limit in mind and capture a heap dump on OOM with -XX:+HeapDumpOnOutOfMemoryError."}, {"q": "How does garbage collection work, and which collector would you pick?", "say": "Java's GC is generational: most objects die young, so frequent young-generation collections are cheap.", "explain": "G1 is the default: region-based with a pause-time target. ZGC aims for very short pauses on large heaps. Parallel GC maximises throughput for batch jobs.", "example": "For a latency-sensitive API with a big heap I'd evaluate ZGC; for most services the G1 defaults are fine.", "push": "I tune from evidence in GC logs (-Xlog:gc) rather than guessing flags."}, {"q": "How would you find a memory leak?", "say": "A leak in Java is objects still referenced but no longer needed, so the GC can't free them.", "explain": "I watch heap usage after full GCs trending upward, take a heap dump, and open it in Eclipse MAT to find the dominator holding the memory.", "example": "Usual causes: static maps used as caches with no eviction, ThreadLocals in pooled threads, listeners never removed, unclosed resources.", "push": "Fixes: bounded caches (Caffeine with maximumSize), ThreadLocal.remove() in finally, and try-with-resources."}, {"q": "How does class loading work?", "say": "Classes are loaded on demand by a hierarchy of class loaders using parent delegation.", "explain": "The application loader asks the platform loader, which asks the bootstrap loader, before loading anything itself. That stops anyone from replacing java.lang.String.", "example": "ClassNotFoundException means the loader couldn't find a class it was asked for; NoClassDefFoundError means it existed at compile time but is missing or failed to initialise at runtime, often a dependency conflict.", "push": "Servers and Spring Boot DevTools use separate class loaders so application classes can be reloaded without restarting the JVM."}, {"q": "What does the JIT compiler do?", "say": "The JIT compiles frequently used bytecode into optimised native code while the program runs.", "explain": "Code starts interpreted; hot methods are compiled quickly by C1 and later by C2 with aggressive optimisations like inlining and escape analysis.", "example": "That's why the first requests after a deploy are slower, and why benchmarks need warm-up or JMH.", "push": "CDS/AOT caches and GraalVM native images reduce that startup cost."}, {"q": "Strong, soft, weak and phantom references?", "say": "Strong references keep objects alive; soft, weak and phantom references let the GC reclaim them.", "explain": "Soft references are cleared under memory pressure, weak ones at the next GC, and phantom ones are used for cleanup after an object is collected.", "example": "WeakHashMap uses weak keys, so entries vanish once the key isn't used anywhere else, which is handy for metadata caches.", "push": "For real caches I'd use Caffeine with size and time limits rather than rely on soft references."}, {"q": "What are the risks of Java serialization?", "say": "Built-in Java serialization is fragile and a security risk, so I avoid it for anything external.", "explain": "Class changes can break compatibility (serialVersionUID helps), and deserialising untrusted bytes can execute code through gadget chains.", "example": "For APIs and messages I use JSON with Jackson or Protobuf, and mark sensitive fields transient if a class must be Serializable.", "push": "Java added deserialization filters (ObjectInputFilter) to restrict what can be deserialised."}, {"q": "Why are enums more than constants?", "say": "Enums are type-safe constants that can carry fields and behaviour.", "explain": "Each constant is a singleton instance; enums can have constructors, methods and even per-constant behaviour, and switch can check them exhaustively.", "example": "An enum with a code field, looked up with a stream:", "push": "EnumMap and EnumSet are array and bitmask based, so they're faster than HashMap/HashSet for enum keys.", "code": "enum Status { ACTIVE(\"A\"), CLOSED(\"C\");\n    final String code;\n    Status(String code) { this.code = code; }\n    static Status of(String c) {\n        return Arrays.stream(values()).filter(s -> s.code.equals(c)).findFirst().orElseThrow();\n    }\n}"}, {"q": "How do you write a thread-safe singleton?", "say": "The simplest thread-safe singleton is an enum; the holder-class idiom gives lazy loading without locks.", "explain": "The JVM initialises a class once and thread-safely, so a static nested holder creates the instance on first access.", "example": "Holder-class idiom:", "push": "In Spring I don't hand-roll singletons: beans are singleton-scoped by default and easier to test.", "code": "class Config {\n    private Config() {}\n    private static class Holder { static final Config INSTANCE = new Config(); }\n    static Config get() { return Holder.INSTANCE; }\n}"}, {"q": "Overloading vs overriding?", "say": "Overloading is the same name with different parameters, chosen at compile time; overriding replaces a parent method, chosen at runtime.", "explain": "Overloading uses the declared types of the arguments; overriding uses the actual object type (dynamic dispatch).", "example": "Animal a = new Dog(); a.speak() calls Dog's version. But with print(Object) and print(String), calling print with an Object-typed variable picks print(Object), even if it holds a String.", "push": "Static methods are hidden, not overridden: they're resolved by the reference type."}, {"q": "What are the rules when overriding a method?", "say": "Same signature, same or covariant return type, no weaker access, and no broader checked exceptions.", "explain": "A subclass can return a subtype, keep or widen visibility, and throw fewer or narrower checked exceptions. @Override makes the compiler catch signature typos.", "example": "Object.clone() is protected and returns Object, but an override can be public and return the subclass type.", "push": "Private, static and final methods can't be overridden."}, {"q": "What are records good for, and what can't they do?", "say": "Records are concise immutable data carriers with equals, hashCode, toString and accessors generated.", "explain": "Fields are private final; records can't extend classes but can implement interfaces, have static members and use compact constructors for validation.", "example": "A value object with validation:", "push": "Great for DTOs, map keys and LLM structured outputs, but not JPA entities, which need to be mutable and proxyable.", "code": "record Money(BigDecimal amount, String currency) {\n    Money { if (amount.signum() < 0) throw new IllegalArgumentException(\"negative\"); }\n}"}, {"q": "What does pattern matching for switch give you (Java 21)?", "say": "switch can match on types, deconstruct records and use guards, and the compiler checks exhaustiveness for sealed types.", "explain": "It replaces chains of instanceof checks and casts with one expression.", "example": "With a sealed Shape interface:", "push": "If I add a new Shape and forget a case, it's a compile error instead of a runtime bug.", "code": "String describe(Shape s) {\n    return switch (s) {\n        case Circle c when c.r() > 10 -> \"big circle\";\n        case Circle c                -> \"circle\";\n        case Square(double side)     -> \"square \" + side;\n    };\n}"}, {"q": "What happens if you mutate an object used as a HashMap key?", "say": "If its hashCode changes after insertion, the entry becomes unreachable: a silent memory leak.", "explain": "HashMap stored the entry in the bucket for the old hash; lookups now go to a different bucket and don't find it.", "example": "A mutable List, or an entity whose hashCode uses a field that later changes, used as a key.", "push": "Use immutable keys: Strings, records or IDs."}, {"q": "How do you handle overflow and money?", "say": "Integer overflow is silent in Java and double can't represent money exactly, so I use exact methods and BigDecimal.", "explain": "Math.addExact and multiplyExact throw on overflow. For money use BigDecimal with explicit rounding, or whole paise in a long.", "example": "The classic floating-point surprise:", "push": "Always build BigDecimal from a String, not a double, or you import the double's error.", "code": "new BigDecimal(\"0.1\").add(new BigDecimal(\"0.2\"))   // 0.3 exactly\n0.1 + 0.2                                          // 0.30000000000000004"}, {"q": "What does autoboxing cost?", "say": "Autoboxing allocates objects and can throw NullPointerException, so it matters in hot paths.", "explain": "Each box outside the small cache is a new Integer object, adding GC pressure, and unboxing null throws NPE.", "example": "Primitive streams avoid boxing entirely:", "push": "Stream<Integer>.reduce(0, Integer::sum) boxes at every step; mapToInt(...).sum() doesn't.", "code": "long total = orders.stream()\n    .mapToLong(Order::amountPaise)\n    .sum();"}, {"q": "What are sequenced collections (Java 21)?", "say": "Java 21 added a common API for ordered collections: getFirst, getLast, addFirst, removeLast and reversed.", "explain": "List, Deque, LinkedHashSet and sorted sets implement SequencedCollection; LinkedHashMap gets firstEntry, lastEntry and putFirst through SequencedMap.", "example": "No more list.get(list.size() - 1):", "push": "A small feature, but mentioning it shows you follow recent Java releases.", "code": "Order latest = orders.getLast();\nList<Order> newestFirst = orders.reversed();"}, {"q": "Shallow copy vs deep copy?", "say": "A shallow copy duplicates the outer object but shares the objects inside; a deep copy duplicates everything.", "explain": "clone() and new ArrayList<>(list) are shallow: both lists point at the same element objects, so changing an element shows in both.", "example": "A deeper copy using a copy constructor per element:", "push": "If the elements are immutable, sharing them is perfectly safe and no deep copy is needed.", "code": "List<User> copy = users.stream()\n    .map(User::new)          // copy constructor\n    .toList();"}], "threads": [{"q": "Runnable vs Callable vs Thread?", "say": "Runnable is a task with no result, Callable returns a result and can throw, and Thread is the worker that runs tasks.", "explain": "In real code I don't create threads directly; I submit Runnables or Callables to an ExecutorService and get Futures back.", "example": "Submitting a Callable and getting a Future:", "push": "On Java 21+ I'd consider a virtual-thread-per-task executor for I/O-heavy work.", "code": "ExecutorService pool = Executors.newFixedThreadPool(4);\nFuture<Integer> price = pool.submit(() -> computePrice());   // Callable"}, {"q": "What are the thread states?", "say": "NEW, RUNNABLE, BLOCKED, WAITING, TIMED_WAITING and TERMINATED.", "explain": "BLOCKED means waiting to enter a synchronized block; WAITING is wait/join/park without a timeout; TIMED_WAITING is sleep or a timed wait.", "example": "In a thread dump, many threads BLOCKED on one lock means contention; a whole pool WAITING on the same resource means exhaustion somewhere else.", "push": "RUNNABLE also covers threads blocked in socket I/O, which surprises people reading dumps."}, {"q": "start() vs run()?", "say": "start() creates a new thread that runs run(); calling run() directly just executes it on the current thread.", "explain": "start() can be called only once per Thread object; a second call throws IllegalThreadStateException.", "example": "A classic bug: calling thread.run() in a loop thinking it's parallel, when it all runs one after another on main.", "push": "With executors this mistake disappears because you submit tasks instead of managing threads."}, {"q": "What is a race condition?", "say": "A race condition is when the result depends on thread timing because threads read and write shared data without coordination.", "explain": "count++ is three steps (read, add, write); two threads can read the same value and one increment is lost.", "example": "An atomic counter fixes it without a lock:", "push": "Check-then-act is the other classic race: if (!map.containsKey(k)) map.put(k, v). Use putIfAbsent or computeIfAbsent.", "code": "AtomicInteger count = new AtomicInteger();\ncount.incrementAndGet();   // atomic, no lost updates"}, {"q": "What does synchronized do and lock on?", "say": "synchronized gives mutual exclusion and visibility using an object's monitor lock.", "explain": "An instance method locks this, a static method locks the Class object, and a block locks the object you pass. It's reentrant, and releasing the lock publishes your writes to the next thread that takes it.", "example": "I prefer a private lock object:", "push": "Locking on a private object means outside code can't accidentally hold my lock and cause contention or deadlock.", "code": "private final Object lock = new Object();\nvoid add(Item i) { synchronized (lock) { items.add(i); } }"}, {"q": "volatile vs synchronized vs atomic classes?", "say": "volatile gives visibility, synchronized gives visibility plus mutual exclusion, and atomics give lock-free single-variable updates.", "explain": "A volatile boolean stop flag is perfect; a volatile int with count++ is still a race. Use AtomicInteger or a lock for that.", "example": "Picking the right tool:", "push": "If two variables must change together, neither volatile nor separate atomics are enough: use a lock or an immutable snapshot.", "code": "private volatile boolean running = true;                 // visibility only\nprivate final AtomicInteger hits = new AtomicInteger();   // atomic updates"}, {"q": "What causes deadlock and how do you prevent it?", "say": "Deadlock is threads waiting on each other's locks forever; I prevent it with a consistent lock order or lock timeouts.", "explain": "It needs mutual exclusion, hold-and-wait, no preemption and circular wait. Breaking circular wait is the usual fix.", "example": "transfer(a, b) and transfer(b, a) running together deadlock; always locking the account with the smaller ID first fixes it.", "push": "A thread dump (jstack) prints \"Found one Java-level deadlock\" with the threads and locks involved."}, {"q": "Livelock vs starvation?", "say": "Livelock: threads keep reacting to each other and make no progress. Starvation: a thread never gets the resource.", "explain": "Livelock is like two people stepping aside in a corridor forever. Starvation happens with unfair locks or a greedy thread hogging a resource.", "example": "Retry loops without backoff can livelock; adding random jitter fixes it.", "push": "new ReentrantLock(true) is fair and reduces starvation, at some cost in throughput."}, {"q": "How do wait and notify work?", "say": "wait releases the monitor and sleeps until notified; notify wakes a waiting thread. Both need the lock held.", "explain": "Always wait inside a while loop that re-checks the condition, because of spurious wakeups and because another thread may have changed the state first.", "example": "The correct shape:", "push": "In real code I'd use a BlockingQueue, which implements this correctly for me.", "code": "synchronized (lock) {\n    while (queue.isEmpty()) lock.wait();\n    return queue.poll();\n}"}, {"q": "sleep vs wait?", "say": "sleep pauses the thread and keeps its locks; wait releases the lock and waits for a notify.", "explain": "sleep is a static Thread method usable anywhere; wait is an Object method that must be called while holding that object's monitor.", "example": "Calling sleep inside a synchronized block stalls every other thread waiting for that lock for the whole sleep.", "push": "Both respond to interrupt() by throwing InterruptedException."}, {"q": "ReentrantLock vs synchronized?", "say": "synchronized is simpler; ReentrantLock adds tryLock, timeouts, interruptible waits, fairness and multiple conditions.", "explain": "The price is manual unlocking, always in finally.", "example": "tryLock with a timeout instead of waiting forever:", "push": "tryLock with a timeout is a practical deadlock-avoidance tool.", "code": "if (lock.tryLock(200, TimeUnit.MILLISECONDS)) {\n    try { update(); } finally { lock.unlock(); }\n} else {\n    return busy();\n}"}, {"q": "ReadWriteLock and StampedLock?", "say": "A ReadWriteLock lets many readers in at once but only one writer; StampedLock adds cheap optimistic reads.", "explain": "Good for read-heavy shared data like a config or price cache. StampedLock's optimistic read doesn't lock: you read, then validate the stamp, and retry with a real lock if a write happened.", "example": "A pricing table read thousands of times a second and refreshed every minute.", "push": "StampedLock isn't reentrant; often an immutable snapshot swapped through an AtomicReference is simpler still."}, {"q": "How do atomic classes work?", "say": "Atomic classes update a single variable lock-free using compare-and-set (CAS).", "explain": "CAS means \"set to the new value only if it's still the old value\"; on failure it retries. That avoids blocking but can spin under heavy contention.", "example": "For a hot counter LongAdder beats AtomicLong:", "push": "AtomicReference with immutable objects lets you swap whole snapshots atomically.", "code": "LongAdder hits = new LongAdder();\nhits.increment();\nlong total = hits.sum();"}, {"q": "ThreadLocal: what's the danger in thread pools?", "say": "ThreadLocal gives each thread its own value, but in thread pools it must be cleaned up.", "explain": "Pool threads are reused, so a leftover value leaks memory or, worse, leaks one user's data into the next request.", "example": "Always pair set with remove:", "push": "With virtual threads there can be millions of threads, so heavy ThreadLocals get expensive; pass context explicitly where possible.", "code": "try {\n    CONTEXT.set(userId);\n    handle(request);\n} finally {\n    CONTEXT.remove();\n}"}, {"q": "Which ExecutorService types exist?", "say": "Fixed, cached, single-thread, scheduled, work-stealing, and since Java 21 virtual-thread-per-task executors.", "explain": "Fixed bounds the threads; cached grows without limit; scheduled runs delayed or periodic tasks; work-stealing (ForkJoinPool) suits recursive splitting.", "example": "In production I build a ThreadPoolExecutor explicitly, with a bounded queue and named threads, so overload is visible.", "push": "newCachedThreadPool under a traffic spike can create thousands of threads and take the service down."}, {"q": "Explain ThreadPoolExecutor's parameters.", "say": "Core size, max size, keep-alive, the work queue, a thread factory and a rejection policy.", "explain": "New tasks go to core threads first, then the queue, and only when the queue is full are extra threads created up to the max.", "example": "A bounded pool with back-pressure:", "push": "With an unbounded LinkedBlockingQueue the max size is never reached, a very common misconfiguration.", "code": "new ThreadPoolExecutor(8, 16, 60, TimeUnit.SECONDS,\n    new ArrayBlockingQueue<>(500),\n    new ThreadPoolExecutor.CallerRunsPolicy());"}, {"q": "What are the rejection policies?", "say": "AbortPolicy throws, CallerRunsPolicy runs the task on the submitting thread, and the two discard policies drop tasks.", "explain": "CallerRuns is natural back-pressure: the producer slows down because it's busy running the work itself.", "example": "For an event-ingestion pool I'd use CallerRuns so we slow down instead of losing events.", "push": "Silently discarding is rarely acceptable unless you count and alert on what was dropped."}, {"q": "How do you size a thread pool?", "say": "Around the number of cores for CPU-bound work; larger for I/O-bound work, based on how long threads wait.", "explain": "A rule of thumb is cores × (1 + wait time / compute time), then load test.", "example": "8 cores, tasks wait 90 ms on HTTP for every 10 ms of CPU: about 8 × 10 = 80 threads.", "push": "For heavy blocking I/O, virtual threads remove most of this tuning, but downstream limits like the DB pool still apply."}, {"q": "Future vs CompletableFuture?", "say": "Future only lets you block on get(); CompletableFuture lets you compose async steps without blocking.", "explain": "You chain transformations, combine results, handle errors and add timeouts declaratively.", "example": "Fetch user and orders in parallel and combine them, with a timeout:", "push": "Always pass an executor for blocking calls instead of relying on the common pool.", "code": "CompletableFuture.supplyAsync(() -> fetchUser(id), io)\n    .thenCombine(CompletableFuture.supplyAsync(() -> fetchOrders(id), io), Profile::new)\n    .orTimeout(2, TimeUnit.SECONDS);"}, {"q": "thenApply vs thenCompose?", "say": "thenApply transforms the result; thenCompose chains another async call that itself returns a CompletableFuture.", "explain": "It's like map vs flatMap: using thenApply with an async function gives you CompletableFuture<CompletableFuture<T>>.", "example": "Get the user, then use its id for the next async call:", "push": "thenCombine is the third one: it runs two independent futures and merges their results.", "code": "getUserAsync(id)\n    .thenCompose(u -> getOrdersAsync(u.id()))   // stays flat\n    .thenApply(orders -> orders.size());"}, {"q": "How do you call three services in parallel and combine the results?", "say": "Start all three with supplyAsync on a dedicated executor, wait with allOf, and add a timeout.", "explain": "Total latency becomes the slowest call instead of the sum of all three.", "example": "Parallel calls composed into one page:", "push": "Decide per call what failure means: fail the whole page, or use completeOnTimeout with a fallback value.", "code": "var u = CompletableFuture.supplyAsync(() -> users.get(id), io);\nvar o = CompletableFuture.supplyAsync(() -> orders.get(id), io);\nvar r = CompletableFuture.supplyAsync(() -> recs.get(id), io);\nPage page = CompletableFuture.allOf(u, o, r)\n    .orTimeout(2, TimeUnit.SECONDS)\n    .thenApply(x -> new Page(u.join(), o.join(), r.join()))\n    .join();"}, {"q": "Which thread runs CompletableFuture callbacks?", "say": "supplyAsync without an executor uses ForkJoinPool.commonPool(); non-async callbacks run on whichever thread completed the future.", "explain": "If the future is already complete when you attach thenApply, the callback runs immediately on the caller's thread.", "example": "Blocking HTTP calls on the common pool can starve parallel streams across the whole application.", "push": "So I always pass a dedicated executor, or a virtual-thread executor, for I/O."}, {"q": "CountDownLatch vs CyclicBarrier vs Semaphore?", "say": "CountDownLatch waits for N events once, CyclicBarrier makes N threads meet repeatedly, and Semaphore limits concurrent access.", "explain": "Latch: the main thread waits until workers count down. Barrier: workers wait for each other every round. Semaphore: N permits.", "example": "Limiting concurrent LLM calls to 10:", "push": "Phaser is the flexible option when the number of parties changes over time.", "code": "Semaphore llm = new Semaphore(10);\nllm.acquire();\ntry { callModel(); } finally { llm.release(); }"}, {"q": "Explain producer-consumer with a BlockingQueue.", "say": "Producers put into a BlockingQueue and consumers take from it; blocking when full or empty gives back-pressure for free.", "explain": "A bounded queue stops fast producers from exhausting memory.", "example": "The whole pattern in three lines:", "push": "Kafka is essentially this pattern spread across machines.", "code": "BlockingQueue<Job> q = new ArrayBlockingQueue<>(1000);\nq.put(job);           // producer waits if full\nJob next = q.take();  // consumer waits if empty"}, {"q": "ConcurrentHashMap vs Collections.synchronizedMap?", "say": "ConcurrentHashMap allows concurrent reads and fine-grained writes; synchronizedMap locks the whole map for every call.", "explain": "CHM uses CAS and per-bin locks, so throughput scales with threads. synchronizedMap serialises every call, and you still need external locking to iterate it.", "example": "A cache read by 200 request threads should be a ConcurrentHashMap (or Caffeine).", "push": "CHM doesn't allow null keys or values, because null would be ambiguous in a concurrent get()."}, {"q": "Is ConcurrentHashMap enough for compound actions?", "say": "Each ConcurrentHashMap call is atomic, but a sequence of calls is not.", "explain": "Check-then-put can lose updates under concurrency. Use the atomic methods putIfAbsent, computeIfAbsent and merge.", "example": "Atomic counting and loading:", "push": "Keep the function inside computeIfAbsent short, because it holds a lock on that bin while it runs.", "code": "counts.merge(word, 1L, Long::sum);                    // atomic increment\ncache.computeIfAbsent(key, k -> loadExpensive(k));    // loads once per key"}, {"q": "When do you use CopyOnWriteArrayList?", "say": "CopyOnWriteArrayList copies the array on every write, so reads are lock-free and iteration never throws.", "explain": "Perfect for read-mostly lists like event listeners; terrible for frequent writes.", "example": "Registering a few listeners at startup and iterating them on every event.", "push": "Iterators see a snapshot, so they won't see writes made during the iteration."}, {"q": "Why does double-checked locking need volatile?", "say": "Without volatile, another thread can see the reference before the object is fully constructed.", "explain": "Assignment and construction can be reordered; volatile adds a happens-before edge that forbids it.", "example": "The correct version:", "push": "The holder-class idiom or an enum avoids all of this.", "code": "private static volatile Config instance;\nstatic Config get() {\n    if (instance == null) synchronized (Config.class) {\n        if (instance == null) instance = new Config();\n    }\n    return instance;\n}"}, {"q": "When do parallel streams and Fork/Join help?", "say": "They speed up CPU-heavy work on large data, but hurt for small or blocking work.", "explain": "They split work across the shared common ForkJoinPool; splitting and merging has a cost, and blocking calls starve the pool for the whole JVM.", "example": "A CPU-bound count over millions of numbers is a good fit:", "push": "I measure before using parallel(), and never put HTTP or DB calls inside it.", "code": "long primes = LongStream.rangeClosed(1, 5_000_000)\n    .parallel()\n    .filter(this::isPrime)\n    .count();"}, {"q": "How do virtual threads work?", "say": "Virtual threads are lightweight threads managed by the JVM, so you can use a thread per request even at huge concurrency.", "explain": "They run on a small pool of carrier threads; when a virtual thread blocks on I/O it unmounts and frees the carrier for others.", "example": "Ten thousand concurrent API calls without a big pool:", "push": "Don't pool them, and limit downstream concurrency with a Semaphore. They help I/O-bound work, not CPU-bound work.", "code": "try (var exec = Executors.newVirtualThreadPerTaskExecutor()) {\n    ids.forEach(id -> exec.submit(() -> callApi(id)));\n}"}, {"q": "What is pinning with virtual threads?", "say": "A pinned virtual thread can't unmount while blocked, so it ties up its carrier thread.", "explain": "Before JDK 24, blocking inside synchronized pinned the thread; JEP 491 in JDK 24 removed most of that. Native code calling back into Java still pins.", "example": "On Java 21, a synchronized method doing a slow JDBC call under load could exhaust the carriers; switching that lock to ReentrantLock avoids it.", "push": "JFR's jdk.VirtualThreadPinned event shows where pinning happens."}, {"q": "What is structured concurrency?", "say": "Structured concurrency treats related subtasks as one unit: they start together, finish together and fail together.", "explain": "If one subtask fails, the others are cancelled, and no task outlives the method that started it. Java's StructuredTaskScope API for this is still a preview feature.", "example": "Fetching user, orders and recommendations in parallel for one page, cancelling the rest if the user lookup fails.", "push": "Today I get similar behaviour with CompletableFuture.allOf plus explicit cancellation, but it's easy to leak tasks that way."}, {"q": "How do you make code thread-safe?", "say": "My order of preference: don't share state, make it immutable, use concurrent classes, and only then add locks.", "explain": "Thread confinement and immutability need no synchronisation at all; ConcurrentHashMap and atomics cover most shared state.", "example": "Request handling keeps data local to the request; shared config is an immutable snapshot swapped with an AtomicReference.", "push": "Document which lock guards which field so reviewers can check it."}, {"q": "How should you handle InterruptedException?", "say": "Either propagate InterruptedException or restore the interrupt flag; never swallow it.", "explain": "Interruption is how executors cancel tasks; catching and ignoring it makes threads unkillable.", "example": "Restoring the flag:", "push": "Future.cancel(true) and executor.shutdownNow() rely on this cooperative mechanism.", "code": "catch (InterruptedException e) {\n    Thread.currentThread().interrupt();\n    return;\n}"}, {"q": "How do you debug a hung Java service in production?", "say": "I take several thread dumps a few seconds apart and look at what threads are stuck on.", "explain": "jcmd <pid> Thread.print or jstack. Look for reported deadlocks, many threads BLOCKED on one lock, or a whole pool WAITING on a resource like a DB connection.", "example": "A typical finding: every Tomcat thread waiting on Hikari for a connection because a slow query holds them all. The fix is query timeouts plus fixing the query.", "push": "I'd also check GC logs, because a long GC pause can look exactly like a hang."}, {"q": "What is instruction reordering?", "say": "Compilers and CPUs can reorder instructions, so without synchronisation another thread may see writes in a different order or not at all.", "explain": "The Java Memory Model defines happens-before rules (locks, volatile, thread start and join) that guarantee visibility and ordering.", "example": "A ready flag set after preparing data can be seen as true before the data is visible, unless the flag is volatile.", "push": "volatile fixes visibility and ordering for that variable, but not compound actions like count++."}, {"q": "Happens-before with start() and join()?", "say": "Everything before t.start() is visible inside t, and everything t did is visible after t.join() returns.", "explain": "These are two of the JMM's happens-before rules, along with unlock→lock and volatile write→read.", "example": "No extra synchronisation needed here:", "push": "Executors give the same guarantee: actions before submit() happen-before the task runs.", "code": "config = load();\nt.start();          // t sees config\nt.join();\nuse(worker.result); // main sees what t wrote"}, {"q": "How do you limit concurrent calls to an external API?", "say": "I cap in-flight calls with a Semaphore and the request rate with a token bucket, plus timeouts and retries with backoff.", "explain": "Concurrency limits protect the downstream; rate limits respect quotas like an LLM provider's requests per minute.", "example": "Resilience4j gives Bulkhead (concurrency), RateLimiter and Retry as decorators around the client call.", "push": "Retries need jitter and a cap, or they turn into a retry storm."}, {"q": "How would you call an LLM API at 1,000 requests a minute from Java?", "say": "Treat the LLM as a slow, rate-limited dependency: bounded concurrency, timeouts, retries on 429, and streaming.", "explain": "Virtual threads or an async client handle the waiting; a Semaphore or token bucket keeps us under the provider's limits; per-tenant metrics track cost.", "example": "Spring AI ChatClient on virtual threads, a Resilience4j RateLimiter and Retry with backoff on 429/5xx, and caching repeated prompts.", "push": "Stream responses so users see tokens early, and set a max-token budget per request."}], "boot": [{"q": "What does @SpringBootApplication do?", "say": "It's a shortcut for @SpringBootConfiguration, @EnableAutoConfiguration and @ComponentScan.", "explain": "Component scan finds my beans from that package downwards; auto-configuration imports the classes listed in AutoConfiguration.imports, each guarded by conditions.", "example": "Adding spring-boot-starter-data-jpa puts JPA on the classpath, so the DataSource and JPA auto-configurations switch on.", "push": "That's why the main class's package matters: beans in packages outside it aren't scanned."}, {"q": "How do you find out why an auto-configuration did or didn't apply?", "say": "I run with --debug to get the conditions evaluation report, or check the actuator conditions endpoint.", "explain": "It lists every auto-configuration as a positive or negative match with the reason, like @ConditionalOnMissingBean finding an existing bean.", "example": "If a custom ObjectMapper isn't being used, the report shows whether JacksonAutoConfiguration backed off and why.", "push": "spring.autoconfigure.exclude, or exclude on @SpringBootApplication, switches specific ones off."}, {"q": "How would you write your own Spring Boot starter?", "say": "An @AutoConfiguration class with conditional beans and @ConfigurationProperties, registered in AutoConfiguration.imports.", "explain": "@ConditionalOnClass activates it only when the library is present; @ConditionalOnMissingBean lets users override my beans.", "example": "A minimal auto-configuration:", "push": "Third-party starters are named acme-spring-boot-starter; the spring-boot-starter-* names are reserved for official ones.", "code": "@AutoConfiguration\n@EnableConfigurationProperties(AuditProps.class)\nclass AuditAutoConfiguration {\n    @Bean @ConditionalOnMissingBean\n    AuditClient auditClient(AuditProps p) { return new AuditClient(p.url()); }\n}"}, {"q": "Which configuration source wins?", "say": "More specific sources win: command-line arguments override environment variables, which override profile files, which override application.yml.", "explain": "Profile-specific files beat the default file, and config outside the jar beats config packaged inside it.", "example": "In Kubernetes I keep defaults in application.yml and override URLs and secrets with environment variables like SPRING_DATASOURCE_URL.", "push": "Relaxed binding maps SPRING_DATASOURCE_URL to spring.datasource.url automatically."}, {"q": "@ConfigurationProperties vs @Value?", "say": "@ConfigurationProperties binds a whole group of settings into a typed, validated object; @Value injects single values.", "explain": "Typed config gives IDE completion, validation with @Validated and one place to see all related settings.", "example": "Settings for an LLM client as a record:", "push": "@Value is fine for a one-off value, but it scatters configuration across classes.", "code": "@ConfigurationProperties(\"llm\")\nrecord LlmProps(String model, Duration timeout, int maxTokens) {}"}, {"q": "What is the bean lifecycle?", "say": "Spring instantiates the bean, injects dependencies, runs aware callbacks and BeanPostProcessors, calls init methods, and later destroy methods.", "explain": "@PostConstruct runs after injection; BeanPostProcessors are where proxies for transactions and AOP get created; @PreDestroy runs on shutdown.", "example": "Warming a cache: an ApplicationReadyEvent listener is better than @PostConstruct, so startup isn't blocked by slow calls.", "push": "Singletons are created eagerly at startup, so a broken bean fails fast; the container doesn't destroy prototypes."}, {"q": "How do you inject a prototype bean into a singleton correctly?", "say": "A prototype injected into a singleton is created only once, so I inject an ObjectProvider and ask for a fresh instance each time.", "explain": "Injection happens once at startup; prototype scope only matters when you request the bean again.", "example": "A fresh builder on every call:", "push": "A @Lookup method or a scoped proxy are the alternatives.", "code": "class ReportService {\n    private final ObjectProvider<ReportBuilder> builders;\n    Report run() { return builders.getObject().build(); }   // new each call\n}"}, {"q": "How does Spring Boot handle circular dependencies?", "say": "Spring Boot fails on circular dependencies by default since 2.6, and I fix the design rather than switch that off.", "explain": "A cycle usually means two classes have mixed responsibilities. Extract the shared logic into a third bean, or decouple with application events.", "example": "OrderService and PaymentService calling each other: move the shared \"order paid\" logic into an event listener.", "push": "@Lazy on one constructor parameter breaks the cycle quickly but hides the design problem."}, {"q": "Why prefer constructor injection?", "say": "Constructor injection makes dependencies explicit, required and final, and keeps classes testable without Spring.", "explain": "You can't create the object in an invalid state, tests pass mocks straight in, and a long constructor is a signal the class does too much.", "example": "No @Autowired needed with a single constructor:", "push": "Field injection hides dependencies and needs reflection; I keep it for tests only.", "code": "@Service\nclass OrderService {\n    private final OrderRepository repo;\n    OrderService(OrderRepository repo) { this.repo = repo; }\n}"}, {"q": "How do Spring AOP proxies work, and what are the consequences?", "say": "Spring adds transactions, caching and security by wrapping beans in proxies, and that has consequences.", "explain": "Boot uses CGLIB subclass proxies by default. Calls from outside go through the proxy; calls on this inside the same bean skip it. Final and private methods can't be advised.", "example": "A @Transactional method called from another method in the same class runs without a transaction.", "push": "The clean fix is moving that method to another bean; injecting yourself through ObjectProvider works but hides the design."}, {"q": "Why does @Transactional sometimes not work?", "say": "Usually it's self-invocation, a private method, or a checked exception that doesn't trigger rollback.", "explain": "Transactions are applied by the proxy; calls inside the same class skip it; private methods can't be proxied; checked exceptions commit by default.", "example": "placeOrder() calling this.saveAudit() marked REQUIRES_NEW silently joins the outer transaction instead of starting a new one.", "push": "logging.level.org.springframework.transaction=DEBUG shows exactly when transactions begin and commit."}, {"q": "REQUIRED vs REQUIRES_NEW propagation?", "say": "REQUIRED joins the existing transaction or starts one; REQUIRES_NEW always starts an independent one.", "explain": "With REQUIRED, an inner failure marks the whole transaction rollback-only. With REQUIRES_NEW, the inner transaction commits or rolls back on its own.", "example": "Audit logging uses REQUIRES_NEW so the audit row survives even if the business operation rolls back.", "push": "REQUIRES_NEW takes a second DB connection while the outer one waits, which can exhaust the pool under load."}, {"q": "@Transactional: readOnly, isolation and rollbackFor?", "say": "readOnly optimises reads, isolation sets the database isolation level, and rollbackFor makes checked exceptions roll back.", "explain": "With readOnly, Hibernate skips dirty checking and flushing. By default only unchecked exceptions and Errors cause a rollback.", "example": "Typical usage:", "push": "readOnly can also route queries to a read replica if you use a routing DataSource.", "code": "@Transactional(readOnly = true)\nList<Order> recent() { ... }\n\n@Transactional(rollbackFor = IOException.class)\nvoid importFile() { ... }"}, {"q": "Why not call a slow external API inside @Transactional?", "say": "Never call slow external APIs inside a DB transaction: it holds a connection and locks for the whole call.", "explain": "Under load the connection pool empties and every request waits. And if the external call succeeds but the transaction rolls back, data is inconsistent.", "example": "Charge the card or call the LLM first, then open a short transaction to save the result, or save the intent and use the outbox pattern.", "push": "@TransactionalEventListener with AFTER_COMMIT is a clean way to trigger side effects only after a successful commit."}, {"q": "What is @TransactionalEventListener for?", "say": "It runs a listener only after the surrounding transaction commits, so side effects don't happen for rolled-back work.", "explain": "The default phase is AFTER_COMMIT; AFTER_ROLLBACK and BEFORE_COMMIT also exist.", "example": "Send the confirmation email only once the order is really saved:", "push": "If the listener writes to the DB itself, it needs REQUIRES_NEW, because the original transaction has already committed.", "code": "@TransactionalEventListener\nvoid onOrderPlaced(OrderPlaced e) {\n    emailService.sendConfirmation(e.orderId());\n}"}, {"q": "Explain the outbox pattern.", "say": "Save the business change and an event record in the same transaction; a separate process publishes the events to Kafka.", "explain": "It avoids the dual-write problem, where the DB commits but the Kafka publish fails, or the other way round.", "example": "The order is saved together with an \"OrderPlaced\" outbox row; a poller or Debezium CDC publishes it and marks it sent.", "push": "Delivery is at-least-once, so consumers must be idempotent, keyed on the event ID."}, {"q": "What is the N+1 problem and how do you fix it?", "say": "N+1 is one query for a list plus one extra query per item for a lazy association.", "explain": "Loading 100 orders and then touching order.getCustomer() fires 100 more queries.", "example": "An entity graph loads everything in one query:", "push": "I catch N+1 in tests by asserting query counts, or by watching SQL logs and Hibernate statistics.", "code": "@EntityGraph(attributePaths = \"customer\")\nList<Order> findByStatus(Status status);"}, {"q": "What causes LazyInitializationException and how do you fix it?", "say": "It happens when you touch a lazy association after the persistence context closed; I fix it by fetching what I need in the query.", "explain": "Use a fetch join, an @EntityGraph or a DTO projection in the repository method for that use case.", "example": "A fetch join for the order detail page:", "push": "Making everything EAGER or keeping open-in-view on hides the problem and causes N+1 queries elsewhere.", "code": "@Query(\"select o from Order o join fetch o.items where o.id = :id\")\nOptional<Order> findWithItems(Long id);"}, {"q": "What is Open Session in View, and should it stay on?", "say": "Open Session in View keeps the Hibernate session open for the whole web request; I usually turn it off.", "explain": "It's on by default (Boot logs a warning), so lazy loading works in controllers and serializers, silently running queries outside the service layer and holding connections longer.", "example": "spring.jpa.open-in-view=false, then fix the LazyInitializationExceptions it reveals with proper fetching.", "push": "Turning it off makes each endpoint's data access explicit and predictable."}, {"q": "Optimistic vs pessimistic locking in JPA?", "say": "Optimistic locking detects conflicts with a version column; pessimistic locking prevents them by locking rows.", "explain": "Optimistic suits low contention: a conflicting update fails with OptimisticLockException and you retry. Pessimistic (SELECT ... FOR UPDATE) suits hot rows but blocks others.", "example": "Both in code:", "push": "For counters like stock, an atomic update (UPDATE ... SET qty = qty - 1 WHERE qty > 0) often beats both.", "code": "@Entity class Account { @Version long version; ... }\n\n@Lock(LockModeType.PESSIMISTIC_WRITE)\nOptional<Account> findById(Long id);"}, {"q": "Hibernate first-level vs second-level cache?", "say": "The first-level cache is the persistence context per transaction; the second-level cache is shared across sessions and opt-in.", "explain": "First-level guarantees one instance per entity per transaction. Second-level (JCache with Caffeine or Ehcache) helps read-mostly reference data.", "example": "Country and currency tables are good second-level candidates; frequently updated orders are not.", "push": "With several app instances, invalidation needs thought; a service-level Redis cache is often simpler."}, {"q": "What goes wrong with pagination on big tables?", "say": "OFFSET pagination slows down on deep pages; keyset pagination stays fast.", "explain": "OFFSET 100000 still scans and throws away 100,000 rows. Keyset uses the last seen ID: WHERE id > :last ORDER BY id LIMIT 50.", "example": "An infinite-scroll orders feed uses keyset; an admin table with page numbers can keep OFFSET.", "push": "Paginating a query with a collection fetch join makes Hibernate paginate in memory and log a warning: page the IDs first, then fetch."}, {"q": "How do you spot and fix Hikari connection pool exhaustion?", "say": "Requests hang, then fail with \"Connection is not available, request timed out\".", "explain": "Causes: long transactions, slow queries, connection leaks, or far more worker threads than connections.", "example": "Check Hikari's active and pending metrics in Actuator, enable leakDetectionThreshold, and add statement timeouts.", "push": "A bigger pool is rarely the fix, since the DB has its own limits; start small (around twice the DB's cores) and measure."}, {"q": "How do you return consistent error responses?", "say": "A @RestControllerAdvice maps exceptions to a consistent error body using ProblemDetail.", "explain": "ProblemDetail is Spring's built-in support for the standard problem+json format with type, title, status and detail.", "example": "Mapping a not-found exception:", "push": "Never leak stack traces to clients: log them with a correlation ID and return that ID instead.", "code": "@ExceptionHandler(OrderNotFound.class)\nProblemDetail notFound(OrderNotFound e) {\n    return ProblemDetail.forStatusAndDetail(HttpStatus.NOT_FOUND, e.getMessage());\n}"}, {"q": "How does validation work in Spring MVC?", "say": "I validate request bodies with Bean Validation: @Valid on the parameter and constraint annotations on the fields.", "explain": "Failures raise MethodArgumentNotValidException, which my controller advice turns into a 400 with the field errors.", "example": "A validated request record:", "push": "Custom rules go in a ConstraintValidator; cross-field rules use a class-level constraint.", "code": "record CreateUser(@NotBlank String name, @Email String email) {}\n\n@PostMapping\nResponseEntity<UserDto> create(@Valid @RequestBody CreateUser req) { ... }"}, {"q": "Filter vs HandlerInterceptor vs AOP?", "say": "Filters run at the servlet level, interceptors around Spring MVC handlers, and AOP around any bean method.", "explain": "Filters suit auth, CORS and request logging; interceptors suit handler-aware checks; AOP suits cross-cutting service logic like transactions, metrics or auditing.", "example": "A correlation-ID filter, a per-endpoint rate-limit interceptor, and an @Audited aspect on service methods.", "push": "Spring Security itself is a chain of servlet filters."}, {"q": "How does the Spring Security filter chain work?", "say": "Every request passes through Spring Security's filter chain, configured as a SecurityFilterChain bean.", "explain": "Filters handle CORS, CSRF, authentication and authorization in order. For JWT APIs, the resource-server filter validates the token and sets the SecurityContext.", "example": "A JWT-secured API:", "push": "WebSecurityConfigurerAdapter was removed; SecurityFilterChain beans replaced it.", "code": "@Bean\nSecurityFilterChain api(HttpSecurity http) throws Exception {\n    return http\n        .authorizeHttpRequests(a -> a.requestMatchers(\"/admin/**\").hasRole(\"ADMIN\")\n                                     .anyRequest().authenticated())\n        .oauth2ResourceServer
