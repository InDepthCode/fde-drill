(o -> o.jwt(Customizer.withDefaults()))\n        .build();\n}"}, {"q": "How does method-level security work?", "say": "With @EnableMethodSecurity I put authorization rules on service methods using @PreAuthorize.", "explain": "Rules are SpEL expressions with access to the current user and the method's arguments.", "example": "Only admins or the user themselves:", "push": "It's proxy-based, so internal calls aren't checked: another reason to keep security at clear entry points.", "code": "@PreAuthorize(\"hasRole('ADMIN') or #userId == authentication.name\")\nUser getProfile(String userId) { ... }"}, {"q": "How do you make a POST endpoint idempotent?", "say": "The client sends an Idempotency-Key header; I store it with the result and return the stored result for repeats.", "explain": "A unique constraint on the key stops concurrent duplicates. GET, PUT and DELETE are idempotent by design; POST needs this.", "example": "Payment APIs: a mobile app retrying after a timeout must not charge the customer twice.", "push": "Keys need a TTL, and the stored response should include the status code."}, {"q": "What are the pitfalls of @Cacheable?", "say": "@Cacheable is easy to add but has pitfalls: self-invocation, key design, stale data and stampedes.", "explain": "It's proxy-based; the key defaults to all parameters; updates need @CachePut or @CacheEvict; when a hot key expires, many requests may hit the DB at once.", "example": "Explicit key and sync loading:", "push": "sync = true lets only one thread load a missing key. Always set TTL and size limits in Caffeine or Redis.", "code": "@Cacheable(cacheNames = \"products\", key = \"#id\", sync = true)\nProduct find(long id) { ... }"}, {"q": "What are the pitfalls of @Async?", "say": "@Async needs @EnableAsync, a properly sized executor, and calls that go through the proxy.", "explain": "Self-invocation runs synchronously; the default executor may not suit you; exceptions from void methods vanish unless you add an AsyncUncaughtExceptionHandler.", "example": "Return a CompletableFuture and name the executor:", "push": "Returning CompletableFuture lets callers handle errors and compose results.", "code": "@Async(\"ioExecutor\")\nCompletableFuture<Report> build(long id) { ... }"}, {"q": "How do you use virtual threads in Spring Boot?", "say": "spring.threads.virtual.enabled=true runs request handling, @Async and scheduled tasks on virtual threads.", "explain": "It's available since Boot 3.2 on Java 21+, and boosts throughput for blocking I/O without changing code.", "example": "An API that mostly waits on downstream HTTP calls and an LLM can serve many more concurrent requests.", "push": "The DB pool becomes the bottleneck, so watch Hikari metrics; on older JDKs avoid slow I/O inside synchronized (pinning)."}, {"q": "Which actuator endpoints matter in production?", "say": "Actuator gives health, metrics, info and runtime log levels; in production I expose only what's needed and secure it.", "explain": "Health groups map to Kubernetes liveness and readiness probes; metrics go to Prometheus through Micrometer.", "example": "management.endpoints.web.exposure.include=health,info,prometheus, on a separate management port.", "push": "The loggers endpoint lets me switch a package to DEBUG during an incident without redeploying."}, {"q": "How does tracing work in Spring Boot 3+?", "say": "Boot 3+ uses the Micrometer Observation API with Micrometer Tracing, exporting to OpenTelemetry or Zipkin.", "explain": "It replaced Spring Cloud Sleuth. Trace and span IDs propagate through HTTP and messaging and appear in the logs.", "example": "One trace follows a request through the gateway, the order service, Kafka and the payment consumer, with timings per hop.", "push": "For LLM features I add custom observations around model calls with token counts as attributes."}, {"q": "How do you shut down gracefully?", "say": "server.shutdown=graceful lets in-flight requests finish; in Kubernetes I also stop traffic before the app stops.", "explain": "spring.lifecycle.timeout-per-shutdown-phase bounds the wait. Readiness should go down first so the load balancer stops sending requests.", "example": "A preStop sleep of a few seconds gives Kubernetes time to remove the pod from the endpoints.", "push": "Kafka consumers and schedulers should also stop cleanly so messages aren't processed twice."}, {"q": "How do you make Spring Boot start faster and use less memory?", "say": "Trim dependencies, use lazy initialisation where safe, enable CDS/AOT caching, or build a GraalVM native image.", "explain": "Native images start in milliseconds with low memory but need build-time reflection hints and longer builds.", "example": "Native images suit serverless functions and CLIs; JVM mode suits long-running services where JIT throughput matters.", "push": "Measure with the startup actuator endpoint before optimising anything."}, {"q": "How do you test a Spring Boot app well?", "say": "Slice tests for one layer, @SpringBootTest for full wiring, and Testcontainers for real infrastructure.", "explain": "@WebMvcTest loads only MVC, @DataJpaTest only JPA; @MockitoBean replaces beans (the older @MockBean is deprecated).", "example": "A real Postgres for an integration test:", "push": "@ServiceConnection wires the container's URL into Spring automatically, so there are no manual properties.", "code": "@SpringBootTest @Testcontainers\nclass OrderIT {\n    @Container @ServiceConnection\n    static PostgreSQLContainer<?> db = new PostgreSQLContainer<>(\"postgres:16\");\n}"}, {"q": "RestTemplate vs RestClient vs WebClient?", "say": "RestClient for synchronous calls, WebClient for reactive ones, and HTTP interface clients for declarative APIs; RestTemplate is in maintenance mode.", "explain": "RestClient has a fluent API like WebClient but blocks, which pairs well with virtual threads.", "example": "One line to call another service:", "push": "In Spring Boot 4, HTTP service clients (@HttpExchange interfaces) also get auto-configuration.", "code": "Order order = restClient.get()\n    .uri(\"/orders/{id}\", id)\n    .retrieve()\n    .body(Order.class);"}, {"q": "How do you make Kafka consumers reliable in Spring?", "say": "Kafka gives at-least-once delivery by default, so consumers must be idempotent, with retries and a dead-letter topic.", "explain": "DefaultErrorHandler retries with backoff, then a DeadLetterPublishingRecoverer sends the poison message to a DLT.", "example": "Store processed event IDs with a unique constraint so a redelivered message is skipped.", "push": "Exactly-once covers consume-transform-produce inside Kafka with transactions, not side effects like DB writes or emails."}, {"q": "How do you make calls to other services resilient?", "say": "Timeouts on every call, retries with backoff only for safe operations, and a circuit breaker so failures don't cascade.", "explain": "A bulkhead isolates resources and a fallback returns cached or default data. Resilience4j provides all of these.", "example": "Annotations around an LLM call:", "push": "Without a timeout nothing else matters: a hung call ties up a thread forever.", "code": "@CircuitBreaker(name = \"llm\", fallbackMethod = \"cachedAnswer\")\n@Retry(name = \"llm\")\nString ask(String question) { ... }"}, {"q": "What's new in Spring Boot 4 that's worth mentioning?", "say": "Spring Boot 4 is built on Spring Framework 7 and moves to Jackson 3.", "explain": "It adds auto-configuration for API versioning in Spring MVC and WebFlux, and for HTTP service clients (@HttpExchange interfaces).", "example": "spring.mvc.apiversion.* properties configure how the API version is read, for example from a request header.", "push": "Saying what you'd check when migrating, like Jackson 3 changes, shows you actually read the upgrade notes."}], "ai": [{"q": "What is a token, and why do customers care?", "say": "Models read and bill in tokens, roughly ¾ of an English word, so tokens drive cost, latency and context limits.", "explain": "Input and output tokens are both billed; long prompts, big retrieved chunks and chat history add up quickly.", "example": "Five retrieved chunks of 800 tokens cost far more per answer than three focused chunks of 300, so chunk size and top-k are cost decisions too.", "push": "I track tokens per request and per tenant as metrics, so cost surprises show up early."}, {"q": "What does temperature do?", "say": "Temperature controls randomness: low for deterministic tasks, higher for creative ones.", "explain": "Near 0 the model picks the most likely tokens. Extraction, classification and tool calls want it low; brainstorming wants it higher.", "example": "Invoice field extraction at 0; marketing tagline ideas around 0.8.", "push": "Low temperature doesn't stop hallucination; grounding and validation do."}, {"q": "Why do LLMs hallucinate, and how do you reduce it?", "say": "LLMs predict plausible text, not verified facts, so I ground them in sources and validate their output.", "explain": "Retrieval with citations, an allowed \"I don't know\", strict schemas for structured output, and evals that measure faithfulness.", "example": "A support bot answers only from retrieved policy documents and declines when similarity is below a threshold.", "push": "For high-stakes outputs, add human review or a second model as a checker."}, {"q": "Prompting vs RAG vs fine-tuning?", "say": "Prompting changes behaviour, RAG adds knowledge, and fine-tuning changes style or narrow skills.", "explain": "For a customer's private or changing data, RAG is the default; fine-tuning helps with a consistent format or tone once prompting plateaus.", "example": "Company policies: RAG. Always producing a report in a strict house format: try few-shot prompting first, fine-tune only if that isn't enough.", "push": "Fine-tuning doesn't reliably teach new facts, and must be redone when the data changes."}, {"q": "What is structured output?", "say": "Asking the model to return JSON that matches a schema, ideally enforced by the provider.", "explain": "Then I map it straight to typed objects and validate it before use.", "example": "With Spring AI, a record becomes the schema:", "push": "Still validate: totals add up and required fields exist, and retry once with the validation error if not.", "code": "record Invoice(String vendor, BigDecimal total, LocalDate date) {}\nInvoice inv = chatClient.prompt().user(text).call().entity(Invoice.class);"}, {"q": "What is an embedding?", "say": "An embedding is a vector that represents meaning, so similar texts end up close together.", "explain": "Vectors are compared with cosine similarity to find relevant chunks, cluster tickets or detect duplicates.", "example": "\"Refund my order\" and \"I want my money back\" land close together even though they share no words.", "push": "Switching embedding models means re-embedding everything, so choose with your eval set."}, {"q": "Walk me through a RAG pipeline.", "say": "Index documents ahead of time, then at question time retrieve the most relevant chunks and have the model answer from them with citations.", "explain": "Ingestion: parse, chunk, embed, store with metadata. Query: rewrite if needed, retrieve top-k, rerank, build the prompt, generate, cite.", "example": "In a Spring AI app: PDFs are chunked into pgvector, a retrieval advisor adds the top chunks to the prompt, and the answer cites page numbers.", "push": "Most quality problems are retrieval problems, so I measure retrieval separately from generation."}, {"q": "How do you choose chunk size?", "say": "It's a trade-off between precision and context, and I let an eval decide.", "explain": "Small chunks match precisely but lose context; large ones keep context but dilute relevance and cost tokens. 300–800 tokens with some overlap is a reasonable start.", "example": "FAQs: one question and answer per chunk. Contracts: chunk by clause with the section title prepended.", "push": "Structure-aware chunking (headings, tables) usually beats fixed-size chunking."}, {"q": "Retrieval returns the wrong chunks. What do you check?", "say": "I check parsing, then chunking, then the embedding model, and add hybrid search and reranking.", "explain": "Bad PDF parsing (tables, scanned pages) is the most common hidden cause; then chunk boundaries; then whether the embedding model understands the domain.", "example": "Part numbers like \"AX-4471\" fail in pure vector search; adding keyword search (hybrid) fixes them.", "push": "Metadata filters (product, date, tenant) cut noise before similarity ranking even starts."}, {"q": "What is hybrid search?", "say": "Hybrid search combines keyword search and vector search and merges the two rankings.", "explain": "Keyword search (BM25) nails exact terms like IDs and names; vectors catch meaning; reciprocal rank fusion combines them.", "example": "Postgres full-text search plus pgvector, merged with RRF.", "push": "A cross-encoder reranker on the top 20 results is often the biggest single quality jump."}, {"q": "How do you keep the index fresh?", "say": "Incremental ingestion on change events, with content hashes to skip unchanged documents.", "explain": "Each chunk stores document ID, version and hash, so updates replace old chunks and deletions remove them.", "example": "A nightly job is fine for policy documents; ticket data needs near-real-time updates through webhooks or CDC.", "push": "Showing the source's last-updated date in answers lets users judge freshness."}, {"q": "How do you secure multi-tenant RAG?", "say": "Permissions are enforced inside the retrieval query, never after generation.", "explain": "Each chunk carries tenant and access metadata, and every vector search filters on it, mirroring the source system's permissions.", "example": "A tenant and group filter on the pgvector query, so other tenants' chunks are never even candidates.", "push": "Never rely on the prompt to hide data: once text is in the context, it can leak."}, {"q": "How does tool calling work?", "say": "The model asks to call a tool; my code executes it and sends the result back until the model gives a final answer.", "explain": "Each tool has a name, description and JSON schema. The model never runs code itself.", "example": "A tool in Spring AI:", "push": "Validate arguments, use least privilege, and require confirmation for anything with side effects.", "code": "@Tool(description = \"Get order status by order id\")\nString orderStatus(String orderId) { return orders.status(orderId); }"}, {"q": "What is MCP?", "say": "MCP is an open protocol for exposing tools, data and prompts to any AI client through a standard server.", "explain": "Build an integration once as an MCP server and every MCP-capable client can use it, instead of custom glue per app.", "example": "Exposing order lookup and ticket creation as an MCP server lets both Claude Desktop and our own agent use them.", "push": "Spring AI includes the MCP Java SDK, so a Spring Boot app can be an MCP server or client."}, {"q": "Workflow or agent?", "say": "Use a workflow when the steps are known, and an agent only when the path genuinely varies.", "explain": "Workflows are cheaper, testable and predictable. Agents choose their own next step, which adds flexibility but also cost and risk.", "example": "Invoice processing is a fixed workflow; an IT helpdesk assistant that may search docs, check status or open tickets is agent-like.", "push": "Even agents need step limits, timeouts and approval gates for risky actions."}, {"q": "How do agents fail in production?", "say": "Agents fail by looping, calling tools with bad arguments, following injected instructions, and running up cost.", "explain": "Errors compound over many steps, so small per-step failure rates become big end-to-end ones.", "example": "Mitigations: a max number of iterations, argument validation, idempotent tools, human approval for refunds, and tracing every step.", "push": "Evaluate agents on whole-task success, not just individual steps."}, {"q": "How does agent memory work?", "say": "Short-term memory is the conversation in the context window; long-term memory is stored facts retrieved when relevant.", "explain": "Old turns get summarised or trimmed to control tokens; long-term memory is just another retrieval problem.", "example": "Remembering a customer's preferred language as a stored fact rather than carrying the whole chat history.", "push": "Be explicit about what's stored and let users delete it: memory is personal data."}, {"q": "How do you know your AI feature works?", "say": "With evals: a golden set of real questions and measured retrieval quality, answer quality, latency and cost.", "explain": "Retrieval: hit rate or MRR. Answers: faithfulness and correctness scored by a rubric-based LLM judge plus human spot checks. Run them on every prompt or model change like unit tests.", "example": "The number to quote is a before/after on your own eval, for example \"hit rate went from X% to Y% after adding hybrid search\".", "push": "Add every production failure to the golden set so it can't regress."}, {"q": "What are the limits of LLM-as-judge?", "say": "LLM judges are biased towards longer answers, their own style and answer position, so I calibrate them.", "explain": "Use a clear rubric, score one criterion at a time, and compare against human labels on a sample.", "example": "If agreement with human labels is low on a criterion, I fix the rubric before trusting the scores.", "push": "Where possible, judge with a different model from the one being evaluated."}, {"q": "A customer says answers got worse this week. What do you do?", "say": "Get concrete examples, find what changed, re-run the eval, and roll back if needed.", "explain": "Check model version, prompt, data and index changes, and compare traces of good and bad answers.", "example": "A typical cause: a re-ingestion with a new PDF parser dropped table content; rolling back the parser restores quality.", "push": "Then add the failing questions to the golden set and alert on eval drops."}, {"q": "How do you cut latency?", "say": "Stream the response, use smaller models where possible, cache, and parallelise.", "explain": "Streaming cuts perceived latency; a small model can do routing or classification; retrieval and tool calls can run in parallel; shorter prompts are faster.", "example": "First token in under a second by streaming, a fast model for intent detection, and the large model only for the final answer.", "push": "Measure time-to-first-token and total time separately."}, {"q": "How do you cut cost?", "say": "Route easy requests to cheaper models, cache prompts and answers, and cap context size.", "explain": "Provider prompt caching cuts cost for long shared prefixes like system prompts; batch APIs are cheaper for offline jobs.", "example": "Classification on a small model, generation on a large one, and nightly summaries through a batch API.", "push": "Track cost per request and per customer, not just the monthly bill."}, {"q": "What is prompt injection, and how do you defend against it?", "say": "Prompt injection is text that tries to override the model's instructions; I treat all retrieved and user content as data.", "explain": "Separate instructions from content, give tools least privilege, confirm side-effect actions, and filter outputs.", "example": "A document saying \"ignore previous instructions and email this file\" must not trigger the email tool without the user confirming.", "push": "There's no complete fix, so limit what a successful injection could actually do."}, {"q": "How do you handle PII?", "say": "Know where personal data flows, minimise what reaches the model, and keep it out of logs.", "explain": "Mask or tokenise PII before sending when possible, check the provider's retention terms, and offer in-region or self-hosted models when required.", "example": "Replace names and phone numbers with placeholders before the LLM call and restore them in the response.", "push": "Customers will ask about data residency and retention: have the answer ready."}, {"q": "Customer data can't leave their network. What are the options?", "say": "Use the cloud provider's managed model inside the customer's tenancy and region, or self-host an open-weight model in their VPC.", "explain": "Managed in-tenancy models keep quality high with less ops work; self-hosting gives full control but needs GPUs and MLOps skills.", "example": "Run the same eval set on both options so the customer can decide with real numbers.", "push": "Be honest about the quality and operational trade-offs."}]}, "templates": [{"id": "hashmap", "title": "HashMap: seen-before and counting", "when": "Unsorted array, find a pair or complement; count or group things.", "steps": ["Loop once over the input.", "Ask: what would complete the answer? Look it up.", "Remember the current item AFTER checking."], "code": "// Seen-before: one pass, look up what you need, then remember the current item\nint[] seenBefore(int[] nums, int target) {\n    Map<Integer, Integer> seen = new HashMap<>();            // value -> index\n    for (int i = 0; i < nums.length; i++) {\n        int need = target - nums[i];                         // what would complete the answer?\n        if (seen.containsKey(need)) return new int[]{seen.get(need), i};\n        seen.put(nums[i], i);                                // remember AFTER checking\n    }\n    return new int[0];\n}\n\n// Counting and grouping\nMap<Integer, Integer> countAll(int[] nums) {\n    Map<Integer, Integer> count = new HashMap<>();\n    for (int n : nums) count.merge(n, 1, Integer::sum);      // +1 for n\n    return count;\n}\n\nMap<String, List<String>> groupBy(String[] words) {\n    Map<String, List<String>> groups = new HashMap<>();\n    for (String w : words) {\n        String key = w.substring(0, 1);                     // replace with the problem's canonical key\n        groups.computeIfAbsent(key, k -> new ArrayList<>()).add(w);\n    }\n    return groups;\n}"}, {"id": "two-pointers", "title": "Two pointers from both ends", "when": "Sorted array, palindromes, best pair where width shrinks.", "steps": ["l at the start, r at the end.", "Use a[l] and a[r] to update the answer.", "Move the pointer that can make things better."], "code": "int twoPointers(int[] a) {\n    int l = 0, r = a.length - 1, best = 0;\n    while (l < r) {\n        best = Math.max(best, a[l] + a[r]);   // 1. use a[l] and a[r] to update the answer\n        if (a[l] < a[r]) l++;                 // 2. move the side that can improve it\n        else r--;\n    }\n    return best;\n}"}, {"id": "sliding-window", "title": "Sliding window (variable size)", "when": "Longest or shortest contiguous substring/subarray that follows a rule.", "steps": ["Grow the window: add a[right].", "While the window breaks the rule, remove a[left] and move left.", "The window is valid now: update the answer."], "code": "int longestWindow(String s) {\n    Map<Character, Integer> window = new HashMap<>();         // what's inside the window\n    int left = 0, best = 0;\n    for (int right = 0; right < s.length(); right++) {\n        char c = s.charAt(right);\n        window.merge(c, 1, Integer::sum);                     // 1. add the right element\n        while (window.get(c) > 1) {                           // 2. while the rule is broken...\n            char out = s.charAt(left++);                      //    ...remove the left element\n            window.merge(out, -1, Integer::sum);\n        }\n        best = Math.max(best, right - left + 1);              // 3. valid window: update answer\n    }\n    return best;\n}"}, {"id": "mono-stack", "title": "Stack and monotonic stack", "when": "Matching brackets; next greater / next warmer / next smaller element.", "steps": ["Stack holds indexes still waiting for an answer.", "While the current value beats the top, pop and record the answer.", "Push the current index."], "code": "int[] nextGreater(int[] a) {\n    int[] res = new int[a.length];\n    Arrays.fill(res, -1);\n    Deque<Integer> stack = new ArrayDeque<>();                // indexes still waiting\n    for (int i = 0; i < a.length; i++) {\n        while (!stack.isEmpty() && a[i] > a[stack.peek()]) {\n            res[stack.pop()] = a[i];                          // a[i] answers the smaller ones on top\n        }\n        stack.push(i);\n    }\n    return res;\n}"}, {"id": "binary-search", "title": "Binary search: on the index and on the answer", "when": "Sorted input and O(log n); \"smallest value that works\".", "steps": ["lo and hi bound the answer.", "mid = lo + (hi - lo) / 2.", "Keep the half that can still hold the answer."], "code": "// Classic: find target in a sorted array\nint search(int[] nums, int target) {\n    int lo = 0, hi = nums.length - 1;\n    while (lo <= hi) {\n        int mid = lo + (hi - lo) / 2;\n        if (nums[mid] == target) return mid;\n        if (nums[mid] < target) lo = mid + 1;\n        else hi = mid - 1;\n    }\n    return -1;\n}\n\n// On the answer: smallest x in [lo, hi] where ok(x) is true\nint firstTrue(int lo, int hi) {\n    while (lo < hi) {\n        int mid = lo + (hi - lo) / 2;\n        if (ok(mid)) hi = mid;         // mid works: answer is mid or further left\n        else lo = mid + 1;             // mid fails: answer is to the right\n    }\n    return lo;\n}\n\nboolean ok(int x) { return (long) x * x >= 50; }   // replace with the problem's yes/no check"}, {"id": "linked-list", "title": "Linked list: dummy head and reversal", "when": "Rewire, merge, build or reverse a linked list.", "steps": ["Dummy head so the first node isn't a special case.", "tail points at the last node of the result.", "Reverse: save next, point back, step forward."], "code": "ListNode reverse(ListNode head) {\n    ListNode prev = null, curr = head;\n    while (curr != null) {\n        ListNode next = curr.next;     // 1. save\n        curr.next = prev;              // 2. point back\n        prev = curr;                   // 3. step forward\n        curr = next;\n    }\n    return prev;\n}\n\nListNode keepEven(ListNode head) {\n    ListNode dummy = new ListNode(0), tail = dummy;           // dummy head\n    for (ListNode n = head; n != null; n = n.next) {\n        if (n.val % 2 == 0) {                                 // replace with the problem's rule\n            tail.next = new ListNode(n.val);\n            tail = tail.next;\n        }\n    }\n    return dummy.next;\n}"}, {"id": "heap-topk", "title": "Heap: top k and k-way merge", "when": "Top k, kth largest, repeatedly take the smallest of several sources.", "steps": ["Min-heap of size k keeps the k largest.", "Offer, and poll when the size goes over k.", "For k sources: one item per source in the heap."], "code": "int[] topK(int[] nums, int k) {\n    PriorityQueue<Integer> heap = new PriorityQueue<>();     // min-heap keeps the k largest\n    for (int n : nums) {\n        heap.offer(n);\n        if (heap.size() > k) heap.poll();                    // drop the smallest\n    }\n    int[] res = new int[heap.size()];\n    for (int i = res.length - 1; i >= 0; i--) res[i] = heap.poll();   // largest first\n    return res;\n}\n\n// Max-heap:            new PriorityQueue<>(Comparator.reverseOrder())\n// int[] by 2nd value:  new PriorityQueue<int[]>((a, b) -> Integer.compare(a[1], b[1]))"}, {"id": "tree-dfs", "title": "Tree recursion (DFS)", "when": "Same work at every node: depth, invert, validate, path sums.", "steps": ["Base case: null.", "Trust the recursion for each child.", "Combine the children's answers at this node."], "code": "int height(TreeNode node) {\n    if (node == null) return 0;                  // 1. base case\n    int left = height(node.left);                // 2. trust recursion for each child\n    int right = height(node.right);\n    return 1 + Math.max(left, right);            // 3. combine at this node\n}\n\n// Passing info DOWN (bounds, path so far) uses extra parameters:\nboolean inRange(TreeNode node, long low, long high) {\n    if (node == null) return true;\n    if (node.val <= low || node.val >= high) return false;\n    return inRange(node.left, low, node.val) && inRange(node.right, node.val, high);\n}"}, {"id": "tree-bfs", "title": "Tree level by level (BFS)", "when": "Level order, right side view, min depth, anything \"per level\".", "steps": ["Queue starts with the root.", "size = queue.size() BEFORE the inner loop.", "Poll size nodes, offer their children."], "code": "List<List<Integer>> levels(TreeNode root) {\n    List<List<Integer>> res = new ArrayList<>();\n    if (root == null) return res;\n    Deque<TreeNode> queue = new ArrayDeque<>();\n    queue.offer(root);\n    while (!queue.isEmpty()) {\n        int size = queue.size();                 // nodes on this level\n        List<Integer> level = new ArrayList<>();\n        for (int i = 0; i < size; i++) {\n            TreeNode node = queue.poll();\n            level.add(node.val);                 // per-node work goes here\n            if (node.left != null) queue.offer(node.left);\n            if (node.right != null) queue.offer(node.right);\n        }\n        res.add(level);                          // per-level work goes here\n    }\n    return res;\n}"}, {"id": "grid", "title": "Grid BFS / flood fill", "when": "Islands, regions, shortest steps in a grid, things spreading per tick.", "steps": ["Four directions array.", "Skip cells off the grid, blocked or already seen.", "Mark seen when you ADD to the queue, not when you poll."], "code": "int[][] DIRS = {{1, 0}, {-1, 0}, {0, 1}, {0, -1}};\n\nint reachable(int[][] grid, int sr, int sc) {            // cells reachable from (sr, sc)\n    int rows = grid.length, cols = grid[0].length;\n    boolean[][] seen = new boolean[rows][cols];\n    Deque<int[]> queue = new ArrayDeque<>();\n    queue.offer(new int[]{sr, sc});\n    seen[sr][sc] = true;\n    int count = 0;\n    while (!queue.isEmpty()) {\n        int[] cell = queue.poll();\n        count++;\n        for (int[] d : DIRS) {\n            int r = cell[0] + d[0], c = cell[1] + d[1];\n            if (r < 0 || c < 0 || r >= rows || c >= cols) continue;   // off the grid\n            if (seen[r][c] || grid[r][c] == 0) continue;              // seen or blocked\n            seen[r][c] = true;                                        // mark when ADDING\n            queue.offer(new int[]{r, c});\n        }\n    }\n    return count;\n}"}, {"id": "topo", "title": "Topological sort (Kahn)", "when": "Prerequisites, build order, \"can all tasks finish?\", cycle detection.", "steps": ["Build the graph and count in-degrees.", "Queue every node with in-degree 0.", "Pop, record, decrement neighbours; queue the new zeros."], "code": "List<Integer> topoOrder(int n, int[][] edges) {          // edge {a, b}: a must come before b\n    List<List<Integer>> graph = new ArrayList<>();\n    for (int i = 0; i < n; i++) graph.add(new ArrayList<>());\n    int[] indegree = new int[n];\n    for (int[] e : edges) {\n        graph.get(e[0]).add(e[1]);\n        indegree[e[1]]++;\n    }\n    Deque<Integer> queue = new ArrayDeque<>();\n    for (int i = 0; i < n; i++) if (indegree[i] == 0) queue.offer(i);\n    List<Integer> order = new ArrayList<>();\n    while (!queue.isEmpty()) {\n        int u = queue.poll();\n        order.add(u);\n        for (int v : graph.get(u)) if (--indegree[v] == 0) queue.offer(v);\n    }\n    return order.size() == n ? order : List.of();          // empty list = there is a cycle\n}"}, {"id": "intervals", "title": "Intervals: sort, then sweep", "when": "Merge, insert, overlap count, meeting rooms.", "steps": ["Sort by start.", "Compare each interval with the last one kept.", "Overlap: extend the end. No overlap: keep it."], "code": "int[][] mergeAll(int[][] intervals) {\n    Arrays.sort(intervals, (a, b) -> Integer.compare(a[0], b[0]));   // 1. sort by start\n    List<int[]> res = new ArrayList<>();\n    for (int[] cur : intervals) {\n        if (res.isEmpty() || res.get(res.size() - 1)[1] < cur[0]) {\n            res.add(cur);                                            // 2. no overlap: keep\n        } else {\n            int[] last = res.get(res.size() - 1);\n            last[1] = Math.max(last[1], cur[1]);                     // 3. overlap: extend\n        }\n    }\n    return res.toArray(new int[0][]);\n}"}, {"id": "dp", "title": "1-D dynamic programming", "when": "Count the ways, min cost, max total, where each step depends on earlier ones.", "steps": ["Say what dp[i] means in one sentence.", "Write the base case.", "Build dp[i] from smaller answers; return the last one."], "code": "int countWays(int n) {                          // ways to climb n steps, 1 or 2 at a time\n    int[] dp = new int[n + 1];                   // 1. dp[i] = number of ways to reach step i\n    dp[0] = 1;                                   // 2. base case: one way to stand at the start\n    for (int i = 1; i <= n; i++) {\n        dp[i] = dp[i - 1];                       // 3. arrive from step i-1 ...\n        if (i >= 2) dp[i] += dp[i - 2];          //    ... or from step i-2\n    }\n    return dp[n];                                // 4. the answer\n}\n// Min/max problems: same shape, with dp[i] = Math.min(...) or Math.max(...) of the options.\n// When dp[i] only needs dp[i-1] and dp[i-2], keep two variables instead of the array."}, {"id": "group-count", "title": "Streams: group, sum, rank", "when": "Practical rounds: summarise records per key, top k by value.", "steps": ["Model the input as a record.", "groupingBy(key, downstream collector).", "Sort entries by value descending, limit k."], "code": "record Row(String key, long amount) {}\n\nMap<String, Long> sumByKey(List<Row> rows) {\n    return rows.stream()\n            .collect(Collectors.groupingBy(Row::key, Collectors.summingLong(Row::amount)));\n}\n\nList<String> topKeys(Map<String, Long> totals, int k) {\n    return totals.entrySet().stream()\n            .sorted(Map.Entry.<String, Long>comparingByValue().reversed())\n            .limit(k)\n            .map(Map.Entry::getKey)\n            .toList();\n}\n// Count instead of sum: Collectors.counting()   |   Collect a list: Collectors.toList()"}], "dayTemplate": {"1": "hashmap", "2": "two-pointers", "3": "sliding-window", "4": "mono-stack", "5": "binary-search", "6": "linked-list", "7": "tree-dfs", "8": "tree-bfs", "9": "grid", "10": "intervals", "11": "dp", "12": "group-count", "13": "topo", "14": "heap-topk"}, "toolbox": [{"id": "map-put", "group": "HashMap", "use": "map.put(key, value)", "does": "Adds a key with its value. If the key is already there, the value is overwritten.", "intents": ["add to map", "store value", "save key value", "update value", "create a map", "new hashmap"], "example": "Map<String, Integer> ages = new HashMap<>();\nages.put(\"asha\", 25);\nages.put(\"asha\", 26);                  // same key again: overwrites\nSystem.out.println(ages.get(\"asha\"));  // → 26", "cost": "O(1)", "pitfall": ""}, {"id": "map-get", "group": "HashMap", "use": "map.get(key)", "does": "Returns the value for a key, or null if the key isn't there.", "intents": ["read value", "look up", "get value from map", "find by key"], "example": "Map<String, Integer> ages = new HashMap<>();\nages.put(\"asha\", 25);\nSystem.out.println(ages.get(\"asha\"));  // → 25\nSystem.out.println(ages.get(\"ravi\"));  // → null", "cost": "O(1)", "pitfall": "int x = map.get(missingKey) crashes with NullPointerException. Use getOrDefault or check containsKey first."}, {"id": "map-getordefault", "group": "HashMap", "use": "map.getOrDefault(key, fallback)", "does": "Returns the value, or your fallback when the key is missing. No null checks needed.", "intents": ["default value", "value or zero", "missing key", "safe get"], "example": "Map<Character, Integer> count = new HashMap<>();\ncount.put('a', 2);\nSystem.out.println(count.getOrDefault('a', 0));  // → 2\nSystem.out.println(count.getOrDefault('z', 0));  // ntents": ["get element at index", "read from list", "replace element", "update list"], "example": "List<String> names = new ArrayList<>(List.of(\"asha\", \"ravi\"));\nSystem.out.println(names.get(1));  // → ravi\nnames.set(1, \"meera\");\nSystem.out.println(names);         // → [asha, meera]", "cost": "O(1)", "pitfall": ""}, {"id": "list-last", "group": "ArrayList", "use": "list.get(list.size() - 1)", "does": "The last element of a list.", "intents": ["last element", "end of list", "most recent item", "top of list"], "example": "List<int[]> res = new ArrayList<>();\nres.add(new int[]{1, 3});\nres.add(new int[]{5, 8});\nint[] last = res.get(res.size() - 1);\nSystem.out.println(last[1]);  // → 8", "cost": "O(1)", "pitfall": ""}, {"id": "list-remove", "group": "ArrayList", "use": "list.remove(index)  /  list.remove(Integer.valueOf(x))", "does": "Removes by position, or by value. With a List<Integer> this is a classic trap.", "intents": ["remove from list", "delete element", "remove by value", "remove by index"], "example": "List<Integer> list = new ArrayList<>(List.of(10, 20, 30));\nlist.remove(0);                     // by INDEX\nSystem.out.println(list);           // → [20, 30]\nlist.remove(Integer.valueOf(30));   // by VALUE\nSystem.out.println(list);           // → [20]", "cost": "O(n)", "pitfall": "list.remove(30) on a List<Integer> means index 30, not the value 30."}, {"id": "list-contains-indexof", "group": "ArrayList", "use": "list.contains(x)  /  list.indexOf(x)", "does": "Is x in the list? At which index? (-1 if missing.)", "intents": ["find in list", "position of element", "search list", "index of"], "example": "List<String> list = List.of(\"a\", \"b\", \"c\");\nSystem.out.println(list.contains(\"b\"));  // → true\nSystem.out.println(list.indexOf(\"c\"));   // → 2\nSystem.out.println(list.indexOf(\"z\"));   // → -1", "cost": "O(n): slow inside loops, use a HashSet/HashMap instead", "pitfall": ""}, {"id": "list-sort", "group": "ArrayList", "use": "Collections.sort(list)  /  list.sort(Collections.reverseOrder())", "does": "Sorts a list ascending, or descending.", "intents": ["sort list", "sort descending", "reverse order", "sort ascending"], "example": "List<Integer> list = new ArrayList<>(List.of(3, 1, 2));\nCollections.sort(list);\nSystem.out.println(list);   // → [1, 2, 3]\nlist.sort(Collections.reverseOrder());\nSystem.out.println(list);   // → [3, 2, 1]", "cost": "O(n log n)", "pitfall": ""}, {"id": "list-reverse", "group": "ArrayList", "use": "Collections.reverse(list)", "does": "Reverses a list in place.", "intents": ["reverse list", "flip order", "backwards"], "example": "List<Integer> list = new ArrayList<>(List.of(1, 2, 3));\nCollections.reverse(list);\nSystem.out.println(list);  // → [3, 2, 1]", "cost": "O(n)", "pitfall": ""}, {"id": "list-of", "group": "ArrayList", "use": "List.of(a, b, c)  /  new ArrayList<>(List.of(...))", "does": "Quick fixed list. Wrap it in new ArrayList<> when you need to add or remove.", "intents": ["create list with values", "fixed list", "immutable list", "list literal"], "example": "List<Integer> fixed = List.of(1, 2, 3);           // can't add or remove\nList<Integer> growable = new ArrayList<>(fixed);\ngrowable.add(4);\nSystem.out.println(growable);  // → [1, 2, 3, 4]", "cost": "", "pitfall": "Calling add() on a List.of list throws UnsupportedOperationException."}, {"id": "list-of-lists", "group": "ArrayList", "use": "List<List<Integer>>", "does": "A list whose items are lists, the usual return type for \"all groups\" or \"all levels\".", "intents": ["list of lists", "2d list", "nested list", "result of groups", "levels"], "example": "List<List<Integer>> res = new ArrayList<>();\nres.add(new ArrayList<>(List.of(1, 2)));\nres.add(List.of(3));\nSystem.out.println(res);  // → [[1, 2], [3]]", "cost": "", "pitfall": ""}, {"id": "list-to-intarray", "group": "ArrayList", "use": "list.stream().mapToInt(Integer::intValue).toArray()", "does": "Converts List<Integer> to int[].", "intents": ["list to array", "convert list to int array", "return int array"], "example": "List<Integer> list = List.of(4, 5, 6);\nint[] arr = list.stream().mapToInt(Integer::intValue).toArray();\nSystem.out.println(arr.length + \" \" + arr[0]);  // → 3 4", "cost": "O(n)", "pitfall": ""}, {"id": "list-to-2d", "group": "ArrayList", "use": "res.toArray(new int[0][])", "does": "Converts List<int[]> to int[][] (intervals, pairs).", "intents": ["list to 2d array", "return int[][]", "intervals result"], "example": "List<int[]> res = new ArrayList<>();\nres.add(new int[]{1, 5});\nres.add(new int[]{6, 9});\nint[][] out = res.toArray(new int[0][]);\nSystem.out.println(Arrays.deepToString(out));  // → [[1, 5], [6, 9]]", "cost": "O(n)", "pitfall": ""}, {"id": "arr-sort", "group": "Arrays", "use": "Arrays.sort(arr)", "does": "Sorts an array ascending, in place.", "intents": ["sort array", "sort numbers", "ascending"], "example": "int[] nums = {5, 2, 9, 1};\nArrays.sort(nums);\nSystem.out.println(Arrays.toString(nums));  // → [1, 2, 5, 9]", "cost": "O(n log n)", "pitfall": ""}, {"id": "arr-sort-desc", "group": "Arrays", "use": "Arrays.sort(boxed, Collections.reverseOrder())", "does": "Descending sort. Only works on Integer[], not int[].", "intents": ["sort descending", "reverse sort array", "largest first"], "example": "Integer[] nums = {5, 2, 9};\nArrays.sort(nums, Collections.reverseOrder());\nSystem.out.println(Arrays.toString(nums));  // → [9, 5, 2]", "cost": "O(n log n)", "pitfall": "For int[]: sort ascending and read it from the end."}, {"id": "arr-sort-2d", "group": "Arrays", "use": "Arrays.sort(arr, (a, b) -> Integer.compare(a[0], b[0]))", "does": "Sorts rows of a 2-D array by a column, e.g. intervals by start.", "intents": ["sort intervals", "sort 2d array", "sort by first element", "sort pairs", "custom sort"], "example": "int[][] iv = {{8, 10}, {1, 3}, {2, 6}};\nArrays.sort(iv, (a, b) -> Integer.compare(a[0], b[0]));\nSystem.out.println(Arrays.deepToString(iv));  // → [[1, 3], [2, 6], [8, 10]]", "cost": "O(n log n)", "pitfall": ""}, {"id": "arr-sort-strings", "group": "Arrays", "use": "Arrays.sort(words, (a, b) -> a.length() - b.length())", "does": "Sorts objects with your own rule.", "intents": ["sort by length", "custom comparator", "sort strings"], "example": "String[] words = {\"java\", \"go\", \"rust\"};\nArrays.sort(words, (a, b) -> a.length() - b.length());\nSystem.out.println(Arrays.toString(words));  // → [go, java, rust]", "cost": "O(n log n)", "pitfall": ""}, {"id": "arr-fill", "group": "Arrays", "use": "Arrays.fill(arr, value)", "does": "Sets every element to the same value (dp tables, distances).", "intents": ["fill array", "initialize array", "set all values", "infinity"], "example": "int[] dp = new int[4];\nArrays.fill(dp, -1);\nSystem.out.println(Arrays.toString(dp));  // → [-1, -1, -1, -1]", "cost": "O(n)", "pitfall": ""}, {"id": "arr-tostring", "group": "Arrays", "use": "Arrays.toString(arr)  /  Arrays.deepToString(grid)", "does": "Prints an array's contents. println(arr) alone prints a useless code like [I@1b6d.", "intents": ["print array", "debug array", "show array"], "example": "int[] a = {1, 2, 3};\nint[][] g = {{1, 2}, {3, 4}};\nSystem.out.println(Arrays.toString(a));      // → [1, 2, 3]\nSystem.out.println(Arrays.deepToString(g));  // → [[1, 2], [3, 4]]", "cost": "O(n)", "pitfall": ""}, {"id": "arr-equals", "group": "Arrays", "use": "Arrays.equals(a, b)", "does": "Compares two arrays' contents. == only checks if they're the same object.", "intents": ["compare arrays", "arrays equal", "same contents"], "example": "int[] a = {1, 2}, b = {1, 2};\nSystem.out.println(a == b);               // → false\nSystem.out.println(Arrays.equals(a, b));  // → true", "cost": "O(n)", "pitfall": ""}, {"id": "arr-copyofrange", "group": "Arrays", "use": "Arrays.copyOfRange(arr, from, to)", "does": "Copies part of an array, from index from up to (not including) to.", "intents": ["copy part of array", "subarray", "slice array", "copy array"], "example": "int[] a = {10, 20, 30, 40};\nint[] part = Arrays.copyOfRange(a, 1, 3);\nSystem.out.println(Arrays.toString(part));  // → [20, 30]", "cost": "O(k)", "pitfall": ""}, {"id": "arr-2d", "group": "Arrays", "use": "int[][] grid = new int[rows][cols]", "does": "Creates a 2-D array filled with 0 (or false for boolean). grid.length is rows, grid[0].length is columns.", "intents": ["2d array", "grid", "matrix", "rows and columns", "visited array"], "example": "int[][] grid = new int[2][3];\ngrid[1][2] = 7;\nSystem.out.println(grid.length + \" \" + grid[0].length);  // → 2 3\nSystem.out.println(Arrays.deepToString(grid));           // → [[0, 0, 0], [0, 0, 7]]\nboolean[][] seen = new boolean[2][2];\nSystem.out.println(seen[0][1]);                          // → false", "cost": "", "pitfall": ""}, {"id": "size-length", "group": "Size and length", "use": "arr.length  vs  s.length()  vs  list.size()", "does": "The three ways Java gives a size. Arrays: field, no brackets. Strings: method. Collections: size().", "intents": ["length of array", "size of list", "length of string", "how many elements", "count elements", "size"], "example": "int[] arr = {1, 2, 3};\nString s = \"hello\";\nList<Integer> list = List.of(1, 2);\nMap<String, Integer> map = Map.of(\"a\", 1);\nSystem.out.println(arr.length);   // → 3\nSystem.out.println(s.length());   // → 5\nSystem.out.println(list.size());  // → 2\nSystem.out.println(map.size());   // → 1", "cost": "O(1)", "pitfall": ""}, {"id": "str-charat", "group": "String", "use": "s.charAt(i)", "does": "The character at index i (starting from 0).", "intents": ["character at index", "get char", "first character", "last character", "read character"], "example": "String s = \"java\";\nSystem.out.println(s.charAt(0));               // → j\nSystem.out.println(s.charAt(s.length() - 1));  // → a", "cost": "O(1)", "pitfall": ""}, {"id": "str-substring", "group": "String", "use": "s.substring(start, end)", "does": "Part of a string from start up to (not including) end. One argument means \"to the end\".", "intents": ["part of string", "substring", "slice string", "cut string", "prefix"], "example": "String s = \"interview\";\nSystem.out.println(s.substring(0, 5));  // → inter\nSystem.out.println(s.substring(5));     // → view", "cost": "O(k)", "pitfall": ""}, {"id": "str-sortchars", "group": "String", "use": "char[] c = s.toCharArray(); Arrays.sort(c); new String(c)", "does": "Sorts a string's letters: the key for anagram problems.", "intents": ["sort characters", "anagram key", "sort a string", "char array to string"], "example": "char[] c = \"tea\".toCharArray();\nArrays.sort(c);\nString key = new String(c);\nSystem.out.println(key);  // → aet", "cost": "O(k log k)", "pitfall": "c.toString() does NOT give the letters back; use new String(c)."}, {"id": "str-loop", "group": "String", "use": "for (char ch : s.toCharArray())", "does": "Loops over every character of a string.", "intents": ["loop over string", "each character", "iterate string", "for each char"], "example": "int vowels = 0;\nfor (char ch : \"education\".toCharArray()) {\n    if (\"aeiou\".indexOf(ch) >= 0) vowels++;\n}\nSystem.out.println(vowels);  // → 5", "cost": "O(n)", "pitfall": ""}, {"id": "str-equals", "group": "String", "use": "a.equals(b)", "does": "Compares the text of two strings. == compares objects and can be false for equal text.", "intents": ["compare strings", "string equality", "same text"], "example": "String a = \"hi\", b = new String(\"hi\");\nSystem.out.println(a.equals(b));  // → true\nSystem.out.println(a == b);       // → false", "cost": "O(n)", "pitfall": ""}, {"id": "str-indexof", "group": "String", "use": "s.indexOf(x)  /  s.contains(x)", "does": "Where does x first appear (-1 if never)? Does it appear at all?", "intents": ["find in string", "search string", "contains text", "position of substring"], "example": "String s = \"spring boot\";\nSystem.out.println(s.indexOf(\"boot\"));   // → 7\nSystem.out.println(s.contains(\"ring\"));  // → true\nSystem.out.println(s.indexOf('z'));      // → -1", "cost": "O(n)", "pitfall": ""}, {"id": "str-split", "group": "String", "use": "s.split(\" \")", "does": "Splits a string into parts. Use split(\"\\\\s+\") for any amount of whitespace.", "intents": ["split string", "parse line", "words in sentence", "tokens", "csv columns"], "example": "String line = \"GET /api/orders 500\";\nString[] parts = line.split(\" \");\nSystem.out.println(parts.length);  // → 3\nSystem.out.println(parts[1]);      // → /api/orders", "cost": "O(n)", "pitfall": ""}, {"id": "str-trim-case", "group": "String", "use": "s.trim().toLowerCase()", "does": "Removes spaces at both ends and lower-cases: the usual cleanup before comparing.", "intents": ["lowercase string", "trim spaces", "normalize text", "ignore case", "uppercase"], "example": "String s = \"  Asha@X.com \";\nSystem.out.println(s.trim().toLowerCase());  // → asha@x.com\nSystem.out.println(\"go\".toUpperCase());      // → GO", "cost": "O(n)", "pitfall": ""}, {"id": "str-numbers", "group": "String", "use": "Integer.parseInt(s)  /  String.valueOf(n)", "does": "Text to number and number to text.", "intents": ["string to int", "parse number", "int to string", "convert number"], "example": "int n = Integer.parseInt(\"42\");\nSystem.out.println(String.valueOf(n + 1));       // → 43\nSystem.out.println(\"7\" + 3);                     // → 73\nSystem.out.println(Integer.parseInt(\"7\") + 3);   // → 10", "cost": "O(k)", "pitfall": "parseInt throws NumberFormatException on text like \"abc\"; wrap it in try/catch when input is messy."}, {"id": "str-join", "group": "String", "use": "String.join(\",\", list)", "does": "Glues strings together with a separator.", "intents": ["join strings", "combine strings", "comma separated"], "example": "List<String> parts = List.of(\"a\", \"b\", \"c\");\nSystem.out.println(String.join(\"-\", parts));  // → a-b-c", "cost": "O(n)", "pitfall": ""}, {"id": "sb-append", "group": "StringBuilder", "use": "sb.append(x)  then  sb.toString()", "does": "Builds a string piece by piece. Much faster than s = s + x inside a loop.", "intents": ["build string", "concatenate in loop", "append text", "string builder"], "example": "StringBuilder sb = new StringBuilder();\nfor (int i = 1; i <= 3; i++) sb.append(i).append(\",\");\nSystem.out.println(sb.toString());  // → 1,2,3,", "cost": "O(1) per append", "pitfall": ""}, {"id": "sb-reverse", "group": "StringBuilder", "use": "new StringBuilder(s).reverse().toString()", "does": "Reverses a string.", "intents": ["reverse string", "backwards string", "palindrome check"], "example": "String r = new StringBuilder(\"abc\").reverse().toString();\nSystem.out.println(r);  // → cba", "cost": "O(n)", "pitfall": ""}, {"id": "sb-delete", "group": "StringBuilder", "use": "sb.deleteCharAt(i)  /  sb.setCharAt(i, c)", "does": "Removes or replaces one character (e.g. drop a trailing comma).", "intents": ["remove last character", "delete character", "replace character", "trailing comma"], "example": "StringBuilder sb = new StringBuilder(\"1,2,3,\");\nsb.deleteCharAt(sb.length() - 1);\nSystem.out.println(sb);  // → 1,2,3\nsb.setCharAt(0, '9');\nSystem.out.println(sb);  // → 9,2,3", "cost": "O(n)", "pitfall": ""}, {"id": "ch-checks", "group": "Character & char", "use": "Character.isLetterOrDigit(c)  /  isDigit  /  isLetter", "does": "Checks what kind of character c is.", "intents": ["is letter", "is digit", "alphanumeric", "skip punctuation", "check character type"], "example": "System.out.println(Character.isLetterOrDigit('a'));  // → true\nSystem.out.println(Character.isLetterOrDigit(','));  // → false\nSystem.out.println(Character.isDigit('7'));          // → true", "cost": "O(1)", "pitfall": ""}, {"id": "ch-case", "group": "Character & char", "use": "Character.toLowerCase(c)", "does": "Lower-cases one character.", "intents": ["lowercase char", "ignore case char", "uppercase char"], "example": "System.out.println(Character.toLowerCase('A'));  // → a\nSystem.out.println(Character.isUpperCase('A'));  // → true", "cost": "O(1)", "pitfall": ""}, {"id": "ch-math", "group": "Character & char", "use": "c - 'a'   /   (char) ('a' + i)   /   c - '0'", "does": "Characters are numbers: turn a letter into 0-25, a digit char into its value, and back.", "intents": ["char to index", "letter position", "digit character to int", "int to char", "alphabet index"], "example": "char c = 'd';\nSystem.out.println(c - 'a');           // → 3\nSystem.out.println((char) ('a' + 2));  // → c\nSystem.out.println('7' - '0');         // → 7", "cost": "O(1)", "pitfall": ""}, {"id": "ch-count", "group": "Character & char", "use": "int[] count = new int[26]; count[c - 'a']++", "does": "Counts letters with an array: faster and simpler than a map for a-z.", "intents": ["count letters", "letter frequency", "count characters", "anagram count"], "example": "int[] count = new int[26];\nfor (char ch : \"banana\".toCharArray()) count[ch - 'a']++;\nSystem.out.println(count['a' - 'a']);  // → 3\nSystem.out.println(count['n' - 'a']);  // → 2", "cost": "O(n)", "pitfall": ""}, {"id": "stack", "group": "Stack & Queue (ArrayDeque)", "use": "stack.push(x)  /  stack.pop()  /  stack.peek()", "does": "A stack: last in, first out. push adds on top, pop removes the top, peek looks at it.", "intents": ["stack", "push", "pop", "top of stack", "last in first out", "lifo", "brackets"], "example": "Deque<Integer> stack = new ArrayDeque<>();\nstack.push(1);\nstack.push(2);\nSystem.out.println(stack.peek());  // → 2\nSystem.out.println(stack.pop());   // → 2\nSystem.out.println(stack.peek());  // → 1", "cost": "O(1)", "pitfall": "Use ArrayDeque, not the old Stack class. pop() on an empty stack throws; check isEmpty() first."}, {"id": "deque-empty", "group": "Stack & Queue (ArrayDeque)", "use": "stack.isEmpty()  /  queue.isEmpty()", "does": "true when nothing is left. Guard every pop/peek with it.", "intents": ["is empty", "stack empty", "queue empty", "while not empty"], "example": "Deque<Character> stack = new ArrayDeque<>();\nSystem.out.println(stack.isEmpty());  // → true\nstack.push('(');\nSystem.out.println(stack.isEmpty());  // → false", "cost": "O(1)", "pitfall": ""}, {"id": "queue", "group": "Stack & Queue (ArrayDeque)", "use": "queue.offer(x)  /  queue.poll()  /  queue.peek()", "does": "A queue: first in, first out. offer adds at the back, poll removes from the front. Returns null when empty.", "intents": ["queue", "bfs", "first in first out", "fifo", "enqueue", "dequeue"], "example": "Deque<String> queue = new ArrayDeque<>();\nqueue.offer(\"first\");\nqueue.offer(\"second\");\nSystem.out.println(queue.poll());  // → first\nSystem.out.println(queue.peek());  // → second\nqueue.poll();\nSystem.out.println(queue.poll());  // → null", "cost": "O(1)", "pitfall": ""}, {"id": "queue-size", "group": "Stack & Queue (ArrayDeque)", "use": "int size = queue.size()", "does": "How many items are waiting. In BFS, read it before the inner loop to process one level.", "intents": ["level size", "bfs level", "queue size", "how many in queue"], "example": "Deque<Integer> queue = new ArrayDeque<>(List.of(4, 5, 6));\nint levelSize = queue.size();\nSystem.out.println(levelSize);  // → 3", "cost": "O(1)", "pitfall": ""}, {"id": "deque-ends", "group": "Stack & Queue (ArrayDeque)", "use": "dq.offerFirst / offerLast / pollFirst / pollLast / peekFirst / peekLast", "does": "A deque works at both ends (sliding window maximum, palindromes).", "intents": ["both ends", "deque", "remove from back", "add to front", "last element of queue"], "example": "Deque<Integer> dq = new ArrayDeque<>();\ndq.offerLast(1);\ndq.offerLast(2);\ndq.offerFirst(0);\nSystem.out.println(dq);              // → [0, 1, 2]\nSystem.out.println(dq.pollLast());   // → 2\nSystem.out.println(dq.peekFirst());  // → 0", "cost": "O(1)", "pitfall": ""}, {"id": "pq-min", "group": "PriorityQueue (heap)", "use": "new PriorityQueue<>()", "does": "A min-heap: poll() always returns the smallest item.", "intents": ["heap", "min heap", "smallest element", "priority queue", "always get smallest"], "example": "PriorityQueue<Integer> heap = new PriorityQueue<>();\nheap.offer(5);\nheap.offer(1);\nheap.offer(3);\nSystem.out.println(heap.peek());  // → 1\nSystem.out.println(heap.poll());  // → 1\nSystem.out.println(heap.poll());  // → 3", "cost": "offer/poll O(log n), peek O(1)", "pitfall": ""}, {"id": "pq-max", "group": "PriorityQueue (heap)", "use": "new PriorityQueue<>(Collections.reverseOrder())", "does": "A max-heap: poll() returns the largest.", "intents": ["max heap", "largest element", "biggest first"], "example": "PriorityQueue<Integer> heap = new PriorityQueue<>(Collections.reverseOrder());\nheap.offer(5);\nheap.offer(1);\nheap.offer(3);\nSystem.out.println(heap.poll());  // → 5", "cost": "O(log n)", "pitfall": ""}, {"id": "pq-custom", "group": "PriorityQueue (heap)", "use": "new PriorityQueue<int[]>((a, b) -> Integer.compare(a[1], b[1]))", "does": "A heap ordered by your rule, e.g. by the second value of each pair, or by a node's val.", "intents": ["heap with comparator", "custom heap", "sort heap by field", "heap of pairs", "heap of nodes"], "example": "PriorityQueue<int[]> heap = new PriorityQueue<>((a, b) -> Integer.compare(a[1], b[1]));\nheap.offer(new int[]{1, 30});\nheap.offer(new int[]{2, 10});\nSystem.out.println(heap.poll()[0]);  // → 2", "cost": "O(log n)", "pitfall": "Use Integer.compare(a, b), not a - b: subtraction can overflow."}, {"id": "pq-topk", "group": "PriorityQueue (heap)", "use": "if (heap.size() > k) heap.poll()", "does": "Keeps only the k largest items in a min-heap. Its top is then the kth largest.", "intents": ["top k", "kth largest", "keep k elements", "k biggest"], "example": "PriorityQueue<Integer> heap = new PriorityQueue<>();\nfor (int n : new int[]{4, 9, 1, 7}) {\n    heap.offer(n);\n    if (heap.size() > 2) heap.poll();\n}\nSystem.out.println(heap.peek());  // → 7", "cost": "O(n log k)", "pitfall": ""}, {"id": "math-maxmin", "group": "Math & numbers", "use": "Math.max(a, b)  /  Math.min(a, b)  /  Math.abs(x)", "does": "Bigger, smaller, distance from zero. Used for \"best so far\".", "intents": ["maximum", "minimum", "best so far", "absolute value", "bigger of two"], "example": "System.out.println(Math.max(3, 8));  // → 8\nSystem.out.println(Math.min(3, 8));  // → 3\nSystem.out.println(Math.abs(-4));    // → 4", "cost": "O(1)", "pitfall": ""}, {"id": "math-maxvalue", "group": "Math & numbers", "use": "Integer.MAX_VALUE  /  Integer.MIN_VALUE", "does": "The biggest and smallest int. Start a \"minimum so far\" at MAX_VALUE.", "intents": ["infinity", "largest int", "start minimum", "initial best"], "example": "int best = Integer.MAX_VALUE;\nfor (int p : new int[]{7, 1, 5}) best = Math.min(best, p);\nSystem.out.println(best);  // → 1", "cost": "", "pitfall": ""}, {"id": "math-overflow", "group": "Math & numbers", "use": "(long) a + b", "does": "int tops out near 2.1 billion. Cast to long before adding or multiplying big numbers.", "intents": ["overflow", "big numbers", "long", "sum too large"], "example": "int big = 2_000_000_000;\nSystem.out.println(big + big);         // → -294967296\nSystem.out.println((long) big + big);  // → 4000000000", "cost": "", "pitfall": ""}, {"id": "math-division", "group": "Math & numbers", "use": "a / b   a % b   (a + b - 1) / b", "does": "Integer division drops the decimal; % gives the remainder; the last form rounds up.", "intents": ["divide", "remainder", "modulo", "round up", "ceiling division", "even or odd"], "example": "System.out.println(7 / 2);            // → 3\nSystem.out.println(7 % 2);            // → 1\nSystem.out.println((7 + 2 - 1) / 2);  // → 4", "cost": "O(1)", "pitfall": ""}, {"id": "math-compare", "group": "Math & numbers", "use": "Integer.compare(a, b)", "does": "Negative if a < b, 0 if equal, positive if a > b. Use it inside comparators.", "intents": ["comparator", "compare numbers", "sort rule"], "example": "System.out.println(Integer.compare(3, 5));  // → -1\nSystem.out.println(Integer.compare(5, 5));  // → 0", "cost": "O(1)", "pitfall": ""}, {"id": "math-integer-equals", "group": "Math & numbers", "use": "x.equals(y) for Integer objects", "does": "Numbers from a map or list are Integer objects. Compare them with equals, not ==.", "intents": ["compare integers from map", "integer equality", "boxed integer"], "example": "Map<String, Integer> m = new HashMap<>();\nm.put(\"a\", 1000);\nm.put(\"b\", 1000);\nSystem.out.println(m.get(\"a\").equals(m.get(\"b\")));  // → true\nSystem.out.println(m.get(\"a\") == m.get(\"b\"));       // → false", "cost": "", "pitfall": "== happens to work for -128 to 127, which hides the bug in small tests."}, {"id": "arr-stream-sum", "group": "Math & numbers", "use": "Arrays.stream(arr).sum()  /  .max().getAsInt()", "does": "Sum or max of an int array in one line.", "intents": ["sum of array", "total", "max of array", "add all numbers"], "example": "int[] nums = {1, 2, 3};\nSystem.out.println(Arrays.stream(nums).sum());              // → 6\nSystem.out.println(Arrays.stream(nums).max().getAsInt());  // → 3", "cost": "O(n)", "pitfall": ""}, {"id": "coll-maxmin", "group": "Math & numbers", "use": "Collections.max(list)  /  Collections.min(list)", "does": "Largest or smallest element of a list.", "intents": ["max of list", "min of list", "largest in list"], "example": "List<Integer> list = List.of(4, 9, 2);\nSystem.out.println(Collections.max(list));  // → 9\nSystem.out.println(Collections.min(list));  // → 2", "cost": "O(n)", "pitfall": ""}, {"id": "treemap", "group": "TreeMap (sorted map)", "use": "treeMap.firstKey()  /  floorKey(x)  /  ceilingKey(x)", "does": "A map that keeps keys sorted. floorKey: largest key ≤ x. ceilingKey: smallest key ≥ x.", "intents": ["sorted map", "nearest key", "closest smaller", "closest bigger", "floor", "ceiling", "ordered keys"], "example": "TreeMap<Integer, String> t = new TreeMap<>();\nt.put(10, \"ten\");\nt.put(20, \"twenty\");\nt.put(30, \"thirty\");\nSystem.out.println(t.firstKey());      // → 10\nSystem.out.println(t.floorKey(25));    // → 20\nSystem.out.println(t.ceilingKey(25));  // → 30", "cost": "O(log n)", "pitfall": ""}, {"id": "st-filter-map", "group": "Streams", "use": "list.stream().filter(...).map(...).toList()", "does": "The basic pipeline: keep what matches, transform it, collect the result.", "intents": ["stream basics", "filter and map", "transform list", "keep matching", "new list from list"], "example": "List<String> names = List.of(\"asha\", \"ravi\", \"ab\");\nList<String> result = names.stream()\n        .filter(n -> n.length() > 2)\n        .map(String::toUpperCase)\n        .toList();\nSystem.out.println(result);  // → [ASHA, RAVI]", "cost": "O(n)", "pitfall": "toList() (Java 16+) returns an unmodifiable list; use collect(Collectors.toList()) if you need to add to it."}, {"id": "st-groupingby-count", "group": "Streams", "use": "collect(Collectors.groupingBy(key, Collectors.counting()))", "does": "Counts how many items fall into each group.", "intents": ["count by group", "frequency with streams", "group and count", "how many per category", "character frequency"], "example": "List<String> words = List.of(\"go\", \"java\", \"go\", \"kotlin\", \"go\");\nMap<String, Long> count = words.stream()\n        .collect(Collectors.groupingBy(w -> w, TreeMap::new, Collectors.counting()));\nSystem.out.println(count);  // → {go=3, java=1, kotlin=1}", "cost": "O(n)", "pitfall": "Pass TreeMap::new or LinkedHashMap::new as the middle argument when the order of keys matters."}, {"id": "st-groupingby-list", "group": "Streams", "use": "collect(Collectors.groupingBy(key))  /  mapping(field, toList())", "does": "Groups items into lists by a key; mapping keeps only one field of each item.", "intents": ["group by", "group into lists", "group by department", "map of lists with streams", "names per group"], "example": "record Emp(String name, String dept) {}\nList<Emp> emps = List.of(new Emp(\"Asha\", \"Eng\"), new Emp(\"Ravi\", \"Eng\"), new Emp(\"Isha\", \"HR\"));\nMap<String, List<String>> byDept = emps.stream()\n        .collect(Collectors.groupingBy(Emp::dept, TreeMap::new,\n                 Collectors.mapping(Emp::name, Collectors.toList())));\nSystem.out.println(byDept);  // → {Eng=[Asha, Ravi], HR=[Isha]}", "cost": "O(n)", "pitfall": ""}, {"id": "st-averaging", "group": "Streams", "use": "Collectors.averagingDouble / summingInt / summarizingDouble", "does": "Average, sum or full statistics per group.", "intents": ["average per group", "sum per group", "total by category", "statistics", "average salary"], "example": "record Emp(String dept, double salary) {}\nList<Emp> emps = List.of(new Emp(\"Eng\", 100), new Emp(\"Eng\", 200), new Emp(\"HR\", 70));\nMap<String, Double> avg = emps.stream()\n        .collect(Collectors.groupingBy(Emp::dept, TreeMap::new, Collectors.averagingDouble(Emp::salary)));\nSystem.out.println(avg);  // → {Eng=150.0, HR=70.0}", "cost": "O(n)", "pitfall": ""}, {"id": "st-partitioning", "group": "Streams", "use": "collect(Collectors.partitioningBy(predicate))", "does": "Splits items into two lists: those matching a yes/no rule (true) and the rest (false).", "intents": ["split in two", "even and odd", "pass and fail", "partition"], "example": "Map<Boolean, List<Integer>> parts = List.of(1, 2, 3, 4).stream()\n        .collect(Collectors.partitioningBy(n -> n % 2 == 0));\nSystem.out.println(parts);  // → {false=[1, 3], true=[2, 4]}", "cost": "O(n)", "pitfall": ""}, {"id": "st-tomap", "group": "Streams", "use": "collect(Collectors.toMap(key, value, merge, LinkedHashMap::new))", "does": "Builds a map from a list. Always pass a merge function if keys can repeat.", "intents": ["list to map", "map from list", "id to name", "index by key", "duplicate keys"], "example": "record User(int id, String name) {}\nList<User> users = List.of(new User(1, \"Asha\"), new User(2, \"Ravi\"), new User(1, \"Asha2\"));\nMap<Integer, String> m = users.stream()\n        .collect(Collectors.toMap(User::id, User::name, (first, second) -> first, LinkedHashMap::new));\nSystem.out.println(m);  // → {1=Asha, 2=Ravi}", "cost": "O(n)", "pitfall": "Without the merge function, a duplicate key throws IllegalStateException."}, {"id": "st-joining", "group": "Streams", "use": "collect(Collectors.joining(\", \", \"[\", \"]\"))", "does": "Glues strings with a separator, plus an optional prefix and suffix.", "intents": ["join with comma", "comma separated with streams", "build string from list", "concatenate"], "example": "String s = List.of(\"a\", \"b\", \"c\").stream()\n        .collect(Collectors.joining(\", \", \"[\", \"]\"));\nSystem.out.println(s);  // → [a, b, c]", "cost": "O(n)", "pitfall": ""}, {"id": "st-flatmap", "group": "Streams", "use": "stream.flatMap(list -> list.stream())", "does": "Turns a stream of lists into one flat stream.", "intents": ["flatten", "list of lists to list", "nested lists", "flatmap"], "example": "List<List<Integer>> nested = List.of(List.of(1, 2), List.of(3));\nList<Integer> flat = nested.stream()\n        .flatMap(List::stream)\n        .toList();\nSystem.out.println(flat);  // → [1, 2, 3]", "cost": "O(total)", "pitfall": ""}, {"id": "st-sorted", "group": "Streams", "use": "sorted(Comparator.comparing(...).reversed().thenComparing(...))", "does": "Sorts with your own rule: by one field, descending, then by another.", "intents": ["sort with streams", "sort by field", "sort descending stream", "sort by two fields", "comparator"], "example": "record Emp(String name, int salary) {}\nList<String> names = List.of(new Emp(\"Ravi\", 100), new Emp(\"Asha\", 150), new Emp(\"Dev\", 100)).stream()\n        .sorted(Comparator.comparingInt(Emp::salary).reversed().thenComparing(Emp::name))\n        .map(Emp::name)\n        .toList();\nSystem.out.println(names);  // → [Asha, Dev, Ravi]", "cost": "O(n log n)", "pitfall": ""}, {"id": "st-distinct-skip-limit", "group": "Streams", "use": "distinct()  /  skip(n)  /  limit(n)", "does": "Remove duplicates, skip the first n, keep only the first n.", "intents": ["remove duplicates stream", "second highest", "top n", "first n", "skip"], "example": "List<Integer> r = List.of(5, 3, 5, 9, 1).stream()\n        .distinct()\n        .sorted(Comparator.reverseOrder())\n        .skip(1)\n        .limit(2)\n        .toList();\nSystem.out.println(r);  // → [5, 3]", "cost": "", "pitfall": ""}, {"id": "st-find-max", "group": "Streams", "use": "findFirst()  /  max(comparator)  /  min(comparator)", "does": "Gets one element as an Optional: the first, the biggest or the smallest.", "intents": ["first match", "longest string", "max with comparator", "find one element", "optional result"], "example": "List<String> words = List.of(\"go\", \"java\", \"kotlin\");\nSystem.out.println(words.stream().max(Comparator.comparingInt(String::length)).get());  // → kotlin\nSystem.out.println(words.stream().filter(w -> w.startsWith(\"j\")).findFirst().orElse(\"none\"));  // → java", "cost": "O(n)", "pitfall": ""}, {"id": "st-match", "group": "Streams", "use": "anyMatch / allMatch / noneMatch", "does": "Yes/no questions about a stream; they stop as soon as the answer is known.", "intents": ["check all", "check any", "contains with streams", "validate all elements", "palindrome intstream"], "example": "List<Integer> nums = List.of(2, 4, 7);\nSystem.out.println(nums.stream().allMatch(n -> n % 2 == 0));  // → false\nSystem.out.println(nums.stream().anyMatch(n -> n > 5));       // → true", "cost": "O(n), short-circuits", "pitfall": ""}, {"id": "st-intstream", "group": "Streams", "use": "IntStream.range(a, b)  /  mapToInt(...).sum()  /  s.chars()", "does": "Primitive streams: loops over numbers, fast sums and string characters without boxing.", "intents": ["sum with streams", "range of numbers", "loop with streams", "characters of string", "intstream", "primitive stream"], "example": "System.out.println(IntStream.range(0, 5).sum());                       // → 10\nSystem.out.println(List.of(1, 2, 3).stream().mapToInt(n -> n * n).sum()); // → 14\nSystem.out.println(\"java\".chars().filter(c -> c == 'a').count());       // → 2", "cost": "O(n)", "pitfall": ""}, {"id": "st-collectingandthen", "group": "Streams", "use": "collectingAndThen(maxBy(...), opt -> opt.get().name())", "does": "Runs a final step on each group's result, e.g. unwrapping the Optional from maxBy.", "intents": ["max per group", "highest per department", "top earner", "post-process collector"], "example": "record Emp(String name, String dept, int salary) {}\nList<Emp> emps = List.of(new Emp(\"Asha\", \"Eng\", 120), new Emp(\"Ravi\", \"Eng\", 150), new Emp(\"Isha\", \"HR\", 70));\nMap<String, String> top = emps.stream()\n        .collect(Collectors.groupingBy(Emp::dept, TreeMap::new,\n                 Collectors.collectingAndThen(Collectors.maxBy(Comparator.comparingInt(Emp::salary)), o -> o.get().name())));\nSystem.out.println(top);  // → {Eng=Ravi, HR=Isha}", "cost": "O(n)", "pitfall": ""}, {"id": "st-reduce", "group": "Streams", "use": "reduce(identity, accumulator)", "does": "Combines all elements into one value. Prefer sum(), max() or a collector when one exists.", "intents": ["reduce", "combine all", "product of numbers", "fold"], "example": "int product = List.of(1, 2, 3, 4).stream().reduce(1, (a, b) -> a * b);\nSystem.out.println(product);  // → 24", "cost": "O(n)", "pitfall": ""}], "quiz": [{"setup": "", "body": "String a = \"hello\";\nString b = \"hel\" + \"lo\";\nString c = new String(\"hello\");\nSystem.out.println((a == b) + \" \" + (a == c));", "options": ["true false", "true true", "false false", "false true"], "answer": 0, "why": "\"hel\" + \"lo\" is joined at compile time, so b is the same pooled literal as a. new String always creates a new object."}, {"setup": "", "body": "Integer x = 127, y = 127;\nInteger p = 128, q = 128;\nSystem.out.println((x == y) + \" \" + (p == q));", "options": ["true true", "true false", "false false", "false true"], "answer": 1, "why": "Integer caches -128 to 127, so x and y are the same object. 128 is outside the cache: two objects. Use equals()."}, {"setup": "static int f() {\n    try { return 1; }\n    finally { return 2; }\n}", "body": "System.out.println(f());", "options": ["1", "2", "Compile error", "Exception"], "answer": 1, "why": "finally runs before the method returns, and a return inside finally overrides the try's return. Never return from finally."}, {"setup": "static int g() {\n    int x = 1;\n    try { return x; }\n    finally { x = 5; }\n}", "body": "System.out.println(g());", "options": ["1", "5", "0", "Compile error"], "answer": 0, "why": "The value 1 is saved when return runs. Changing the local variable in finally doesn't change the saved return value."}, {"setup": "", "body": "System.out.println(1 + 2 + \"3\" + 4 + 5);", "options": ["15", "3345", "12345", "339"], "answer": 1, "why": "Left to right: 1 + 2 = 3 (numbers), then \"3\" + \"3\" makes a String, and after that everything is concatenated: 3345."}, {"setup": "", "body": "System.out.println('a' + 1);\nSystem.out.println(\"\" + 'a' + 1);", "options": ["98 / a1 (two lines)", "a1 / a1", "98 / 98", "b / a1"], "answer": 0, "why": "char + int is int arithmetic: 'a' is 97, so 98. Starting with \"\" turns it into string concatenation: a1."}, {"setup": "static void m(Object o) { System.out.println(\"Object\"); }\nstatic void m(String s) { System.out.println(\"String\"); }", "body": "m(null);", "options": ["Object", "String", "Compile error: ambiguous", "NullPointerException"], "answer": 1, "why": "Overloading picks the most specific applicable method at compile time. String is more specific than Object."}, {"setup": "static class P {\n    static { System.out.print(\"1\"); }\n    { System.out.print(\"2\"); }\n    P() { System.out.print(\"3\"); }\n}\nstatic class C extends P {\n    static { System.out.print(\"4\"); }\n    { System.out.print(\"5\"); }\n    C() { System.out.print(\"6\"); }\n}", "body": "new C();\nSystem.out.println();", "options": ["123456", "142356", "415263", "124356"], "answer": 1, "why": "Static blocks run first, parent then child (1, 4). Then for the object: parent instance block and constructor (2, 3), then child (5, 6)."}, {"setup": "static class A {\n    static { System.out.print(\"S\"); }\n    { System.out.print(\"I\"); }\n    A() { System.out.print(\"C\"); }\n}", "body": "new A();\nnew A();\nSystem.out.println();", "options": ["SICSIC", "SICIC", "SIICC", "ICSIC"], "answer": 1, "why": "The static block runs once, when the class is first initialised. The instance block and constructor run for every object."}, {"setup": "", "body": "List<Integer> key = new ArrayList<>(List.of(1));\nMap<List<Integer>, String> m = new HashMap<>();\nm.put(key, \"v\");\nkey.add(2);\nSystem.out.println(m.get(key) + \" \" + m.size());", "options": ["v 1", "null 1", "null 0", "ConcurrentModificationException"], "answer": 1, "why": "Changing the key changed its hashCode, so get() looks in the wrong bucket. The entry is still there (size 1) but unreachable."}, {"setup": "", "body": "List<Integer> list = new ArrayList<>(List.of(1, 2, 3));\nfor (Integer n : list) {\n    if (n == 2) list.remove(n);\n}\nSystem.out.println(list);", "options": ["[1, 3]", "ConcurrentModificationException", "[1, 2, 3]", "[3]"], "answer": 0, "why": "A trick case: removing the second-to-last element makes hasNext() return false, so the loop just ends without the modCount check. Remove any other element and it throws. Use removeIf."}, {"setup": "", "body": "Integer n = null;\nboolean flag = false;\ntry {\n    Integer r = flag ? 1 : n;\n    System.out.println(r);\n} catch (Exception e) {\n    System.out.println(e.getClass().getSimpleName());\n}", "options": ["null", "0", "NullPointerException", "1"], "answer": 2, "why": "Because 1 is a primitive int, the ternary unboxes n to int, and unboxing null throws NullPointerException."}, {"setup": "", "body": "int[] arr = {1, 2, 3};\nSystem.out.println(Arrays.asList(arr).s /* ---------- account sync ---------- */

    P.filter(p => state.status[p.id] === "help" && state.statusAt[p.id] && state.statusAt[p.id] < todayIso).slice(0, 2)

  }
  if (ui.minMode) {

    D.tasks.forEach((t, i) => { const deck = deckFor(t); items.push({ kind: "task", id: "d" + day + "-" + i, text: t, href: /Streams coding set/.test(t) ? "#streams" : deck ? "#cards" : null, deck }); });

}

/* ---------- Code puzzle: tap the line for the highlighted gap ---------- */

      <div class="btnrow">${p.slug ? `<a class="btn primary" href="https://leetcode.com/problems/${p.slug}/" target="_blank" rel="noopener">Solve on LeetCode ↗</a>` : ""}

  else if (act === "taskdone") { state.tasks[id] = true; touch(); render(); }

    touch(); render();

  else if (act === "qnext" || act === "qprev") {
    ui.cardIdx.quiz = Math.max(0, (ui.cardIdx.quiz || 0) + (act === "qnext" ? 1 : -1));
    const list = ui.onlyAgain ? QUIZ.map((q, i) => i).filter(i => state.cards["quiz-" + i] === "again") : QUIZ.map((q, i) => i);
    const qi = list[Math.min(ui.cardIdx.quiz, list.length - 1)];
    if (qi !== undefined) delete ui.quizPick[qi];
    render(); window.scrollTo(0, 0);
  }
  else if (act === "mark") {
    state.cards[el.dataset.k] = el.dataset.v; touch();
    const len = deckCards().length;
    if (!ui.onlyAgain || el.dataset.v === "again") ui.cardIdx[ui.deck] = Math.min((ui.cardIdx[ui.deck] || 0) + 1, Math.max(0, len - 1));
    ui.flipped = false; render();
  }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset && el.dataset.act === "task") { if (el.checked) state.tasks[el.dataset.id] = true; else delete state.tasks[el.dataset.id]; touch(); render(); }
  else if (el.id === "onlyAgain") { ui.onlyAgain = el.checked; ui.cardIdx[ui.deck] = 0; ui.flipped = false; render(); }
  else if (el.id === "deckSel") { ui.deck = el.value; ui.flipped = false; saveUi(); render(); }
});
document.addEventListener("input", e => {
  if (e.target.id === "tbSearch") { ui.tbq = e.target.value; document.getElementById("helpResults").innerHTML = helpResults(); }
});
document.addEventListener("keydown", e => {
  if (route().view !== "cards" || e.target.closest("input, textarea, select")) return;
  if ((e.key === " " && !e.target.closest("button")) || (e.key === "Enter" && e.target.closest(".flash"))) { e.preventDefault(); ui.flipped = !ui.flipped; render(); }
});
window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });
render();
</script>
</body></html>
